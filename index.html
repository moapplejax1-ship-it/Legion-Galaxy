// ═══ GLOBE VIEW ═══

(function(){

// ── internal state ──
let _canvas=null, _ctx=null, _rafId=null;
let _touchStartX=0;
// hit regions for click detection (populated each render)
let _hitRegions=[]; // {type:'arrow-left'|'arrow-right'|'panel', contIdx, x,y,w,h}

// ── init ──
function initGlobeView(){
  const list=document.getElementById('continent-list');
  if(!list) return;
  list.innerHTML='';
  let c=document.getElementById('globe-view');
  if(!c){
    c=document.createElement('canvas');
    c.id='globe-view';
    c.style.width='100%';
    c.style.display='block';
    c.style.cursor='pointer';
    list.appendChild(c);
  }
  _canvas=c;
  _ctx=c.getContext('2d');

  // size canvas to container
  _resizeCanvas();

  // input
  c.addEventListener('click',_onClick);
  c.addEventListener('touchstart',_onTouchStart,{passive:true});
  c.addEventListener('touchend',_onTouchEnd,{passive:true});

  _resizeCanvas();
  renderGlobeView();
  _startLoop();
}

function _resizeCanvas(){
  if(!_canvas) return;
  const parent=_canvas.parentElement;
  const w=Math.max(parent?parent.clientWidth:0,280);
  _canvas.width=w;
  _canvas.height=Math.round(w*0.9);
}

// ── animation loop ──
function _startLoop(){
  if(_rafId) return;
  function loop(){
    const el=document.getElementById('globe-view');
    if(!el){_rafId=null;return;}
    // only redraw if home screen is visible
    const homeScreen=document.getElementById('screen-home');
    if(homeScreen && homeScreen.classList.contains('active')){
      renderGlobeView();
    }
    _rafId=requestAnimationFrame(loop);
  }
  _rafId=requestAnimationFrame(loop);
}

// ── main render ──
function renderGlobeView(){
  if(!_canvas||!_ctx) return;
  _resizeCanvas();
  const c=_canvas, ctx=_ctx;
  const W=c.width, H=c.height;
  const now=Date.now();

  ctx.clearRect(0,0,W,H);
  _hitRegions=[];

  // background
  ctx.fillStyle='#0b0d08';
  ctx.fillRect(0,0,W,H);

  // stars (seeded, twinkling)
  _drawStars(ctx,W,H,now);

  // horizon glow
  const horizonY=H*0.60;
  const hg=ctx.createLinearGradient(0,horizonY-30,0,horizonY+60);
  hg.addColorStop(0,'rgba(200,116,40,0)');
  hg.addColorStop(0.4,'rgba(200,116,40,0.07)');
  hg.addColorStop(1,'rgba(140,80,20,0.18)');
  ctx.fillStyle=hg;
  ctx.fillRect(0,horizonY-30,W,90);

  // horizon line
  ctx.strokeStyle='rgba(200,116,40,0.18)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,horizonY);ctx.lineTo(W,horizonY);ctx.stroke();

  // planet sphere in background (center-top)
  const pgx=W/2, pgy=H*0.22, pgr=90;
  const pg=ctx.createRadialGradient(pgx-20,pgy-20,10,pgx,pgy,pgr);
  pg.addColorStop(0,'rgba(220,150,60,0.22)');
  pg.addColorStop(0.5,'rgba(180,90,30,0.12)');
  pg.addColorStop(1,'rgba(100,50,10,0)');
  ctx.fillStyle=pg;
  ctx.beginPath();ctx.arc(pgx,pgy,pgr,0,Math.PI*2);ctx.fill();

  // continent panels
  const conts=state.planet.continents;
  const sel=state.selCont;
  const n=conts.length; // 5
  // circular shift so sel is at center (index 2)
  const order=[];
  for(let i=0;i<n;i++) order.push((sel-2+i+n)%n);
  // order[0..4] = continent indices for positions -2,-1,0,1,2
  // draw back to front: positions 0,4 first, then 1,3, then 2
  const drawSeq=[0,4,1,3,2];

  const baseW=W*0.36;
  const baseH=baseW*(7/10);
  const positions=[-2,-1,0,1,2];

  function getPanelProps(pos){
    const absP=Math.abs(pos);
    const cx2=W/2+pos*(W*0.22);
    const cy2=H*0.52+absP*(H*0.06);
    const scale=1.0-absP*0.22;
    const alpha=1.0-absP*0.25;
    const pw=baseW*scale;
    const ph=baseH*scale;
    return{cx:cx2,cy:cy2,pw,ph,scale,alpha};
  }

  for(const si of drawSeq){
    const pos=positions[si];
    const contIdx=order[si];
    const cont=conts[contIdx];
    const isSelected=(si===2);
    const pp=getPanelProps(pos);
    ctx.save();
    ctx.globalAlpha=pp.alpha;
    drawContinentPanel(ctx,cont,pp.cx,pp.cy,pp.pw,pp.ph,isSelected,contIdx,now);
    ctx.restore();
    // register hit region
    _hitRegions.push({
      type: isSelected?'panel-selected':'panel',
      contIdx,
      x:pp.cx-pp.pw/2, y:pp.cy-pp.ph/2, w:pp.pw, h:pp.ph,
      isSelected
    });
  }

  // arrow buttons
  _drawArrow(ctx,20,H*0.55,'◀',W,H);
  _drawArrow(ctx,W-20,H*0.55,'▶',W,H);
  _hitRegions.push({type:'arrow-left', x:0,y:H*0.35,w:W*0.12,h:H*0.35});
  _hitRegions.push({type:'arrow-right',x:W*0.88,y:H*0.35,w:W*0.12,h:H*0.35});
}

function _drawStars(ctx,W,H,now){
  const rng=mkRng(42);
  const count=60;
  for(let i=0;i<count;i++){
    const sx=rng()*W;
    const sy=rng()*(H*0.58);
    const twinkle=0.4+0.6*Math.abs(Math.sin(now*0.0008+i*2.1));
    const r=0.5+rng()*1.2;
    ctx.beginPath();
    ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,230,${twinkle*0.8})`;
    ctx.fill();
  }
}

function _drawArrow(ctx,cx,cy,label,W,H){
  ctx.save();
  ctx.font='bold 22px monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle='rgba(212,168,50,0.7)';
  ctx.fillText(label,cx,cy);
  ctx.restore();
}

// ── draw one continent panel ──
function drawContinentPanel(ctx,cont,cx,cy,panelW,panelH,isSelected,contIdx,now){
  const px=cx-panelW/2, py=cy-panelH/2;
  const now2=now||Date.now();

  ctx.save();
  // clip to panel
  ctx.beginPath();
  ctx.rect(px,py,panelW,panelH);
  ctx.clip();

  // terrain background
  const offscreen=document.createElement('canvas');
  offscreen.width=Math.ceil(panelW);
  offscreen.height=Math.ceil(panelH);
  const oc=offscreen.getContext('2d');
  const rng=mkRng(strSeed(cont.name));
  paintTerrain(oc,panelW,panelH,rng,cont.conquered,cont.threat);
  ctx.drawImage(offscreen,px,py);

  if(cont.conquered){
    // grid lines
    const cellSize=panelW/GCOLS;
    ctx.strokeStyle='rgba(255,255,255,0.04)';
    ctx.lineWidth=0.5;
    for(let gx=0;gx<=GCOLS;gx++){
      const lx=px+gx*cellSize;
      ctx.beginPath();ctx.moveTo(lx,py);ctx.lineTo(lx,py+panelH);ctx.stroke();
    }
    for(let gy=0;gy<=GROWS;gy++){
      const ly=py+gy*cellSize;
      ctx.beginPath();ctx.moveTo(px,ly);ctx.lineTo(px+panelW,ly);ctx.stroke();
    }
    // buildings
    if(cont.bldgs && cont.bldgs.length){
      ctx.save();
      ctx.translate(px,py);
      cont.bldgs.forEach(b=>{
        drawGridBuilding(ctx,b,cellSize,now2);
      });
      ctx.restore();
    }
  } else {
    // alien formation
    drawAlienDefensiveFormation(ctx,cont,px,py,panelW,panelH);
    // red vignette
    ctx.fillStyle='rgba(192,48,16,0.15)';
    ctx.fillRect(px,py,panelW,panelH);
  }

  ctx.restore(); // end clip

  // border
  const pulse=isSelected?(0.7+0.3*Math.sin(now2*0.004)):1;
  if(isSelected){
    if(cont.conquered){
      ctx.shadowColor='rgba(212,168,50,0.8)';
      ctx.shadowBlur=10*pulse;
      ctx.strokeStyle=`rgba(212,168,50,${pulse})`;
      ctx.lineWidth=2.5;
    } else {
      ctx.shadowColor='rgba(192,48,16,0.9)';
      ctx.shadowBlur=12*pulse;
      ctx.strokeStyle=`rgba(192,48,16,${pulse})`;
      ctx.lineWidth=2.5;
    }
  } else {
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(58,66,40,0.7)';
    ctx.lineWidth=1;
  }
  ctx.strokeRect(px,py,panelW,panelH);
  ctx.shadowBlur=0;

  // label below panel
  const labelY=py+panelH+14;
  ctx.save();
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  if(isSelected){
    ctx.font='bold 11px monospace';
    ctx.fillStyle='#d4a832';
  } else {
    ctx.font='9px monospace';
    ctx.fillStyle='#6a6858';
  }
  ctx.fillText(cont.name.toUpperCase(),cx,labelY);

  // badge
  const badgeY=labelY+13;
  if(cont.conquered){
    ctx.font='bold 9px monospace';
    ctx.fillStyle='#5a8a3c';
    ctx.fillText('SECURED',cx,badgeY);
  } else {
    ctx.font='bold 9px monospace';
    ctx.fillStyle=cont.threat==='FORTIFIED'?'#c03010':'#c87428';
    ctx.fillText(cont.threat,cx,badgeY);
  }
  ctx.restore();

  // selection chevron below center
  if(isSelected){
    ctx.save();
    ctx.fillStyle='rgba(212,168,50,0.85)';
    const tx=cx, ty=py-8;
    ctx.beginPath();
    ctx.moveTo(tx-7,ty-6);
    ctx.lineTo(tx+7,ty-6);
    ctx.lineTo(tx,ty);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// ── alien formation ──
function drawAlienDefensiveFormation(ctx,cont,panelX,panelY,panelW,panelH){
  const aliens=cont.aliens||{infantry:0,tanks:0,cavalry:0};
  const laneW=panelW/3;
  const rng=mkRng(strSeed(cont.name+'form'));

  for(let li=0;li<3;li++){
    const laneX=panelX+li*laneW;
    const laneInf=Math.floor(aliens.infantry/3);
    const laneTnk=Math.floor(aliens.tanks/3);
    const laneCav=Math.floor(aliens.cavalry/3);

    // rear wall (75% depth)
    const wallY=panelY+panelH*0.30;
    const wallH2=4;
    ctx.fillStyle='rgba(100,100,80,0.7)';
    ctx.fillRect(laneX+2,wallY,laneW-4,wallH2);
    // crenellations
    const crW=4,crH=3,crStep=7;
    for(let cx2=laneX+4;cx2<laneX+laneW-4;cx2+=crStep){
      ctx.fillRect(cx2,wallY-crH,crW,crH);
    }
    // turret dots at ends
    const turretR=3;
    ctx.fillStyle='rgba(140,120,60,0.8)';
    ctx.beginPath();ctx.arc(laneX+3,wallY,turretR,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(laneX+laneW-3,wallY,turretR,0,Math.PI*2);ctx.fill();

    // infantry dots (mid line 55% depth)
    const infDots=Math.max(1,Math.round(laneInf/25));
    const infY=panelY+panelH*0.55;
    ctx.fillStyle='rgba(200,50,20,0.85)';
    const infSpacing=laneW/(infDots+1);
    for(let d=0;d<infDots;d++){
      ctx.beginPath();
      ctx.arc(laneX+(d+1)*infSpacing,infY,3,0,Math.PI*2);
      ctx.fill();
    }

    // tank squares (70% depth)
    const tnkUnits=Math.max(0,Math.round(laneTnk/8));
    if(tnkUnits>0){
      const tnkY=panelY+panelH*0.70;
      ctx.fillStyle='rgba(220,140,30,0.85)';
      const tnkSpacing=laneW/(tnkUnits+1);
      for(let d=0;d<tnkUnits;d++){
        const tx2=laneX+(d+1)*tnkSpacing-3;
        ctx.fillRect(tx2,tnkY-3,6,5);
      }
    }

    // cavalry triangles at flanks (65% depth)
    const cavUnits=Math.max(0,Math.round(laneCav/5));
    if(cavUnits>0){
      const cavY=panelY+panelH*0.65;
      ctx.fillStyle='rgba(212,200,50,0.85)';
      // left flank
      ctx.beginPath();
      ctx.moveTo(laneX+4,cavY+4);
      ctx.lineTo(laneX+8,cavY+4);
      ctx.lineTo(laneX+6,cavY-2);
      ctx.closePath();ctx.fill();
      // right flank
      ctx.beginPath();
      ctx.moveTo(laneX+laneW-8,cavY+4);
      ctx.lineTo(laneX+laneW-4,cavY+4);
      ctx.lineTo(laneX+laneW-6,cavY-2);
      ctx.closePath();ctx.fill();
    }
  }

  // total defenders text
  const total=aliens.infantry+aliens.tanks+aliens.cavalry;
  ctx.save();
  ctx.font='bold 8px monospace';
  ctx.textAlign='center';
  ctx.textBaseline='bottom';
  ctx.fillStyle='rgba(255,100,60,0.9)';
  ctx.fillText(`👾 ${total} defenders`,panelX+panelW/2,panelY+panelH-2);
  ctx.restore();
}

// ── input handlers ──
function _onClick(e){
  if(!_canvas) return;
  const rect=_canvas.getBoundingClientRect();
  const scaleX=_canvas.width/rect.width;
  const scaleY=_canvas.height/rect.height;
  const mx=(e.clientX-rect.left)*scaleX;
  const my=(e.clientY-rect.top)*scaleY;
  _handleHit(mx,my);
}

function _onTouchStart(e){
  if(e.touches.length>0) _touchStartX=e.touches[0].clientX;
}

function _onTouchEnd(e){
  if(!_canvas) return;
  if(e.changedTouches.length===0) return;
  const dx=e.changedTouches[0].clientX-_touchStartX;
  if(Math.abs(dx)>40){
    if(dx<0){ // swipe left → go right (next)
      state.selCont=(state.selCont+1)%5;
    } else { // swipe right → go left (prev)
      state.selCont=(state.selCont+4)%5;
    }
    renderGlobeView();
    return;
  }
  // treat as tap
  const rect=_canvas.getBoundingClientRect();
  const scaleX=_canvas.width/rect.width;
  const scaleY=_canvas.height/rect.height;
  const mx=(e.changedTouches[0].clientX-rect.left)*scaleX;
  const my=(e.changedTouches[0].clientY-rect.top)*scaleY;
  _handleHit(mx,my);
}

function _handleHit(mx,my){
  // check hit regions back to front (last drawn = on top)
  const regions=[..._hitRegions].reverse();
  for(const r of regions){
    if(mx>=r.x && mx<=r.x+r.w && my>=r.y && my<=r.y+r.h){
      if(r.type==='arrow-left'){
        state.selCont=(state.selCont+4)%5;
        renderGlobeView();
        return;
      }
      if(r.type==='arrow-right'){
        state.selCont=(state.selCont+1)%5;
        renderGlobeView();
        return;
      }
      if(r.type==='panel-selected'){
        openContinent(state.selCont);
        return;
      }
      if(r.type==='panel'){
        state.selCont=r.contIdx;
        renderGlobeView();
        return;
      }
    }
  }
}

// ── refresh wrapper ──
function refreshGlobeView(){
  if(!document.getElementById('globe-view')) return;
  if(!_canvas||!_ctx){
    const list=document.getElementById('continent-list');
    if(list && list.querySelector('#globe-view')){
      _canvas=document.getElementById('globe-view');
      _ctx=_canvas.getContext('2d');
    } else {
      return;
    }
  }
  renderGlobeView();
}

// ── exports ──
window.initGlobeView=initGlobeView;
window.renderGlobeView=renderGlobeView;
window.refreshGlobeView=refreshGlobeView;
window.drawContinentPanel=drawContinentPanel;
window.drawAlienDefensiveFormation=drawAlienDefensiveFormation;

})();

</script>
