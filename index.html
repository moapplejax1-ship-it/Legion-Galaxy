<!DOCTYPE html><html lang="en"><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Legion Galaxy</title>
<style>
:root{
  --bg:#0a0c10;
  --rust:#c85028;
  --blood:#8b1a1a;
  --mil:#3a7a3a;
  --steel:#6080a0;
  --gold:#c8a020;
  --edge:rgba(255,255,255,0.08);
  --muted:rgba(255,255,255,0.45);
  --plate:#12151c;
  --plate2:#1a1e28;
  --text:#c8c4b0;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;font-size:12px}

#app{height:100%;display:flex;flex-direction:column;position:relative}

/* Screen system */
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}
.screen-body{flex:1;overflow-y:auto;padding:10px 12px 80px}
.screen-body::-webkit-scrollbar{width:4px}
.screen-body::-webkit-scrollbar-track{background:transparent}
.screen-body::-webkit-scrollbar-thumb{background:var(--rust);border-radius:2px}

/* Topbar */
.topbar{display:flex;align-items:center;padding:8px 12px;background:var(--plate);border-bottom:1px solid var(--edge);min-height:44px;flex-shrink:0;gap:8px}
.topbar-title{flex:1;text-align:center;font-size:11px;font-weight:900;letter-spacing:2px;color:var(--rust)}

/* Resource bar */
.resource-bar{display:flex;gap:4px;padding:4px 8px;background:var(--plate2);border-bottom:1px solid var(--edge);overflow-x:auto;flex-shrink:0}
.resource-bar::-webkit-scrollbar{display:none}
.res-badge{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;white-space:nowrap;padding:3px 6px;background:rgba(255,255,255,0.04);border:1px solid var(--edge)}

/* Panels */
.panel{background:var(--plate);border:1px solid var(--edge);padding:10px;margin-bottom:10px}
.panel.rust{border-color:var(--rust);background:rgba(200,80,40,0.08)}
.panel.blood{border-color:var(--blood);background:rgba(139,26,26,0.10)}
.panel.gold{border-color:var(--gold);background:rgba(200,160,32,0.08)}
.panel.mil{border-color:var(--mil);background:rgba(58,122,58,0.10)}
.panel.steel{border-color:var(--steel);background:rgba(96,128,160,0.08)}

/* Buttons */
.back-btn{background:var(--plate2);color:var(--muted);border:1px solid var(--edge);padding:6px 12px;font-size:10px;font-weight:900;letter-spacing:1px;cursor:pointer;font-family:inherit;text-transform:uppercase;min-height:36px}
.back-btn:active{opacity:0.7}
.action-btn{background:var(--rust);color:#fff;border:none;padding:8px 16px;font-size:10px;font-weight:900;letter-spacing:1px;cursor:pointer;font-family:inherit;text-transform:uppercase;width:100%;min-height:44px}
.action-btn.mil{background:var(--mil)}
.action-btn.blood{background:var(--blood)}
.action-btn.gold{background:var(--gold);color:#000}
.action-btn:disabled{opacity:0.35;pointer-events:none}

/* Section headers */
.sec-hdr{font-size:10px;letter-spacing:2px;font-weight:900;text-transform:uppercase;color:var(--rust);margin-bottom:8px}

/* Progress bar */
.prog-bar{background:rgba(255,255,255,0.06);height:6px;border-radius:3px}
.prog-fill{height:100%;border-radius:3px;background:var(--rust);transition:width 0.3s}

/* Troop / grid styles */
.troop-row{display:flex;align-items:center;gap:8px;padding:8px;background:var(--plate2);margin-bottom:6px;border:1px solid var(--edge)}
.lane-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:8px}
.battle-log{height:120px;overflow-y:auto;font-size:10px;font-family:monospace;color:var(--muted);padding:6px;background:var(--plate2);border:1px solid var(--edge)}

/* Modal */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;padding:16px;overflow-y:auto}
#modal-box{background:var(--plate);border:1px solid var(--rust);max-width:480px;margin:0 auto;padding:16px}
#modal-box::before{content:'';display:block;width:36px;height:3px;background:var(--rust);margin:0 auto 12px;opacity:.8}
#modal-box.wide{max-width:640px}

/* Research tree */
.rtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;position:sticky;top:0;background:var(--plate);padding-bottom:8px;z-index:1}
.rtab{background:var(--plate2);color:var(--muted);border:1px solid var(--edge);padding:8px 10px;font-size:11px;font-weight:900;letter-spacing:1px;cursor:pointer;font-family:inherit;text-transform:uppercase;border-radius:2px}
.rtab.active{background:var(--rust);color:#fff;border-color:var(--rust)}
.ritems{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding-right:4px}
.ri{padding:12px;border-radius:2px;background:var(--plate2);font-size:13px;line-height:1.6}
.ri b{font-size:14px;display:block;margin-bottom:4px;color:var(--text)}
.ri-eff{font-size:11px;color:var(--mil);margin:4px 0;line-height:1.5}
.ri-pre{font-size:10px;color:var(--muted);margin-bottom:8px}
.ri button{width:100%;background:var(--rust);color:#fff;border:none;padding:10px;font-size:11px;font-weight:900;letter-spacing:1px;cursor:pointer;font-family:inherit;text-transform:uppercase;border-radius:2px;min-height:40px}
.ri button:disabled{background:var(--plate);color:var(--muted);opacity:0.5;cursor:default}

/* Toast */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--plate);border:1px solid var(--rust);padding:8px 16px;font-size:11px;font-weight:700;letter-spacing:1px;pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:300;white-space:nowrap}
#toast.show{opacity:1}

/* Placing banner */
#placing-banner{display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;font-size:10px;font-weight:900;letter-spacing:1px;padding:6px 16px;z-index:150}

/* Canvases */
#cont-map{display:block;width:100%;cursor:pointer;touch-action:manipulation}
#invasion-map{display:block;width:100%}

/* Pixi overlay canvas */
#pixi-canvas{position:fixed;inset:0;pointer-events:none;z-index:500}

/* Utility */
.mb8{margin-bottom:8px}
.mb4{margin-bottom:4px}
.center{text-align:center}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.rust{color:var(--rust)}
.blood{color:var(--blood)}
.mil{color:var(--mil)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px}

/* Improved modal header styling */
#modal-box { border-radius: 0; border-top: 3px solid var(--rust); }

/* Build menu tab styling */
.bm-tab { transition: background 0.15s; }

/* Continent info panel */
.cont-info { border-left: 3px solid var(--rust); padding-left: 10px; }

/* Resource badge improvements */
.res-badge { border-radius: 2px; font-variant-numeric: tabular-nums; }

/* Topbar glow */
.topbar { box-shadow: 0 2px 16px rgba(0,0,0,0.8); }

/* Section header line */
.sec-hdr::after { content: ''; display: block; height: 1px; background: var(--edge); margin-top: 4px; }
</style>

function genAliens(threat, seed) {
  const rng = mkRng(seed);
  if (threat === 'DORMANT') return {infantry:60, tanks:10, cavalry:5};
  if (threat === 'GUARDED') {
    return {
      infantry: Math.floor(180 + rng()*80),
      tanks:    Math.floor(40  + rng()*40),
      cavalry:  Math.floor(20  + rng()*30),
    };
  }
  return {
    infantry: Math.floor(380 + rng()*120),
    tanks:    Math.floor(120 + rng()*80),
    cavalry:  Math.floor(60  + rng()*60),
  };
}

state.planet.continents.forEach((c) => {
  if (!c.conquered) c.aliens = genAliens(c.threat, strSeed(c.name));
});

function fmt(n) {
  n = Math.floor(n || 0);
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return '' + n;
}

function mkRng(seed) {
  let s = seed | 0;
  return function() { s = Math.imul(1664525, s) + 1013904223 | 0; return (s >>> 0) / 4294967296; };
}

function strSeed(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = Math.imul(31, h) + str.charCodeAt(i) | 0;
  return h;
}

function showScreen(name) {

  const el = document.getElementById('screen-' + name);

}

function getEnergyBalance() {
  let produced = 0, consumed = 0;
  state.planet.continents.forEach(c => {
    if (!c.conquered) return;
    c.bldgs.forEach(b => {
      if (!b.built) return;
      const def = BUILDING_DEFS[b.type];
      if (!def) return;
      if (def.prod && def.prod.res === 'energy') {
        const bonus = 1 + getResearchBonus('energyOutput');
        produced += def.prod.base * b.level * bonus;
      } else {
        consumed += b.level;
      }
    });
  });
  const effMult = 1 + getResearchBonus('energyConsumption');
  consumed = Math.max(0, consumed * effMult);
  ['infantry','tanks','cavalry'].forEach(ut => {
    consumed += (state.troops[ut].t2 || 0) * 0.5;
    consumed += (state.troops[ut].t3 || 0) * 1.0;
  });
  const ratio = Math.min(1, produced / Math.max(1, consumed));
  const deficit = Math.max(0, consumed - produced);
  return {produced, consumed, deficit, ratio};
}

function applyEnergy() {
  const {ratio} = getEnergyBalance();
  const rng = mkRng(Date.now() & 0xffff);
  state.planet.continents.forEach(c => {
    if (!c.conquered) return;
    c.bldgs.forEach(b => {
      state._energyOnline[b._uid] = (ratio >= 1) ? true : rng() < ratio;
    });
  });
}

function getStorageCapacity() {
  const caps = {metal:5000, food:3000, pop:2000, research:1000, excellorant:200};
  const sciBonus = 1 + getResearchBonus('storageCap');
  state.planet.continents.forEach(c => {
    if (!c.conquered) return;
    c.bldgs.forEach(b => {
      if (b.type === 'storehouse' && b.built) {
        caps.metal     += 3000 * b.level;
        caps.food      += 2000 * b.level;
        caps.pop       += 1500 * b.level;
        caps.research  += 800  * b.level;
        caps.excellorant += 150 * b.level;
      }
    });
  });
  caps.metal     = Math.floor(caps.metal     * sciBonus);
  caps.food      = Math.floor(caps.food      * sciBonus);
  caps.research  = Math.floor(caps.research  * sciBonus);
  caps.excellorant = Math.floor(caps.excellorant * sciBonus);
  return caps;
}

function enforceStorageCaps() {
  const caps = getStorageCapacity();
  state.res.metal      = Math.min(state.res.metal,      caps.metal);
  state.res.food       = Math.min(state.res.food,       caps.food);
  state.res.pop        = Math.min(state.res.pop,        caps.pop);
  state.res.research   = Math.min(state.res.research,   caps.research);
  state.res.excellorant = Math.min(state.res.excellorant, caps.excellorant);
}

function _getOverdriveMult(bldgUid) {
  const exp = state.overdrive[bldgUid];
  return (exp && Date.now() < exp) ? 3 : 1;
}

function productionTick() {
  applyEnergy();
  const allProdBonus = 1 + getResearchBonus('allProduction');
  state.planet.continents.forEach(c => {
    if (!c.conquered) return;
    c.bldgs.forEach(b => {
      if (!b.built) return;
      const def = BUILDING_DEFS[b.type];
      if (!def || !def.prod || !def.prod.res) return;
      if (!state._energyOnline[b._uid]) return;
      let base = def.prod.base * b.level;
      const odMult = _getOverdriveMult(b._uid);
      if (def.prod.res === 'metal') {
        const bonus = 1 + getResearchBonus('collectorOutput');
        base *= bonus;
      } else if (def.prod.res === 'food') {
        const bonus = 1 + getResearchBonus('farmOutput');
        base *= bonus;
      } else if (def.prod.res === 'research') {
        const bonus = 1 + getResearchBonus('researchOutput');
        base *= bonus;
      } else if (def.prod.res === 'energy') {
        const bonus = 1 + getResearchBonus('energyOutput');
        base *= bonus;
      } else if (def.prod.res === 'credits') {
        const bonus = 1 + getResearchBonus('creditsOutput');
        base *= bonus;
      }
      if (def.prod.res !== 'energy') base *= allProdBonus;
      base *= odMult;
      state.res[def.prod.res] = (state.res[def.prod.res] || 0) + base;
    });
  });
  // population growth
  if (state.res.food > state.res.pop * 2) {
    let housingSum = 0;
    state.planet.continents.forEach(c => {
      if (!c.conquered) return;
      c.bldgs.forEach(b => { if (b.type === 'housingBlock' && b.built) housingSum += b.level; });
    });
    state.res.pop += housingSum;
  }
  enforceStorageCaps();
  renderAllResBars();
}

function applyUpkeep() {
  let totalTroops = 0;
  ['infantry','tanks','cavalry'].forEach(ut => {
    totalTroops += (state.troops[ut].t1 || 0) + (state.troops[ut].t2 || 0) + (state.troops[ut].t3 || 0);
  });
  const drain = totalTroops * 0.3;
  const shortage = drain > state.res.food;
  state.res.food = Math.max(0, state.res.food - drain);
  if (shortage) {
    ['infantry','tanks','cavalry'].forEach(ut => {
      ['t1','t2','t3'].forEach(tier => {
        state.troops[ut][tier] = Math.floor((state.troops[ut][tier] || 0) * 0.95);
      });
    });
    toast('// FOOD SHORTAGE — DESERTION //');
  }
  if (typeof applyFleetUpkeep === 'function') applyFleetUpkeep();
}

function getTradeRates(now) {
  const seed = state._tradeRateSeed;
  const t = Math.floor((now || Date.now()) / 60000);
  const pairs = [
    {from:'metal',to:'food',base:0.8},
    {from:'metal',to:'credits',base:0.05},
    {from:'food',to:'credits',base:0.06},
    {from:'research',to:'credits',base:0.15},
    {from:'excellorant',to:'credits',base:2.5},
  ];
  return pairs.map((p, i) => {
    const rng = mkRng(seed + t * 13 + i * 77);
    const fluctuation = 0.8 + rng() * 0.4;
    const tradeBonus = 1 + getResearchBonus('tradeRates');
    return {...p, rate: p.base * fluctuation * tradeBonus};
  });
}

function executeTrade(fromRes, toRes, amount) {
  if (state.res[fromRes] < amount) { toast('// INSUFFICIENT ' + fromRes.toUpperCase() + ' //'); return; }
  const rates = getTradeRates();
  const pair = rates.find(r => r.from === fromRes && r.to === toRes);
  if (!pair) { toast('// INVALID TRADE //'); return; }
  const gained = amount * pair.rate;
  state.res[fromRes] -= amount;
  state.res[toRes] = (state.res[toRes] || 0) + gained;
  enforceStorageCaps();
  renderAllResBars();
  toast(`// TRADED ${fmt(amount)} ${fromRes} → ${fmt(gained)} ${toRes} //`);
}

      <p>Metal crate: ${metalVal} cr | Food crate: ${foodVal} cr | Research crate: ${resVal} cr</p>
      <button onclick="sellCrates(${uid},'metal',${metalVal})">Sell Metal Crates</button>
      <button onclick="sellCrates(${uid},'food',${foodVal})">Sell Food Crates</button>
      <button onclick="sellCrates(${uid},'research',${resVal})">Sell Research Crates</button>
    </div>
  </div>`;
}

function packCrate(uid, type) {
  const costs = {metal:100, food:50, research:20};
  const cost = costs[type];
  if (!cost) return;
  if (state.res[type] < cost) { toast('// INSUFFICIENT ' + type.toUpperCase() + ' //'); return; }
  state.res[type] -= cost;
  state.res.commodityCrates = (state.res.commodityCrates || 0) + 1;
  renderAllResBars();
  toast('// CRATE PACKED //');
}

function sellCrates(uid, type, val) {
  const count = state.res.commodityCrates || 0;
  if (count < 1) { toast('// NO CRATES //'); return; }
  state.res.commodityCrates = 0;
  state.res.credits = (state.res.credits || 0) + count * val;
  renderAllResBars();
  toast(`// SOLD ${count} CRATES FOR ${fmt(count * val)} CREDITS //`);
}

function activateOverdrive(uid, cost) {
  if ((state.res.excellorant || 0) < cost) { toast('// INSUFFICIENT EXCELLORANT //'); return; }
  state.res.excellorant -= cost;
  const dur = 7200000 * (1 + getResearchBonus('overdriveDuration'));
  state.overdrive[uid] = Date.now() + dur;
  renderAllResBars();
  toast('// OVERDRIVE ACTIVE — 2 HRS //');
}

function getOverdriveCountdownHTML(bldg) {
  const uid = bldg._uid;
  const exp = state.overdrive[uid];
  const now = Date.now();
  if (exp && now < exp) {
    const rem = exp - now;
    const h = Math.floor(rem / 3600000);
    const m = Math.floor((rem % 3600000) / 60000);
    const s = Math.floor((rem % 60000) / 1000);
    return `<div class="od-active">⚡ OVERDRIVE ACTIVE — ${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>`;
  }
  const canAfford = (state.res.excellorant || 0) >= 20;
  return `<button class="od-btn" onclick="activateOverdrive(${uid},20)" ${canAfford ? '' : 'disabled'}>⚡ ACTIVATE OVERDRIVE (20 💠)</button>`;
}

function getStorehouseDetailHTML(bldg) {
  const caps = getStorageCapacity();
  const rows = ['metal','food','pop','research','excellorant'];
  const icons = {metal:'⛏',food:'🌾',pop:'👥',research:'⚛',excellorant:'💠'};
  let html = `<div class="sh-detail"><h3>Storehouse — Level ${bldg.level}</h3>`;
  rows.forEach(r => {
    const cur = Math.floor(state.res[r] || 0);
    const cap = caps[r] || 1;
    const pct = Math.min(100, (cur / cap * 100)).toFixed(1);
    html += `<div class="sh-row">${icons[r]} ${r}: ${fmt(cur)} / ${fmt(cap)}
      <div class="sh-bar"><div class="sh-fill" style="width:${pct}%"></div></div></div>`;
  });
  html += '</div>';
  return html;
}

function rushConstruction(contIdx, uid, cost) {
  if ((state.res.credits || 0) < cost) { toast('// INSUFFICIENT CREDITS //'); return; }
  const cont = state.planet.continents[contIdx];
  if (!cont) return;
  const bldg = cont.bldgs.find(b => b._uid === uid);
  if (!bldg) return;
  state.res.credits -= cost;
  bldg.built = true;
  bldg.buildEnd = null;
  refreshContMap();
  renderContBody();
  renderAllResBars();
  toast('// CONSTRUCTION RUSHED //');
}

function getBribeOption(contIdx) {
  const cont = state.planet.continents[contIdx];
  if (!cont || !cont.aliens) return {cost:200, canAfford:false};
  const total = (cont.aliens.infantry || 0) + (cont.aliens.tanks || 0) + (cont.aliens.cavalry || 0);
  const cost = 200 + total * 2;
  return {cost, canAfford: (state.res.credits || 0) >= cost};
}

function bribeGarrison(contIdx) {
  const opt = getBribeOption(contIdx);
  if (!opt.canAfford) { toast('// INSUFFICIENT CREDITS //'); return; }
  state.res.credits -= opt.cost;
  const cont = state.planet.continents[contIdx];
  if (cont.aliens) {
    cont.aliens.infantry = Math.floor((cont.aliens.infantry || 0) * 0.80);
    cont.aliens.tanks    = Math.floor((cont.aliens.tanks    || 0) * 0.80);
    cont.aliens.cavalry  = Math.floor((cont.aliens.cavalry  || 0) * 0.80);
  }
  renderAllResBars();
  renderContBody();
  toast('// GARRISON REDUCED BY 20% //');
}

// ─── SECTION 5: CONTINENT & BUILDING SYSTEM ──────────────────────────────────

function cc() {
  return state.planet.continents.filter(c => c.conquered).length;
}

function spUnlocked() {
  return cc() >= 3;
}

function openContinent(idx) {
  state.selCont = idx;
  const cont = state.planet.continents[idx];
  const titleEl = document.getElementById('cont-title');
  if (titleEl) titleEl.textContent = cont.name;
  const backBtn = document.getElementById('cont-back');
  if (backBtn) backBtn.onclick = goHome;
  showScreen('continent');
  refreshContMap();
  renderContBody();
  renderAllResBars();
}

function gridOccupancyMap(cont) {
  const map = new Map();
  cont.bldgs.forEach(b => {
    footprintOccupies(b).forEach(([col, row]) => {
      map.set(col + ',' + row, b);
    });
  });
  return map;
}

function footprintOccupies(bldg) {
  const def = BUILDING_DEFS[bldg.type];
  if (!def) return [];
  const cells = [];
  for (let dr = 0; dr < def.h; dr++) {
    for (let dc = 0; dc < def.w; dc++) {
      cells.push([bldg.col + dc, bldg.row + dr]);
    }
  }
  return cells;
}

function canPlace(cont, col, row, type) {
  const def = BUILDING_DEFS[type];
  if (!def) return false;
  if (col + def.w > GCOLS || row + def.h > GROWS) return false;
  const occ = gridOccupancyMap(cont);
  for (let dr = 0; dr < def.h; dr++) {
    for (let dc = 0; dc < def.w; dc++) {
      if (occ.has((col + dc) + ',' + (row + dr))) return false;
    }
  }
  return true;
}

function showBuildMenu(contIdx, col, row, activeTab) {
  activeTab = activeTab || 'production';
  const cont = state.planet.continents[contIdx];
  if (!cont.conquered) { toast('// CONQUER FIRST //'); return; }

  const tabBar = Object.entries(BUILD_CATEGORIES).map(([key, cat]) =>
    `<button onclick="showBuildMenu(${contIdx},${col},${row},'${key}')" style="
      flex:1;padding:6px 2px;font-size:9px;font-weight:900;letter-spacing:1px;
      font-family:monospace;border:none;cursor:pointer;
      background:${key===activeTab?'var(--rust)':'var(--plate2)'};
      color:${key===activeTab?'#fff':'var(--muted)'};
      border-bottom:${key===activeTab?'2px solid #fff':'2px solid transparent'}">
      ${cat.label}
    </button>`
  ).join('');

  const cat = BUILD_CATEGORIES[activeTab];
  let items = '';
  cat.types.forEach(type => {
    const def = BUILDING_DEFS[type];
    if (!def) return;
    const placeable = canPlace(cont, col, row, type);
    const canAfford = Object.entries(def.cost).every(([r,v]) => (state.res[r]||0) >= v);
    const disabled = (!placeable || !canAfford) ? 'disabled' : '';
    const costStr = Object.keys(def.cost).length === 0 ? 'free' :
      Object.entries(def.cost).map(([r,v]) => `${fmt(v)} ${r}`).join(' · ');
    const statusColor = !placeable ? 'var(--muted)' : !canAfford ? 'var(--blood)' : 'var(--mil)';
    const statusText = !placeable ? 'NO SPACE' : !canAfford ? 'NEED RESOURCES' : 'AVAILABLE';
    const sizeBadge = `${def.w}×${def.h}`;
    const prodText = def.prod && def.prod.res ? `+${def.prod.base} ${def.prod.res}/tick` : '';

    items += `<div style="padding:10px;background:var(--plate2);border:1px solid var(--edge);margin-bottom:8px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <img src="${buildingIconDataURL(type)}" style="width:32px;height:32px;border:1px solid var(--edge);image-rendering:pixelated;flex-shrink:0">
          <div>
            <span style="font-size:11px;font-weight:900;color:var(--text)">${def.name}</span>
            <span style="font-size:9px;color:var(--muted);margin-left:6px">${sizeBadge}</span>
            ${prodText ? `<div style="font-size:9px;color:var(--mil);margin-top:2px">${prodText}</div>` : ''}
          </div>
        </div>
        <span style="font-size:9px;font-weight:900;color:${statusColor};letter-spacing:1px">${statusText}</span>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:8px;line-height:1.5">${def.desc}</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:10px;color:var(--gold);font-family:monospace">💰 ${costStr}</span>
        <button ${disabled} onclick="buildStructure(${contIdx},${col},${row},'${type}');closeModal()"
          style="background:${canAfford&&placeable?'var(--rust)':'var(--plate)'};color:${canAfford&&placeable?'#fff':'var(--muted)'};
            border:1px solid ${canAfford&&placeable?'var(--rust)':'var(--edge)'};
            padding:6px 14px;font-size:10px;font-weight:900;font-family:monospace;cursor:pointer;letter-spacing:1px">
          BUILD
        </button>
      </div>
    </div>`;
  });

  const html = `
    <div style="display:flex;gap:2px;margin-bottom:12px">${tabBar}</div>
    ${items || '<div style="color:var(--muted);font-size:11px;text-align:center;padding:20px">No buildings in this category</div>'}
  `;
  openModal('// BUILD STRUCTURE //', html);
}

function buildStructure(contIdx, col, row, type) {
  const cont = state.planet.continents[contIdx];
  const def = BUILDING_DEFS[type];
  if (!def) return;
  if (!canPlace(cont, col, row, type)) { toast('// CANNOT PLACE HERE //'); return; }
  const canAfford = Object.entries(def.cost).every(([r, v]) => (state.res[r] || 0) >= v);
  if (!canAfford) { toast('// INSUFFICIENT RESOURCES //'); return; }
  Object.entries(def.cost).forEach(([r, v]) => { state.res[r] -= v; });
  const buildMult = 1 / Math.max(0.1, 1 + getResearchBonus('buildSpd'));
  const buildTime = Math.floor(30000 * buildMult);
  const bldg = {
    _uid: state._uid++, type, col, row, level: 1,
    built: false, buildEnd: Date.now() + buildTime,
  };
  cont.bldgs.push(bldg);
  state._energyOnline[bldg._uid] = false;
  refreshContMap();
  renderContBody();
  renderAllResBars();
  toast('// BUILDING QUEUED //');
}

function setupMapClick() {
  const canvas = document.getElementById('cont-map');
  if (!canvas) return;
  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const col = Math.floor(mx / CELL);
    const row = Math.floor(my / CELL);
    const contIdx = state.selCont;
    const cont = state.planet.continents[contIdx];
    if (!cont) return;
    const occ = gridOccupancyMap(cont);
    const hit = occ.get(col + ',' + row);
    if (hit) {
      openBuilding(hit, contIdx);
    } else if (state.placing) {
      buildStructure(contIdx, col, row, state.placing);
      state.placing = null;
    } else {
      showBuildMenu(contIdx, col, row);
    }
  };
}

function refreshContMap() {
  const canvas = document.getElementById('cont-map');
  if (!canvas) return;
  const cont = state.planet.continents[state.selCont];
  if (!cont) return;
  const container = canvas.parentElement;
  canvas.width  = container ? (container.clientWidth || GCOLS * CELL) : GCOLS * CELL;
  canvas.height = GROWS * CELL;
  drawContinentMap(canvas, cont);
  // complete any finished buildings
  cont.bldgs.forEach(b => {
    if (!b.built && b.buildEnd && Date.now() >= b.buildEnd) b.built = true;
  });
}

function openBuilding(bldg, contIdx) {
  state.selBldg = bldg;
  const titleEl = document.getElementById('bld-title');
  if (titleEl) {
    const def = BUILDING_DEFS[bldg.type];
    titleEl.textContent = def ? def.name : bldg.type;
  }
  const backBtn = document.getElementById('bld-back');
  if (backBtn) backBtn.onclick = () => { refreshContMap(); showScreen('continent'); };
  showScreen('building');
  renderBuildingDetail(bldg, contIdx);
}

        </div>

      <div class="sec-hdr">PRODUCTION</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px">
        <span style="color:var(--muted)">${def.prod.res.toUpperCase()} output</span>
        <span style="color:var(--mil);font-weight:900">+${currentOutput} / tick</span>
      </div>
      <div class="prog-bar" style="margin-bottom:4px">
        <div class="prog-fill" style="width:${pct}%;background:var(--mil)"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted)">
        <span>Current: ${currentOutput}</span>
        <span>Max (Lv${maxLv}): ${maxOutput}</span>
      </div>
    </div>`;
  }

  // Upgrade section
  if (bldg.built) {
    html += `<div class="panel" style="margin-bottom:10px">
      <div class="sec-hdr">UPGRADE</div>`;
    if (isMaxLevel) {
      html += `<div style="font-size:10px;color:var(--gold);text-align:center;padding:8px;letter-spacing:2px">◆ MAX LEVEL REACHED ◆</div>`;
    } else {
      const reason = lvl2Locked ? '— needs Advanced Construction' : lvl3Locked ? '— needs Mega Structures' : '';
      const blocked = upgBlocked && reason;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div>
          <div style="font-size:10px;color:var(--text)">Level ${bldg.level} → ${bldg.level+1}</div>
          ${blocked?`<div style="font-size:9px;color:var(--blood)">${reason}</div>`:''}
        </div>
        <span style="font-size:10px;color:var(--gold)">⛏ ${upgCost} metal</span>
      </div>
      <button ${(canUpg&&!upgBlocked)?'':'disabled'} onclick="upgradeBuilding(${bldg._uid},${contIdx})"
        style="width:100%;padding:8px;font-size:10px;font-weight:900;font-family:monospace;letter-spacing:1px;
          background:${(canUpg&&!upgBlocked)?'var(--rust)':'var(--plate)'};
          color:${(canUpg&&!upgBlocked)?'#fff':'var(--muted)'};
          border:1px solid ${(canUpg&&!upgBlocked)?'var(--rust)':'var(--edge)'};cursor:pointer">
        ↑ UPGRADE TO LEVEL ${bldg.level+1}
      </button>`;
    }
    html += `</div>`;
  }

  // Overdrive section
  if (bldg.built && def.prod && def.prod.res) {
    html += `<div class="panel" style="margin-bottom:10px">
      <div class="sec-hdr">OVERDRIVE</div>
      <div style="font-size:9px;color:var(--muted);margin-bottom:8px">Triples output for 2 hours. Costs 20 💠 excellorant.</div>
      ${getOverdriveCountdownHTML(bldg)}
    </div>`;
  }

  // Special sections
  if (bldg.type === 'storehouse') html += getStorehouseDetailHTML(bldg);
  if (bldg.type === 'commodityExchange') {
    html += `<div class="panel" style="margin-bottom:10px"><div class="sec-hdr">TRADE</div>${getCommodityExchangeHTML(bldg)}</div>`;
  }
  if (bldg.type === 'defenseGrid') html += getDefenseGridDetailHTML(bldg);
  if (bldg.type === 'terraformer') html += getTerraformerDetailHTML(bldg, contIdx);
  if (bldg.type === 'spaceport') {
    if (spUnlocked()) {
      html += `<div class="panel" style="margin-bottom:10px"><div class="sec-hdr">FLEET</div>${getFleetScreenHTML()}</div>`;
    } else {
      html += `<div class="panel blood" style="margin-bottom:10px">
        <div class="sec-hdr">FLEET</div>
        <div style="font-size:10px;color:var(--muted);text-align:center;padding:8px">Conquer 3 continents to unlock fleet operations.</div>
      </div>`;
    }
  }
  if (bldg.type === 'researchCenter') {
    html += `<div class="panel" style="margin-bottom:10px">
      <div class="sec-hdr">RESEARCH</div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:8px">Access the technology tree to unlock upgrades and new capabilities.</div>
      <button class="action-btn" onclick="openResearchScreen('military')">⚛ OPEN RESEARCH TREE</button>
    </div>`;
  }
  if (bldg.type === 'barracks') {
    html += `<div class="panel" style="margin-bottom:10px">
      <div class="sec-hdr">TROOPS</div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:8px">Train and upgrade your military forces.</div>
      <button class="action-btn mil" onclick="openTroops(${contIdx})">🪖 MANAGE TROOPS</button>
    </div>`;
  }

  html += '</div>';
  el.innerHTML = html;
}

function upgradeBuilding(uid, contIdx) {
  const cont = state.planet.continents[contIdx];
  if (!cont) return;
  const bldg = cont.bldgs.find(b => b._uid === uid);
  if (!bldg || !bldg.built) return;
  const def = BUILDING_DEFS[bldg.type];
  if (bldg.level >= def.maxLevel) { toast('// MAX LEVEL //'); return; }
  if (bldg.level >= 2 && !state.researchV2.has('advancedConstruction')) {
    toast('// NEED ADVANCED CONSTRUCTION //'); return;
  }
  if (bldg.level >= 3 && !state.researchV2.has('megaStructures')) {
    toast('// NEED MEGA STRUCTURES //'); return;
  }
  const cost = bldg.level * 200;
  if ((state.res.metal || 0) < cost) { toast('// INSUFFICIENT METAL //'); return; }
  state.res.metal -= cost;
  bldg.level++;
  renderBuildingDetail(bldg, contIdx);
  renderAllResBars();
  toast('// UPGRADED //');
}

// ─── CANVAS RENDERING ────────────────────────────────────────────────────────

function drawRock(ctx, cx, cy, size, rng) {
  const verts = 7 + Math.floor(rng() * 3);
  ctx.beginPath();
  for (let i = 0; i < verts; i++) {
    const angle = (i / verts) * Math.PI * 2;
    const r = size * (0.6 + rng() * 0.4);
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r * 0.6;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(cx - size * 0.2, cy - size * 0.2, 1, cx, cy, size);
  g.addColorStop(0, '#888');
  g.addColorStop(1, '#333');
  ctx.fillStyle = g;
  ctx.fill();
}

function paintTerrain(ctx, W, H, rng, conquered, threat) {
  const horizonColor = conquered ? '#1a2a1a' : (threat === 'FORTIFIED' ? '#2a0a0a' : '#1a1a2a');
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#050810');
  grad.addColorStop(0.6, horizonColor);
  grad.addColorStop(1, '#0a1208');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  const rocks = 12 + Math.floor(rng() * 8);
  for (let i = 0; i < rocks; i++) {
    drawRock(ctx, rng() * W, rng() * H * 0.6 + H * 0.3, 8 + rng() * 18, rng);
  }
  if (!conquered) {
    ctx.fillStyle = 'rgba(180,20,20,0.15)';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawFarm(ctx, px, py, pw, ph, level) {
  ctx.fillStyle = '#1a4a10';
  ctx.fillRect(px, py, pw, ph);
  const stripes = 4 + level;
  const sw = pw / (stripes * 2);
  for (let i = 0; i < stripes; i++) {
    ctx.fillStyle = '#2a6a18';
    ctx.fillRect(px + i * sw * 2, py, sw, ph);
    ctx.fillStyle = '#e0b030';
    ctx.fillRect(px + i * sw * 2 + sw * 0.3, py + 2, sw * 0.4, ph * 0.4);
  }
}

function drawColonyCenter(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#1c2a4a';
  ctx.fillRect(px + 1, py + ph * 0.35, pw - 2, ph * 0.65 - 1);
  ctx.fillStyle = '#3a5590';
  ctx.beginPath();
  ctx.arc(px + pw / 2, py + ph * 0.38, pw * 0.32, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = '#7fa8e0';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px + pw / 2, py + ph * 0.12); ctx.lineTo(px + pw / 2, py + ph * 0.02); ctx.stroke();
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(px + pw / 2, py + ph * 0.02, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9fc3ff';
  for (let i = 0; i < 3; i++) ctx.fillRect(px + pw * (0.2 + i * 0.25), py + ph * 0.6, pw * 0.1, ph * 0.12);
}

function drawResourceCollector(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#3a2616';
  ctx.fillRect(px + 1, py + ph * 0.55, pw - 2, ph * 0.45 - 1);
  ctx.strokeStyle = '#a06838';
  ctx.lineWidth = Math.max(1.5, pw * 0.06);
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.2, py + ph * 0.55);
  ctx.lineTo(px + pw * 0.5, py + ph * 0.08);
  ctx.lineTo(px + pw * 0.8, py + ph * 0.55);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.5, py + ph * 0.08);
  ctx.lineTo(px + pw * 0.5, py + ph * 0.55);
  ctx.stroke();
  ctx.fillStyle = '#e0a030';
  ctx.beginPath(); ctx.arc(px + pw * 0.5, py + ph * 0.08, pw * 0.05, 0, Math.PI * 2); ctx.fill();
}

function drawBarracks(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#4a2222';
  ctx.fillRect(px + 1, py + ph * 0.3, pw - 2, ph * 0.7 - 1);
  ctx.fillStyle = '#6a3030';
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.5, py + ph * 0.05);
  ctx.lineTo(px + pw - 1, py + ph * 0.3);
  ctx.lineTo(px + 1, py + ph * 0.3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c04040';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px + pw * 0.78, py + ph * 0.05); ctx.lineTo(px + pw * 0.78, py - ph * 0.08); ctx.stroke();
  ctx.fillStyle = '#e05050';
  ctx.fillRect(px + pw * 0.78, py - ph * 0.08, pw * 0.16, ph * 0.1);
  ctx.fillStyle = '#ffcc66';
  ctx.fillRect(px + pw * 0.3, py + ph * 0.5, pw * 0.12, ph * 0.12);
  ctx.fillRect(px + pw * 0.58, py + ph * 0.5, pw * 0.12, ph * 0.12);
}

function drawHousingBlock(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#1c3a4a';
  ctx.fillRect(px + 1, py + 1, pw - 2, ph - 2);
  ctx.fillStyle = '#ffd166';
  const cols = 3, rows = 3;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if ((r + c) % 2 === 0) {
        ctx.fillStyle = '#ffd166';
      } else {
        ctx.fillStyle = '#3d5a70';
      }
      ctx.fillRect(px + pw * (0.12 + c * 0.28), py + ph * (0.12 + r * 0.28), pw * 0.18, ph * 0.18);
    }
  }
}

function drawResearchCenter(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#241c40';
  ctx.fillRect(px + 1, py + ph * 0.4, pw - 2, ph * 0.6 - 1);
  ctx.fillStyle = '#4530a0';
  ctx.beginPath();
  ctx.arc(px + pw / 2, py + ph * 0.4, pw * 0.34, Math.PI, 0);
  ctx.fill();
  const g = ctx.createRadialGradient(px + pw/2, py + ph*0.32, 1, px + pw/2, py + ph*0.32, pw*0.14);
  g.addColorStop(0, '#bff0ff');
  g.addColorStop(1, 'rgba(120,220,255,0.1)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(px + pw / 2, py + ph * 0.32, pw * 0.13, 0, Math.PI * 2); ctx.fill();
}

function drawPowerRelay(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#3a3010';
  ctx.fillRect(px + 1, py + ph * 0.65, pw - 2, ph * 0.35 - 1);
  ctx.strokeStyle = '#c0a030';
  ctx.lineWidth = Math.max(1.5, pw * 0.05);
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.5, py + ph * 0.65);
  ctx.lineTo(px + pw * 0.5, py + ph * 0.05);
  ctx.stroke();
  for (const f of [0.25, 0.45, 0.65]) {
    ctx.beginPath();
    ctx.ellipse(px + pw * 0.5, py + ph * f, pw * 0.18, ph * 0.06, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.55, py + ph * 0.45);
  ctx.lineTo(px + pw * 0.42, py + ph * 0.65);
  ctx.lineTo(px + pw * 0.52, py + ph * 0.65);
  ctx.lineTo(px + pw * 0.4, py + ph * 0.85);
  ctx.lineTo(px + pw * 0.6, py + ph * 0.6);
  ctx.lineTo(px + pw * 0.5, py + ph * 0.6);
  ctx.closePath(); ctx.fill();
}

function drawTradePost(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#1c3a28';

  ctx.fillRect(px + 1, py + ph * 0.3, pw - 2, ph * 0.1);

  for (let i = 0; i < 4; i++) {

    ctx.moveTo(px + pw * (0.1 + i * 0.25), py + ph * 0.4);

  ctx.fillRect(px + pw * 0.55, py + ph * 0.7, pw * 0.3, ph * 0.22);

function drawStorehouse(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#383838';
  ctx.fillRect(px + 1, py + ph * 0.25, pw - 2, ph * 0.75 - 1);
  ctx.fillStyle = '#505050';
  ctx.beginPath();
  ctx.moveTo(px + 1, py + ph * 0.25);
  ctx.lineTo(px + pw / 2, py + ph * 0.05);
  ctx.lineTo(px + pw - 1, py + ph * 0.25);
  ctx.closePath(); ctx.fill();

  for (const [cx, cy, s] of [[0.28,0.5,0.22],[0.6,0.55,0.26],[0.42,0.78,0.2]]) {

function drawExcellorantFactory(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#1a2840';
  ctx.fillRect(px + 1, py + ph * 0.3, pw - 2, ph * 0.7 - 1);
  const cx = px + pw / 2, cy = py + ph * 0.32;
  const g = ctx.createRadialGradient(cx, cy, 1, cx, cy, pw * 0.22);
  g.addColorStop(0, '#aef6ff');
  g.addColorStop(1, '#2a6ad0');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx, cy - ph * 0.22);
  ctx.lineTo(cx + pw * 0.18, cy);
  ctx.lineTo(cx, cy + ph * 0.22);

function drawSpaceport(ctx, px, py, pw, ph) {

  ctx.lineTo(px + pw * 0.62, py + ph * 0.5);
  ctx.lineTo(px + pw * 0.38, py + ph * 0.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff8040';
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.45, py + ph * 0.5);

function drawCommodityExchange(ctx, px, py, pw, ph) {

function drawDefenseGrid(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#3a1c20';

  ctx.arc(px + pw / 2, py + ph * 0.45, pw * 0.3, Math.PI, 0);

  ctx.strokeStyle = '#ff6070';

  ctx.beginPath();
  ctx.moveTo(px + pw / 2, py + ph * 0.45);
  ctx.lineTo(px + pw / 2, py + ph * 0.1);

function drawTerraformer(ctx, px, py, pw, ph) {
  ctx.fillStyle = '#1c3a34';
  ctx.fillRect(px + 1, py + ph * 0.45, pw - 2, ph * 0.55 - 1);
  ctx.fillStyle = '#2a8a60';
  ctx.beginPath();
  ctx.arc(px + pw / 2, py + ph * 0.45, pw * 0.28, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = '#7adba0';
  ctx.lineWidth = Math.max(1.2, pw * 0.04);
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.5, py + ph * 0.45);
  ctx.quadraticCurveTo(px + pw * 0.35, py + ph * 0.25, px + pw * 0.42, py + ph * 0.1);
