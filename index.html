<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Legion Galaxy</title>
<style>
:root{
  --bg:#0b0d08;--plate:#1c2014;--plate2:#242b18;--edge:#3a4228;
  --rust:#c87428;--mil:#5a8a3c;--blood:#c03010;--steel:#7a8470;
  --text:#c8c4b0;--muted:#6a6858;--warn:#d44400;--gold:#d4a832;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:'Courier New',monospace;color:var(--text)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px)}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;width:100%;height:100%;overflow:hidden;
  display:flex;flex-direction:column;max-width:540px;margin:0 auto}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}
.screen-body{flex:1;overflow-y:auto;padding:10px 12px 28px}
.screen-body::-webkit-scrollbar{width:4px}
.screen-body::-webkit-scrollbar-thumb{background:var(--rust);border-radius:2px}
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 7px;flex-shrink:0;position:relative;
  background:linear-gradient(180deg,#1e2314,#141810);
  border-bottom:2px solid var(--edge);box-shadow:0 2px 14px rgba(0,0,0,0.9)}
.topbar-title{font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
  color:var(--rust);text-shadow:0 0 10px rgba(200,116,40,0.55)}
.back-btn{background:var(--plate);border:1px solid var(--edge);color:var(--steel);
  padding:4px 10px;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1px;
  font-family:inherit;text-transform:uppercase;
  clip-path:polygon(6px 0%,100% 0%,100% 100%,0% 100%,0% 6px)}
.back-btn:hover{background:var(--plate2);color:var(--text);border-color:var(--rust)}
.resource-bar{display:flex;gap:5px;overflow-x:auto;padding:5px 10px;
  background:#0f1209;border-bottom:1px solid var(--edge);flex-shrink:0}
.resource-bar::-webkit-scrollbar{display:none}
.res-badge{display:flex;align-items:center;gap:4px;background:var(--plate);
  border:1px solid var(--edge);padding:3px 8px;white-space:nowrap;font-size:11px;font-weight:700;
  clip-path:polygon(5px 0%,100% 0%,100% 100%,0% 100%,0% 5px)}
.panel{background:var(--plate);
  border-top:1px solid #4a5535;border-left:1px solid #4a5535;
  border-right:1px solid #1a1e10;border-bottom:2px solid #0d0f08;
  padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.panel::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent,transparent 14px,rgba(255,255,255,0.012) 14px,rgba(255,255,255,0.012) 15px)}
.panel.rust{border-top-color:var(--rust);box-shadow:0 0 10px rgba(200,116,40,0.18)}
.panel.mil{border-top-color:var(--mil);box-shadow:0 0 10px rgba(90,138,60,0.18)}
.panel.blood{border-top-color:var(--blood);box-shadow:0 0 10px rgba(192,48,16,0.2)}
.panel.gold{border-top-color:var(--gold);box-shadow:0 0 10px rgba(212,168,50,0.2)}
.panel.steel{border-top-color:var(--steel)}
.gal-btn{display:inline-block;background:none;border:none;cursor:pointer;padding:0;font-family:inherit}
.gal-btn-inner{display:inline-flex;align-items:center;justify-content:center;
  padding:9px 18px;font-size:12px;font-weight:900;letter-spacing:2px;
  text-transform:uppercase;color:var(--text);
  clip-path:polygon(8px 0%,100% 0%,100% calc(100% - 8px),calc(100% - 8px) 100%,0% 100%,0% 8px)}
.gal-btn.rust .gal-btn-inner{background:linear-gradient(160deg,rgba(200,116,40,0.55),rgba(200,116,40,0.18));
  outline:1.5px solid var(--rust);text-shadow:0 0 6px rgba(200,116,40,0.8)}
.gal-btn.mil .gal-btn-inner{background:linear-gradient(160deg,rgba(90,138,60,0.55),rgba(90,138,60,0.18));
  outline:1.5px solid var(--mil);text-shadow:0 0 6px rgba(90,138,60,0.8)}
.gal-btn.blood .gal-btn-inner{background:linear-gradient(160deg,rgba(192,48,16,0.65),rgba(192,48,16,0.2));
  outline:1.5px solid var(--blood);text-shadow:0 0 6px rgba(192,48,16,0.8)}
.gal-btn.gold .gal-btn-inner{background:linear-gradient(160deg,rgba(212,168,50,0.65),rgba(212,168,50,0.2));
  outline:1.5px solid var(--gold);text-shadow:0 0 6px rgba(212,168,50,0.8)}
.gal-btn.steel .gal-btn-inner{background:linear-gradient(160deg,rgba(122,132,112,0.4),rgba(122,132,112,0.1));
  outline:1.5px solid var(--steel)}
.gal-btn:active .gal-btn-inner{filter:brightness(1.5)}
/* ── Troop bar at top of screens ── */
.troop-bar{display:flex;gap:5px;overflow-x:auto;padding:5px 10px;
  background:#0d1008;border-bottom:1px solid var(--edge);flex-shrink:0}
.troop-bar::-webkit-scrollbar{display:none}
.troop-badge{display:flex;align-items:center;gap:4px;background:rgba(20,24,14,0.9);
  border:1px solid var(--edge);padding:3px 8px;white-space:nowrap;font-size:11px;font-weight:700;
  clip-path:polygon(5px 0%,100% 0%,100% 100%,0% 100%,0% 5px)}
/* ── Training card ── */
.train-card{display:flex;align-items:center;gap:10px;padding:10px;
  background:var(--plate2);border-top:1px solid var(--edge);border-bottom:1px solid #0d0f08;
  margin-bottom:6px}
.train-icon{font-size:26px;width:36px;text-align:center;flex-shrink:0}
.train-info{flex:1}
.train-name{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.train-role{font-size:10px;color:var(--muted);margin-top:1px}
.train-cost{font-size:10px;color:var(--rust);margin-top:3px}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-btn{background:var(--plate);border:1px solid var(--edge);color:var(--text);
  width:26px;height:26px;font-size:16px;line-height:1;font-weight:900;cursor:pointer;
  font-family:inherit;text-align:center}
.qty-btn:hover{border-color:var(--rust);color:var(--rust)}
.qty-val{font-size:14px;font-weight:900;min-width:30px;text-align:center;color:var(--gold)}
/* ── Invasion / battle layout ── */
#invasion-map-wrap{width:100%;flex-shrink:0;border-bottom:1px solid var(--edge)}
#invasion-map{display:block;width:100%}
.lane-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;
  padding:8px 10px;background:#0d100a;border-bottom:1px solid var(--edge);flex-shrink:0}
.lane-col{background:var(--plate);border-top:2px solid var(--edge);padding:6px;text-align:center}
.lane-col.left{border-top-color:var(--mil)}
.lane-col.center{border-top-color:var(--rust)}
.lane-col.right{border-top-color:var(--mil)}
.lane-label{font-size:9px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.lane-enemy{font-size:10px;color:var(--blood);margin-bottom:6px;line-height:1.5}
.lane-unit-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:4px}
.lane-unit-icon{font-size:13px}
.lane-unit-type{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;flex:1;text-align:left}
.lane-qty-ctrl{display:flex;align-items:center;gap:3px}
.lqb{background:var(--plate2);border:1px solid var(--edge);color:var(--text);
  width:20px;height:20px;font-size:13px;line-height:1;cursor:pointer;font-family:inherit;text-align:center}
.lqb:hover{border-color:var(--rust);color:var(--rust)}
.lqv{font-size:12px;font-weight:900;min-width:22px;text-align:center;color:var(--gold)}
.lane-strength{font-size:9px;margin-top:4px;letter-spacing:1px}
/* ── Battle log ── */
.battle-log{font-size:11px;line-height:1.8;color:var(--muted);max-height:160px;overflow-y:auto;padding:4px}
.battle-log .hit{color:var(--blood)}
.battle-log .victory{color:var(--mil);font-weight:900}
.battle-log .defeat{color:var(--blood);font-weight:900}
.battle-log .phase{color:var(--rust);font-weight:900}
/* ── Misc ── */
.sec-label{font-size:10px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
  color:var(--rust);margin-bottom:8px;border-left:3px solid var(--rust);padding-left:8px}
.roster-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--edge)}
.roster-row:last-child{border-bottom:none}
.prog-wrap{background:rgba(255,255,255,0.06);height:5px;margin-top:5px;overflow:hidden}
.prog-fill{height:100%;transition:width 0.5s ease}
.small-muted{font-size:12px;color:var(--muted);line-height:1.6}
.build-item{display:flex;align-items:center;gap:10px;padding:10px;
  background:var(--plate2);border-top:1px solid var(--edge);border-bottom:1px solid #0d0f08;margin-bottom:6px;cursor:pointer}
.bi-name{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.bi-cost{font-size:10px;color:var(--rust);margin-top:2px}
.conquest-pips{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.pip{width:13px;height:13px;clip-path:polygon(3px 0%,100% 0%,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.pip.done{background:var(--mil)}.pip.empty{background:#1a1c14;border:1px solid var(--edge)}
#continent-map-wrap{position:relative;width:100%;flex-shrink:0;border-bottom:2px solid var(--edge)}
#continent-map{display:block;width:100%;cursor:pointer}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);
  z-index:200;align-items:flex-end;justify-content:center}
#modal-overlay.open{display:flex}
#modal-box{background:#141810;border-top:2px solid var(--rust);border-left:1px solid var(--edge);
  border-right:1px solid var(--edge);padding:18px;width:100%;max-width:540px;
  max-height:78vh;overflow-y:auto;box-shadow:0 -4px 30px rgba(0,0,0,0.95)}
#modal-box::before{content:'';display:block;width:36px;height:3px;background:var(--rust);margin:0 auto 12px;opacity:.8}
#modal-title{font-size:15px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--rust);margin-bottom:12px}
.planet-wrap{display:flex;justify-content:center;padding:12px 0 6px}
.center{text-align:center}.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.glow-rust{color:var(--rust);text-shadow:0 0 6px rgba(200,116,40,0.6)}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--rust);
  color:#0b0d08;padding:7px 18px;font-weight:900;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .3s;z-index:999;
  clip-path:polygon(8px 0%,100% 0%,100% 100%,0% 100%,0% 8px)}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div id="app">

  <!-- ═══ HOME ═══ -->
  <div id="screen-home" class="screen active">
    <div class="topbar">
      <span class="topbar-title">☠ Legion Galaxy</span>
      <div style="display:flex;gap:6px">
        <button class="back-btn" onclick="openTroops()">🪖 Troops</button>
        <button class="back-btn" onclick="showSolarSystem()">⚡ System</button>
      </div>
    </div>
    <div class="resource-bar" id="res-home"></div>
    <div class="screen-body">
      <div class="planet-wrap"><canvas id="home-planet" width="140" height="140"></canvas></div>
      <div class="center mb8">
        <div id="planet-name-lbl" style="font-size:20px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:var(--rust);text-shadow:0 0 10px rgba(200,116,40,0.5)"></div>
        <div class="conquest-pips mt8" id="conquest-pips"></div>
        <div id="conquest-lbl" style="font-size:11px;color:var(--muted);letter-spacing:1px"></div>
      </div>
      <div class="sec-label">Continents</div>
      <div id="continent-list"></div>
      <div id="sp-locked" class="panel blood" style="display:none;font-size:12px;color:var(--muted);line-height:1.6"></div>
    </div>
  </div>

  <!-- ═══ TROOPS ═══ -->
  <div id="screen-troops" class="screen">
    <div class="topbar">
      <button class="back-btn" id="troops-back">← Back</button>
      <span class="topbar-title">🪖 Barracks</span>
      <span></span>
    </div>
    <div class="resource-bar" id="res-troops"></div>
    <div class="screen-body" id="troops-body"></div>
  </div>

  <!-- ═══ CONTINENT ═══ -->
  <div id="screen-continent" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← Base</button>
      <span class="topbar-title" id="cont-title" style="font-size:12px"></span>
      <span id="cont-status" style="font-size:10px;color:var(--muted);letter-spacing:1px"></span>
    </div>
    <div class="resource-bar" id="res-cont"></div>
    <div id="continent-map-wrap"><canvas id="continent-map"></canvas></div>
    <div class="screen-body" id="cont-body" style="padding-top:8px"></div>
  </div>

  <!-- ═══ BUILDING DETAIL ═══ -->
  <div id="screen-building" class="screen">
    <div class="topbar">
      <button class="back-btn" id="bld-back">← Continent</button>
      <span class="topbar-title" id="bld-title" style="font-size:12px"></span>
      <span></span>
    </div>
    <div class="screen-body" id="bld-body"></div>
  </div>

  <!-- ═══ INVASION ═══ -->
  <div id="screen-invasion" class="screen">
    <div class="topbar">
      <button class="back-btn" id="inv-back">← Retreat</button>
      <span class="topbar-title" style="color:var(--blood)" id="inv-title">⚔ INVASION</span>
      <span id="inv-phase" style="font-size:10px;color:var(--muted);letter-spacing:1px"></span>
    </div>
    <div class="troop-bar" id="troop-bar-inv"></div>
    <div id="invasion-map-wrap"><canvas id="invasion-map"></canvas></div>
    <div class="lane-grid" id="lane-grid"></div>
    <div class="screen-body" id="inv-body" style="padding-top:8px"></div>
  </div>

  <!-- ═══ SOLAR ═══ -->
  <div id="screen-solar" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← Base</button>
      <span class="topbar-title" style="color:var(--mil)">⬡ Korath System</span>
      <span></span>
    </div>
    <div class="screen-body" id="solar-body"></div>
  </div>

</div>

<div id="modal-overlay" onclick="closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="mt12 center">
      <button class="gal-btn rust" onclick="closeModal()"><div class="gal-btn-inner">Close</div></button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
//  SEEDED RNG
// ─────────────────────────────────────────────
function mkRng(seed){
  let s=((seed|0)+6364136223846793005)&0xffffffff;
  return()=>{s=(Math.imul(s,1664525)+1013904223)&0xffffffff;return(s>>>0)/4294967296;};
}
function strSeed(str){let h=0;for(let i=0;i<str.length;i++)h=Math.imul(31,h)+str.charCodeAt(i)|0;return h;}

// ─────────────────────────────────────────────
//  DATA MODEL
// ─────────────────────────────────────────────
const BUILDINGS={
  colonyCenter:      {name:'Colony Center',       short:'COLONY',    icon:'🏛️',summary:'Command hub. Gates the max upgrade level of every other structure.',prod:null},
  resourceCollector: {name:'Resource Collector',  short:'EXTRACTOR', icon:'⛏️',summary:'Mines construction materials. Each upgrade increases metal output.',prod:{res:'metal',base:15}},
  barracks:          {name:'Barracks',            short:'BARRACKS',  icon:'🪖',summary:'Trains Infantry, Tanks, and Cavalry from your Housing population.',prod:null},
  farm:              {name:'Farm',                short:'FARM',      icon:'🌾',summary:'Produces food rations to feed troops and sustain population growth.',prod:{res:'food',base:12}},
  house:             {name:'Housing Block',       short:'HOUSING',   icon:'🏚️',summary:'Shelters colonists. Increases max population capacity per level.',prod:{res:'pop',base:5}},
  researchCenter:    {name:'Research Center',     short:'RESEARCH',  icon:'⚛️',summary:'Drives technology: hull plating, weapon systems, and thruster drives.',prod:{res:'research',base:3}},
  excellorantFactory:{name:'Excellorant Factory', short:'EXCELL.',   icon:'⚡',summary:'Synthesizes Excellorant — accelerates factories, barracks, farms and collectors.',prod:{res:'excellorant',base:1}},
  spaceport:         {name:'Spaceport',           short:'SPACEPORT', icon:'🚀',summary:'Constructs starships. Unlocked after securing 3 of 5 continents.',prod:null},
};
const COSTS={
  colonyCenter:      {metal:500, food:200},
  resourceCollector: {metal:300, food:100},
  barracks:          {metal:400, food:200},
  farm:              {metal:200, food:100},
  house:             {metal:350, food:150},
  researchCenter:    {metal:600, food:300},
  excellorantFactory:{metal:400, food:200},
  spaceport:         {metal:5000,food:2500},
};
const SLOT_ORDER=['colonyCenter','resourceCollector','barracks','farm','house','researchCenter','excellorantFactory','spaceport'];

// Troop definitions — rock-paper-scissors relationships:
// Infantry beats Cavalry, Cavalry beats Tanks, Tanks beat Infantry
const TROOP_TYPES={
  infantry:{name:'Infantry', icon:'🪖',role:'All-purpose. Strong vs Cavalry.',
    cost:{metal:15,food:8,pop:2},atk:1.0,def:1.0,
    strong:'cavalry',weak:'tanks',color:'#5a8a3c'},
  tanks:   {name:'Tanks',    icon:'🛡️',role:'Armored. Strong vs Infantry.',
    cost:{metal:80,food:30,pop:5},atk:1.8,def:2.2,
    strong:'infantry',weak:'cavalry',color:'#c87428'},
  cavalry: {name:'Cavalry',  icon:'🐎',role:'Fast raiders. Strong vs Tanks.',
    cost:{metal:40,food:20,pop:3},atk:1.5,def:1.0,
    strong:'tanks',weak:'infantry',color:'#8888cc'},
};

// Alien garrison templates
function genAliens(threat,seed){
  const r=mkRng(seed);
  if(threat==='GUARDED')  return{infantry:Math.floor(180+r()*80),tanks:Math.floor(40+r()*40), cavalry:Math.floor(20+r()*30)};
  if(threat==='FORTIFIED')return{infantry:Math.floor(380+r()*120),tanks:Math.floor(120+r()*80),cavalry:Math.floor(60+r()*60)};
  return{infantry:60,tanks:10,cavalry:5};
}

const SHIPS=[
  {name:'Fighter',    icon:'✈️',role:'Cheap and deployed in large swarms'},
  {name:'Hauler',     icon:'🛸',role:'Transports troops, builders and cargo'},
  {name:'Cruiser',    icon:'🚀',role:'General-purpose space combat vessel'},
  {name:'Probe',      icon:'🔭',role:'Recons enemy planets — reveals surface activity'},
  {name:'Dreadnaught',icon:'💥',role:'Extremely expensive capital ship for fleet battles'},
];
const RESEARCH=[
  {name:'Hull Plating Mk.I',   icon:'🔩',desc:'Ship hull HP +15%',cost:200},
  {name:'Hull Plating Mk.II',  icon:'🔩',desc:'Ship hull HP +20%',cost:350},
  {name:'Weapon Systems Mk.I', icon:'🔫',desc:'Ship damage +15%', cost:200},
  {name:'Weapon Systems Mk.II',icon:'🔫',desc:'Ship damage +20%', cost:400},
  {name:'Thruster Drive Mk.I', icon:'💨',desc:'Ship speed +10%',  cost:200},
  {name:'Thruster Drive Mk.II',icon:'💨',desc:'Ship speed +15%',  cost:350},
];

const state={
  res:{metal:3500,food:1500,pop:300,research:200,excellorant:20},
  troops:{infantry:0,tanks:0,cavalry:0},
  trainQty:{infantry:10,tanks:5,cavalry:5},
  planet:{
    name:'New Terra',
    continents:[
      {name:'Aurelia',  conquered:true,  threat:'DORMANT',   bldgs:[], aliens:null},
      {name:'Voss',     conquered:false, threat:'GUARDED',   bldgs:[], aliens:null},
      {name:'Kethra',   conquered:false, threat:'GUARDED',   bldgs:[], aliens:null},
      {name:'Drannix',  conquered:false, threat:'FORTIFIED', bldgs:[], aliens:null},
      {name:'Solhaven', conquered:false, threat:'FORTIFIED', bldgs:[], aliens:null},
    ]
  },
  solar:[
    {name:'New Terra',       isHome:true, isAgri:false,col:[200,116,40],colonized:true},
    {name:'Verdant Expanse', isHome:false,isAgri:true, col:[90,160,60], colonized:false},
    {name:'Cinder Hollow',   isHome:false,isAgri:false,col:[180,70,30], colonized:false},
    {name:'Glacian Reach',   isHome:false,isAgri:false,col:[80,140,210],colonized:false},
    {name:'Obsidian Drift',  isHome:false,isAgri:false,col:[140,90,190],colonized:false},
  ],
  selCont:0,selBldg:null,selSlot:-1,researchDone:new Set(),
  invasion:{contIdx:0,lanes:[
    {inf:0,tnk:0,cav:0},{inf:0,tnk:0,cav:0},{inf:0,tnk:0,cav:0}
  ],phase:'deploy'},
};

// Init alien garrisons
state.planet.continents.forEach((c,i)=>{
  if(!c.conquered) c.aliens=genAliens(c.threat,strSeed(c.name));
});

const cc=()=>state.planet.continents.filter(c=>c.conquered).length;
const spUnlocked=()=>cc()>=3;

(function(){

  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;
    stars=Array.from({length:100},()=>({x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.6+0.2,a:Math.random()*0.45+0.1,s:Math.random()*0.07+0.02}));}

    g.addColorStop(0,'rgba(180,80,20,0.07)');g.addColorStop(1,'transparent');

    stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

function drawPlanet(canvas,[r,g,b],size,ring){
  const ctx=canvas.getContext('2d');canvas.width=size;canvas.height=size;
  const cx=size/2,cy=size/2,rad=size/2-3;
  const bg=ctx.createRadialGradient(cx,cy,rad*.5,cx,cy,rad*1.4);
  bg.addColorStop(0,'transparent');bg.addColorStop(1,`rgba(${r*.3|0},${g*.3|0},${b*.3|0},0.4)`);
  ctx.fillStyle=bg;ctx.fillRect(0,0,size,size);
  const sp=ctx.createRadialGradient(cx-rad*.4,cy-rad*.35,1,cx,cy,rad);
  sp.addColorStop(0,`rgba(${Math.min(255,r+90)},${Math.min(255,g+70)},${Math.min(255,b+50)},1)`);
  sp.addColorStop(.4,`rgba(${r},${g},${b},1)`);
  sp.addColorStop(.78,`rgba(${r*.35|0},${g*.3|0},${b*.25|0},1)`);
  sp.addColorStop(1,`rgba(${r*.08|0},${g*.06|0},${b*.05|0},1)`);
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();
  const seed2=r*7+g*13+b*3;
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.clip();
  for(let i=0;i<8;i++){
    const cx2=cx+Math.sin(seed2+i*1.3)*rad*.55,cy2=cy+Math.cos(seed2+i*.9)*rad*.5,
      cr=rad*(.04+Math.abs(Math.sin(seed2+i))*.1);
    const cg=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,cr);
    cg.addColorStop(0,'rgba(0,0,0,0.45)');cg.addColorStop(.6,'rgba(0,0,0,0.18)');cg.addColorStop(1,'transparent');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx2,cy2,cr,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  const term=ctx.createRadialGradient(cx+rad*.2,cy,rad*.1,cx+rad*.5,cy,rad*1.1);
  term.addColorStop(0,'transparent');term.addColorStop(.6,'transparent');term.addColorStop(1,'rgba(0,0,0,0.72)');
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=term;ctx.fill();
  if(ring){ctx.save();ctx.translate(cx,cy);ctx.rotate(-.18);ctx.scale(1,.22);
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`;ctx.lineWidth=5;
    ctx.beginPath();ctx.ellipse(0,0,rad*1.65,rad*1.65,0,0,Math.PI*2);ctx.stroke();ctx.restore();}
}

// ─────────────────────────────────────────────
//  ROCKY TERRAIN (continent + invasion maps)
// ─────────────────────────────────────────────
const CW=540,CH=252;
const SLOT_DEFS=[
  {x:22,y:110},{x:148,y:98},{x:278,y:106},{x:406,y:94},
  {x:60,y:178},{x:188,y:170},{x:320,y:176},{x:450,y:166},
];
const PW=74,PH=42,PDEPTH=12;

function drawRock(ctx,cx,cy,size,rng,r,g,b){
  const pts=9,verts=[];
  for(let i=0;i<pts;i++){const ang=(i/pts)*Math.PI*2;const rad=size*(.65+rng()*.7);
    verts.push({x:cx+Math.cos(ang)*rad,y:cy+Math.sin(ang)*rad*.52});}
  ctx.save();ctx.translate(0,4);
  ctx.beginPath();verts.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));
  ctx.closePath();ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fill();ctx.restore();
  const grd=ctx.createLinearGradient(cx,cy-size*.55,cx+size*.2,cy+size*.45);
  grd.addColorStop(0,`rgb(${Math.min(255,r+38)},${Math.min(255,g+32)},${Math.min(255,b+24)})`);
  grd.addColorStop(.35,`rgb(${r},${g},${b})`);
  grd.addColorStop(.7,`rgb(${r*.7|0},${g*.68|0},${b*.62|0})`);
  grd.addColorStop(1,`rgb(${r*.38|0},${g*.35|0},${b*.3|0})`);
  ctx.beginPath();verts.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));
  ctx.closePath();ctx.fillStyle=grd;ctx.fill();
  ctx.strokeStyle=`rgba(${Math.min(255,r+70)},${Math.min(255,g+60)},${Math.min(255,b+50)},0.32)`;
  ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<Math.ceil(pts/2);i++)i?ctx.lineTo(verts[i].x,verts[i].y):ctx.moveTo(verts[i].x,verts[i].y);
  ctx.stroke();
  ctx.strokeStyle=`rgba(${r*.3|0},${g*.28|0},${b*.25|0},0.5)`;ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(cx-size*.15+rng()*size*.2,cy-size*.1);
  ctx.lineTo(cx+size*.05+rng()*size*.2,cy+size*.25);ctx.stroke();
}

function paintTerrain(ctx,W,H,rng,conquered,threat){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,conquered?'#08100a':'#100806');
  sky.addColorStop(.45,conquered?'#0e1808':'#16100a');
  sky.addColorStop(1,conquered?'#141e0e':'#1c1208');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const haze=ctx.createLinearGradient(0,H*.3,0,H*.55);
  haze.addColorStop(0,'transparent');
  haze.addColorStop(.5,conquered?'rgba(40,60,20,0.18)':'rgba(60,30,10,0.18)');
  haze.addColorStop(1,'transparent');
  ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.026)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const [dR,dG,dB]=conquered?[38,42,28]:[48,34,22];
  for(let i=0;i<14;i++){const rx=rng()*W*.95+W*.02,ry=rng()*H*.28+H*.04,rs=(8+rng()*22)*(1-ry/H*.6);
    drawRock(ctx,rx,ry,rs,rng,dR,dG,dB);}
  const [mR,mG,mB]=conquered?[52,56,38]:[62,44,30];
  for(let i=0;i<10;i++){drawRock(ctx,rng()*W*.9+W*.05,rng()*H*.22+H*.2,18+rng()*36,rng,mR,mG,mB);}
  const [fR,fG,fB]=conquered?[62,66,44]:[72,52,36];
  for(let i=0;i<5;i++)drawRock(ctx,rng()*80+10,H*.45+rng()*H*.28,22+rng()*40,rng,fR,fG,fB);
  for(let i=0;i<5;i++)drawRock(ctx,W-rng()*80-10,H*.45+rng()*H*.28,22+rng()*40,rng,fR,fG,fB);
  for(let i=0;i<6;i++)drawRock(ctx,W*.22+rng()*W*.56,H*.38+rng()*H*.1,10+rng()*22,rng,fR,fG,fB);
  const gnd=ctx.createLinearGradient(0,H*.5,0,H);
  gnd.addColorStop(0,'transparent');gnd.addColorStop(1,conquered?'rgba(12,18,8,0.55)':'rgba(16,10,5,0.6)');
  ctx.fillStyle=gnd;ctx.fillRect(0,0,W,H);
  if(!conquered){
    const fog=ctx.createRadialGradient(W/2,H/2,H*.15,W/2,H/2,H*.9);
    fog.addColorStop(0,'transparent');fog.addColorStop(1,'rgba(18,8,4,0.5)');
    ctx.fillStyle=fog;ctx.fillRect(0,0,W,H);
    for(let i=0;i<5;i++){
      const ax=W*.1+rng()*W*.8,ay=H*.3+rng()*H*.5;
      ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=threat==='FORTIFIED'?'rgba(200,48,16,0.75)':'rgba(200,116,40,0.6)';
      ctx.fillText('⚠',ax,ay);
    }
  }
}

function drawBuildingPad(ctx,s,bldg,selected){
  const{x,y}=s;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath();ctx.ellipse(x+PW/2,y+PH+PDEPTH+4,PW*.5,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0f0e0a';
  ctx.beginPath();ctx.moveTo(x+PW,y+4);ctx.lineTo(x+PW+7,y);ctx.lineTo(x+PW+7,y+PH+PDEPTH-4);
  ctx.lineTo(x+PW,y+PH+PDEPTH);ctx.closePath();ctx.fill();
  const fg=ctx.createLinearGradient(x,y+PH,x,y+PH+PDEPTH);
  fg.addColorStop(0,bldg?'#35301e':'#211e14');fg.addColorStop(1,'#0c0b07');
  ctx.fillStyle=fg;ctx.fillRect(x,y+PH,PW,PDEPTH);
  ctx.strokeStyle='rgba(80,70,45,0.4)';ctx.lineWidth=1;ctx.strokeRect(x,y+PH,PW,PDEPTH);
  const tg=ctx.createLinearGradient(x,y,x+PW*.3,y+PH);
  if(selected){tg.addColorStop(0,'#4a3f1e');tg.addColorStop(.5,'#3a3218');tg.addColorStop(1,'#28260f');}
  else if(bldg){tg.addColorStop(0,'#3a3318');tg.addColorStop(.5,'#2e2a14');tg.addColorStop(1,'#201f0e');}
  else{tg.addColorStop(0,'#252018');tg.addColorStop(.5,'#1c1a10');tg.addColorStop(1,'#161409');}
  ctx.fillStyle=tg;ctx.fillRect(x,y,PW,PH);
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(x,y+PH/2);ctx.lineTo(x+PW,y+PH/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+PW/2,y);ctx.lineTo(x+PW/2,y+PH);ctx.stroke();
  const bc=selected?'rgba(255,220,80,0.9)':bldg?'rgba(200,116,40,0.7)':'rgba(90,80,55,0.45)';
  ctx.strokeStyle=bc;ctx.lineWidth=selected?2:1.5;ctx.strokeRect(x,y,PW,PH);
  if(selected){ctx.strokeStyle='rgba(255,220,80,0.22)';ctx.lineWidth=5;ctx.strokeRect(x-2,y-2,PW+4,PH+4);}
  ctx.font='bold 9px Courier New';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='rgba(200,116,40,0.55)';ctx.fillText(`P${SLOT_DEFS.indexOf(s)+1}`,x+3,y+2);
  if(bldg){
    const inf=BUILDINGS[bldg.type];
    ctx.font=`${Math.floor(PH*.52)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(inf.icon,x+PW/2,y+PH*.42);
    ctx.font='900 8px Courier New';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillStyle=bldg.type==='spaceport'?'#5a8a3c':'#c87428';
    ctx.fillText(`LVL ${bldg.level}`,x+PW/2,y+PH-2);
  } else {
    ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=selected?'rgba(255,220,80,0.8)':'rgba(200,116,40,0.32)';
    ctx.fillText('+',x+PW/2,y+PH/2-1);
  }
}

function drawContinentMap(canvas,cont,selSlot){
  canvas.width=CW;canvas.height=CH;
  const ctx=canvas.getContext('2d');
  const rng=mkRng(strSeed(cont.name));
  paintTerrain(ctx,CW,CH,rng,cont.conquered,cont.threat);
  if(cont.conquered){
    SLOT_DEFS.forEach((s,i)=>drawBuildingPad(ctx,s,cont.bldgs.find(b=>b.slot===i)||null,selSlot===i));
  }
  ctx.font='900 11px Courier New';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='rgba(200,116,40,0.5)';ctx.fillText(cont.name.toUpperCase(),10,8);
  ctx.strokeStyle=cont.conquered?'rgba(90,138,60,0.3)':'rgba(192,48,16,0.28)';
  ctx.lineWidth=1.5;ctx.strokeRect(0,0,CW,CH);
}

// ─────────────────────────────────────────────
//  INVASION BATTLE MAP
// ─────────────────────────────────────────────
const LANE_NAMES=['LEFT FLANK','CENTER','RIGHT FLANK'];
const LANE_COLORS=['rgba(90,138,60,0.5)','rgba(200,116,40,0.5)','rgba(90,138,60,0.5)'];
let battleAnimId=null;

function drawInvasionMap(canvas,aliens,phase,laneResults){
  const W=CW,H=180;
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const cont=state.planet.continents[state.invasion.contIdx];
  const rng=mkRng(strSeed(cont.name+'battle'));
  paintTerrain(ctx,W,H,rng,false,cont.threat);

  // 3 lane dividers
  const laneW=W/3;
  for(let i=1;i<3;i++){
    ctx.strokeStyle='rgba(200,116,40,0.2)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(laneW*i,0);ctx.lineTo(laneW*i,H);ctx.stroke();ctx.setLineDash([]);
  }

  // Lane labels + alien/player unit icons
  LANE_NAMES.forEach((lname,li)=>{
    const lx=laneW*li,cx2=lx+laneW/2;
    ctx.font='900 9px Courier New';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle=LANE_COLORS[li];ctx.fillText(lname,cx2,6);

    if(phase==='deploy'){
      // Alien icons — defender side (right of each lane)
      const aDist=aliens.lanes[li];
      const icons=[];
      for(let i=0;i<Math.min(5,Math.ceil(aDist.infantry/30));i++)icons.push({icon:'🔴',x:lx+laneW*.78-i*11,y:H*.42});
      for(let i=0;i<Math.min(4,Math.ceil(aDist.tanks/15));i++)   icons.push({icon:'🟠',x:lx+laneW*.82-i*11,y:H*.58});
      for(let i=0;i<Math.min(4,Math.ceil(aDist.cavalry/10));i++) icons.push({icon:'🟡',x:lx+laneW*.7-i*11, y:H*.72});
      icons.forEach(ic=>{ctx.font='13px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ic.icon,ic.x,ic.y);});
      // Deploy zone marker
      ctx.strokeStyle='rgba(90,138,60,0.3)';ctx.lineWidth=1;
      ctx.strokeRect(lx+4,H*.35,laneW*.55,H*.5);
      ctx.font='8px Courier New';ctx.textAlign='left';ctx.textBaseline='top';
      ctx.fillStyle='rgba(90,138,60,0.5)';ctx.fillText('DEPLOY ZONE',lx+6,H*.35+2);

    } else if(phase==='battle'||phase==='done'){
      // results
      const res=laneResults&&laneResults[li];
      if(res){
        const winColor=res.win?'rgba(90,138,60,0.8)':'rgba(192,48,16,0.8)';
        ctx.fillStyle=res.win?'rgba(90,138,60,0.12)':'rgba(192,48,16,0.1)';
        ctx.fillRect(lx+2,2,laneW-4,H-4);
        ctx.font='bold 26px serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=winColor;ctx.fillText(res.win?'✓':'✗',cx2,H/2);
        ctx.font='900 10px Courier New';ctx.textBaseline='bottom';
        ctx.fillStyle=winColor;ctx.fillText(res.win?'CAPTURED':'REPELLED',cx2,H-8);
      }
    }
  });

  ctx.strokeStyle='rgba(192,48,16,0.35)';ctx.lineWidth=1.5;ctx.strokeRect(0,0,W,H);
}

function adjQty(key,delta){

function trainTroops(key){
  const troop=TROOP_TYPES[key];
  const qty=state.trainQty[key]||10;
  const c={metal:troop.cost.metal*qty,food:troop.cost.food*qty,pop:troop.cost.pop*qty};

  state.troops[key]+=qty;

function setupMapClick(){
  const canvas=document.getElementById('continent-map');
  canvas.onclick=canvas.ontouchend=function(e){
    e.preventDefault();
    const touch=e.changedTouches?e.changedTouches[0]:e;
    const rect=canvas.getBoundingClientRect();
    const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
    const cx=(touch.clientX-rect.left)*sx,cy=(touch.clientY-rect.top)*sy;
    if(!state.planet.continents[state.selCont].conquered)return;
    for(let i=0;i<SLOT_DEFS.length;i++){
      const s=SLOT_DEFS[i];
      if(cx>=s.x-4&&cx<=s.x+PW+10&&cy>=s.y-4&&cy<=s.y+PH+PDEPTH+4){
        state.selSlot=i;refreshContMap();
        const bldg=state.planet.continents[state.selCont].bldgs.find(b=>b.slot===i);
        bldg?openBuilding(bldg,state.selCont):showBuildMenu(state.selCont,i);
        return;
      }
    }
  };
}

function openInvasion(contIdx){
  state.invasion.contIdx=contIdx;
  state.invasion.phase='deploy';
  state.invasion.laneResults=null;
  // Reset lane deployments
  state.invasion.lanes=[{inf:0,tnk:0,cav:0},{inf:0,tnk:0,cav:0},{inf:0,tnk:0,cav:0}];

  const cont=state.planet.continents[contIdx];
  const al=cont.aliens;
  // Distribute alien defenders across 3 lanes
  const rng=mkRng(strSeed(cont.name+'lanes'));
  const split=(total)=>{
    const a=Math.floor(total*(.3+rng()*.25)),b=Math.floor(total*(.3+rng()*.2)),c=total-a-b;
    return[Math.max(0,a),Math.max(0,b),Math.max(0,c)];
  };
  const [ai1,ai2,ai3]=split(al.infantry);
  const [at1,at2,at3]=split(al.tanks);
  const [ac1,ac2,ac3]=split(al.cavalry);
  state.invasion.alienLanes=[
    {infantry:ai1,tanks:at1,cavalry:ac1},
    {infantry:ai2,tanks:at2,cavalry:ac2},
    {infantry:ai3,tanks:at3,cavalry:ac3},
  ];

  document.getElementById('inv-title').textContent=`⚔ INVADE ${cont.name.toUpperCase()}`;
  document.getElementById('inv-back').onclick=()=>openContinent(contIdx);
  document.getElementById('inv-phase').textContent='DEPLOY';
  document.getElementById('troop-bar-inv').innerHTML=troopHTML();

  refreshInvasionMap();
  renderLaneGrid();
  renderInvBody();
  showScreen('invasion');
}

function refreshInvasionMap(){
  const canvas=document.getElementById('invasion-map');
  const cont=state.planet.continents[state.invasion.contIdx];
  const W=document.getElementById('invasion-map-wrap').offsetWidth||CW;
  canvas.style.width='100%';
  drawInvasionMap(canvas,{lanes:state.invasion.alienLanes},state.invasion.phase,state.invasion.laneResults);

function renderLaneGrid(){
  const grid=document.getElementById('lane-grid');
  const t=state.troops;
  const deployed=deployedTroops();
  const avail={infantry:t.infantry-deployed.infantry,tanks:t.tanks-deployed.tanks,cavalry:t.cavalry-deployed.cavalry};

  if(state.invasion.phase!=='deploy'){grid.innerHTML='';return;}

  grid.innerHTML=state.invasion.lanes.map((lane,li)=>{
    const en=state.invasion.alienLanes[li];
    const enTotal=en.infantry+en.tanks+en.cavalry;
    const attackPow=(lane.inf*1.0+lane.tnk*1.8+lane.cav*1.5).toFixed(0);
    const defPow=(en.infantry*1.0+en.tanks*2.2+en.cavalry*1.3).toFixed(0);
    const advColor=attackPow>=defPow?'var(--mil)':'var(--blood)';
    return `<div class="lane-col ${['left','center','right'][li]}">
      <div class="lane-label" style="color:${LANE_COLORS[li]}">${LANE_NAMES[li]}</div>
      <div class="lane-enemy">👾 ${en.infantry} · ⬛${en.tanks} · ⚡${en.cavalry}</div>
      ${['infantry','tanks','cavalry'].map(ut=>{
        const utInst={infantry:{icon:'🪖',field:'inf',color:'var(--mil)'},
          tanks:{icon:'🛡️',field:'tnk',color:'var(--rust)'},
          cavalry:{icon:'🐎',field:'cav',color:'#8888cc'}}[ut];
        const val=lane[utInst.field];
        const av=t[ut]-(state.invasion.lanes.reduce((a,l)=>a+l[utInst.field],0)-val);
        return `<div class="lane-unit-row">
          <span class="lane-unit-icon">${utInst.icon}</span>
          <div class="lane-qty-ctrl">
            <button class="lqb" onclick="adjLane(${li},'${utInst.field}',-1)">−</button>
            <span class="lqv" style="color:${utInst.color}">${val}</span>
            <button class="lqb" onclick="adjLane(${li},'${utInst.field}',1)">+</button>
          </div>
        </div>`;
      }).join('')}
      <div class="lane-strength" style="color:${advColor}">ATK:${attackPow} DEF:${defPow}</div>
    </div>`;
  }).join('');
}

function adjLane(laneIdx,field,delta){
  const t=state.troops;
  const keyMap={inf:'infantry',tnk:'tanks',cav:'cavalry'};
  const troopKey=keyMap[field];
  const totalDeployed=state.invasion.lanes.reduce((a,l)=>a+l[field],0);
  const newVal=state.invasion.lanes[laneIdx][field]+delta;
  if(newVal<0)return;
  if(delta>0&&totalDeployed>=t[troopKey]){toast(`// NO MORE ${troopKey.toUpperCase()} AVAILABLE //`);return;}
  state.invasion.lanes[laneIdx][field]=newVal;
  renderLaneGrid();
  refreshInvasionMap();
}

function renderInvBody(){
  const body=document.getElementById('inv-body');
  if(state.invasion.phase==='deploy'){
    const dep=deployedTroops();
    const total=dep.infantry+dep.tanks+dep.cavalry;
    body.innerHTML=`
      <div class="panel steel mb8">
        <div style="font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:6px">DEPLOYMENT STATUS</div>
        <div style="font-size:12px;color:var(--text)">Deploying: <span style="color:var(--gold);font-weight:900">${total} troops</span> across 3 lanes</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Use ± buttons above to assign troops to each assault lane. Match your unit types against enemy weaknesses.</div>
      </div>
      <div class="center">
        <button class="gal-btn ${total>0?'blood':'steel'}" onclick="engageInvasion()">
          <div class="gal-btn-inner">⚔ ENGAGE — SEND ${total} TROOPS</div>
        </button>
      </div>`;
  }
}

function engageInvasion(){
  const dep=deployedTroops();
  if(dep.infantry+dep.tanks+dep.cavalry===0){toast('// DEPLOY TROOPS FIRST //');return;}
  state.invasion.phase='battle';
  document.getElementById('inv-phase').textContent='BATTLE';
  renderLaneGrid();

  // Resolve combat per lane
  const results=state.invasion.lanes.map((lane,li)=>{
    const en=state.invasion.alienLanes[li];
    // Attack power with type advantages
    let atk=0;
    atk+=lane.inf*1.0*(en.cavalry>en.tanks?1.4:1.0);   // inf strong vs cav
    atk+=lane.tnk*1.8*(en.infantry>en.cavalry?1.4:1.0); // tnk strong vs inf
    atk+=lane.cav*1.5*(en.tanks>en.infantry?1.5:1.0);   // cav strong vs tnk
    // Defense power
    let def=0;
    def+=en.infantry*1.0*(lane.cav>lane.tnk?1.3:1.0);   // alien inf vs player cav
    def+=en.tanks*2.2*(lane.inf>lane.cav?1.3:1.0);       // alien tnk vs player inf
    def+=en.cavalry*1.3*(lane.tnk>lane.inf?1.2:1.0);     // alien cav vs player tnk
    const deployed=lane.inf+lane.tnk+lane.cav;
    const win=atk>=def*0.8||(deployed===0?false:atk>def*0.6);
    // Calculate casualties (25-45% of deployed on win, 60-85% on loss)
    const casRate=win?(0.25+Math.random()*.2):(0.60+Math.random()*.25);
    const infLost=Math.floor(lane.inf*casRate);
    const tnkLost=Math.floor(lane.tnk*casRate);
    const cavLost=Math.floor(lane.cav*casRate);
    return{win,atk:atk.toFixed(0),def:def.toFixed(0),infLost,tnkLost,cavLost,lane:li};
  });

  state.invasion.laneResults=results;

  // Deduct casualties + determine overall victory
  let totalInfLost=0,totalTnkLost=0,totalCavLost=0;
  results.forEach(r=>{totalInfLost+=r.infLost;totalTnkLost+=r.tnkLost;totalCavLost+=r.cavLost;});
  state.troops.infantry=Math.max(0,state.troops.infantry-totalInfLost);
  state.troops.tanks=Math.max(0,state.troops.tanks-totalTnkLost);
  state.troops.cavalry=Math.max(0,state.troops.cavalry-totalCavLost);

  const lanesWon=results.filter(r=>r.win).length;
  const overallVictory=lanesWon>=2;

  refreshInvasionMap();

  // Battle log
  const body=document.getElementById('inv-body');
  let log='';
  results.forEach(r=>{
    log+=`<div class="phase">${LANE_NAMES[r.lane]}</div>`;
    log+=`<div>ATK POWER: ${r.atk} vs DEF POWER: ${r.def}</div>`;
    if(r.win){
      log+=`<div class="victory">▶ LANE CAPTURED — Casualties: 🪖${r.infLost} 🛡️${r.tnkLost} 🐎${r.cavLost}</div>`;
    } else {
      log+=`<div class="hit">▶ REPELLED — Casualties: 🪖${r.infLost} 🛡️${r.tnkLost} 🐎${r.cavLost}</div>`;
    }
  });
  log+=`<div class="${overallVictory?'victory':'defeat'}" style="margin-top:8px;font-size:13px">
    ${overallVictory?`✓ VICTORY — ${lanesWon}/3 LANES SECURED`:`✗ ASSAULT REPELLED — ${lanesWon}/3 LANES CAPTURED`}
  </div>`;
  log+=`<div style="font-size:11px;color:var(--muted);margin-top:4px">Losses: 🪖${totalInfLost} 🛡️${totalTnkLost} 🐎${totalCavLost}</div>`;

  body.innerHTML=`
    <div class="panel ${overallVictory?'mil':'blood'} mb8">
      <div style="font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:6px">// BATTLE REPORT //</div>
      <div class="battle-log">${log}</div>
    </div>
    <div class="center">
      ${overallVictory
        ?`<button class="gal-btn mil" onclick="finalizeVictory(${state.invasion.contIdx})"><div class="gal-btn-inner">✓ Claim Territory</div></button>`
        :`<button class="gal-btn blood" onclick="openInvasion(${state.invasion.contIdx})"><div class="gal-btn-inner">↺ Regroup &amp; Attack Again</div></button>`}
    </div>`;

  document.getElementById('troop-bar-inv').innerHTML=troopHTML();
  state.invasion.phase='done';
  document.getElementById('inv-phase').textContent=overallVictory?'VICTORY':'DEFEATED';
}

function finalizeVictory(idx){
  const cont=state.planet.continents[idx];
  cont.conquered=true;cont.bldgs=[];cont.aliens=null;
  toast(`// ${cont.name.toUpperCase()} SECURED //`);
  renderHome();openContinent(idx);
}

      ${SHIPS.map(s=>`<div class="roster-row"><span style="font-size:20px;width:26px">${s.icon}</span>
        <div><div style="font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px">${s.name}</div>
        <div style="font-size:11px;color:var(--muted)">${s.role}</div></div></div>`).join('')}</div>`;
  }
  if(bldg.type==='researchCenter'){
    rosterHTML=`<div class="sec-label">Ship Research</div><div class="panel mb12">
      ${RESEARCH.map((r,i)=>{const done=state.researchDone.has(i);
        return`<div class="roster-row" style="align-items:center">
          <span style="font-size:18px;width:24px">${r.icon}</span>
          <div style="flex:1"><div style="font-size:11px;font-weight:900;text-transform:uppercase;${done?'color:var(--muted)':''}">${r.name}</div>
          <div style="font-size:10px;color:var(--muted)">${r.desc} · ${r.cost} Research</div></div>
          <button class="gal-btn ${done?'rust':'mil'}" onclick="doResearch(${i},${r.cost})" style="margin-left:6px">
            <div class="gal-btn-inner" style="padding:5px 9px;font-size:9px">${done?'✓':'RESEARCH'}</div>
          </button></div>`;}).join('')}</div>`;
  }
  document.getElementById('bld-body').innerHTML=`
    <div class="center" style="padding:18px 0 10px">
      <div style="font-size:50px;filter:drop-shadow(0 0 8px rgba(200,116,40,0.5))">${info.icon}</div>
      <div style="font-size:17px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--rust);text-shadow:0 0 8px rgba(200,116,40,0.5);margin-top:8px">${info.name.toUpperCase()}</div>
      <div style="font-size:12px;color:var(--mil);font-family:monospace;margin-top:4px;letter-spacing:2px">LEVEL ${bldg.level}</div>
    </div>
    <div class="panel steel mb12"><p class="small-muted">${info.summary}</p></div>
    ${prodHTML}
    <div class="panel rust mb12">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:1px">
        <span>UPGRADE COST</span><span style="color:var(--rust)">⛏ ${upgCost} METAL</span></div>
      <div class="prog-wrap mb8"><div class="prog-fill" style="background:var(--rust);width:${Math.min(100,bldg.level*8)}%"></div></div>
      <div class="center"><button class="gal-btn rust" onclick="upgradeBuilding()"><div class="gal-btn-inner">⬆ Upgrade → Lv ${bldg.level+1}</div></button></div>
    </div>
    ${rosterHTML}`;
  showScreen('building');
}

function upgradeBuilding(){
  const b=state.selBldg,cost=120*b.level*b.level;
  if(state.res.metal<cost){toast('// INSUFFICIENT METAL //');return;}
  state.res.metal-=cost;b.level++;
  toast(`// ${BUILDINGS[b.type].short} → LVL ${b.level} //`);
  openBuilding(b,state.selCont);
}

function doResearch(idx,cost){
  if(state.researchDone.has(idx)){toast('// ALREADY RESEARCHED //');return;}
  if(state.res.research<cost){toast(`// NEED ${cost} RESEARCH //`);return;}
  state.res.research-=cost;state.researchDone.add(idx);
  toast(`// ${RESEARCH[idx].name.toUpperCase()} UNLOCKED //`);
  openBuilding(state.selBldg,state.selCont);
}

// ─────────────────────────────────────────────
//  SOLAR SYSTEM
// ─────────────────────────────────────────────
function showSolarSystem(){
  const body=document.getElementById('solar-body');body.innerHTML='';
  const sw=document.createElement('div');sw.className='planet-wrap';
  sw.innerHTML='<canvas id="sun-c" width="80" height="80" style="border-radius:50%"></canvas>';
  body.appendChild(sw);
  const sl=document.createElement('div');sl.className='center mb12';
  sl.style.cssText='font-size:11px;letter-spacing:3px;color:var(--rust);text-transform:uppercase';
  sl.textContent='☀ Korath Star';body.appendChild(sl);
  setTimeout(()=>{const s=document.getElementById('sun-c');if(s)drawPlanet(s,[255,200,50],80,false);},10);
  state.solar.forEach((planet,i)=>{
    const wrap=document.createElement('div');wrap.className='mb8';
    wrap.innerHTML=`<div class="panel ${planet.isHome?'rust':planet.isAgri?'mil':'steel'}" style="cursor:pointer">
      <div style="display:flex;align-items:center;gap:12px">
        <canvas id="pm-${i}" width="54" height="54" style="border-radius:50%;flex-shrink:0"></canvas>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px">${planet.name}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">${planet.isHome?'HOME WORLD':planet.isAgri?'AGRIWORLD — RESOURCE RICH':'MINOR COLONY SITE'}</div>
          ${planet.colonized?'<div style="font-size:9px;color:var(--mil);margin-top:2px;letter-spacing:1px">// COLONIZED //</div>':''}
        </div><span style="color:var(--muted);font-size:18px">›</span>
      </div></div>`;
    wrap.onclick=()=>openPlanetModal(i);body.appendChild(wrap);
    setTimeout(()=>{const c=document.getElementById(`pm-${i}`);if(c)drawPlanet(c,planet.col,54,i===3);},10);
  });
  const brief=document.createElement('div');brief.className='panel blood mt12';
  brief.innerHTML=`<div class="sec-label" style="color:var(--warn);border-color:var(--warn)">// AgriWorld Warning //</div>
    <p class="small-muted">Deploy Haulers to Verdant Expanse to establish outposts. <span style="color:var(--warn)">CAUTION:</span> Alien counterattacks escalate the longer you hold ground there.</p>`;
  body.appendChild(brief);showScreen('solar');
}

function openPlanetModal(idx){
  const planet=state.solar[idx];const cost=planet.isAgri?3000:1000;
  document.getElementById('modal-title').textContent=planet.name;
  document.getElementById('modal-body').innerHTML=`
    <div class="center mb12"><canvas id="modal-planet-c" width="100" height="100" style="border-radius:50%"></canvas></div>
    <div class="panel steel mb12 small-muted">${planet.isHome?'Your home world. Expand across all 5 continents.':planet.isAgri?'Resource-rich AgriWorld. Alien attacks escalate over time.':'Minor colony for a trickle of resources.'}</div>
    ${!planet.colonized&&!planet.isHome?`<div class="center"><button class="gal-btn rust" onclick="colonizePlanet(${idx},${cost})"><div class="gal-btn-inner">🛸 Deploy Hauler (${cost} Metal)</div></button></div>`:`<div class="center small-muted">${planet.isHome?'Currently inhabited.':'Colony established.'}</div>`}`;
  setTimeout(()=>{const c=document.getElementById('modal-planet-c');if(c)drawPlanet(c,planet.col,100,idx===3);},10);
  document.getElementById('modal-overlay').classList.add('open');
}

function colonizePlanet(idx,cost){
  if(!spUnlocked()){toast('// BUILD SPACEPORT FIRST //');closeModal();return;}
  if(state.res.metal<cost){toast(`// NEED ${cost} METAL //`);closeModal();return;}
  state.res.metal-=cost;state.solar[idx].colonized=true;
  toast(`// ${state.solar[idx].name.toUpperCase()} COLONIZED //`);closeModal();showSolarSystem();
}

// ─────────────────────────────────────────────
//  NAV + TOAST
// ─────────────────────────────────────────────
function showScreen(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+n).classList.add('active');}
function goHome(){renderHome();showScreen('home');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
let _tt;
function toast(msg){const el=document.getElementById('toast');clearTimeout(_tt);el.textContent=msg;el.style.opacity='1';_tt=setTimeout(()=>el.style.opacity='0',2600);}

// ─── INIT ───
renderHome();
</script>
</body>
</html>
