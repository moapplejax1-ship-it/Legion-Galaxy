// ─── State Initialization ───────────────────────────────────────────────────

function initFleet() {
  if (!state.fleet) {
    state.fleet = {
      ships: [],
      buildQueue: [],
    };
  }
  if (!state.fleet.ships) state.fleet.ships = [];
  if (!state.fleet.buildQueue) state.fleet.buildQueue = [];
}

// ─── Helper: compute final stats for a ship class+variant ──────────────────

function _shipFinalStats(shipClass, variant) {
  const def = SHIP_DEFS[shipClass];
  if (!def) return null;
  let hp = def.hp, atk = def.atk, spd = def.spd;
  let upkeep = { ...def.upkeep };
  let fighterCapacity = def.fighterCapacity || 0;
  let extraFlags = {};

  if (variant) {
    const vd = SHIP_VARIANTS[variant];
    if (vd && vd.modifiers) {
      const m = vd.modifiers;
      if (m.hp !== undefined) hp = Math.round(hp * m.hp);
      if (m.atk !== undefined) atk = Math.round(atk * m.atk);
      if (m.spd !== undefined) spd = Math.round(spd * m.spd * 10) / 10;
      if (m.fighterCapacity !== undefined) fighterCapacity = m.fighterCapacity;
      if (m.upkeep) {
        Object.keys(m.upkeep).forEach(k => {
          if (upkeep[k] !== undefined) upkeep[k] = Math.round(upkeep[k] * m.upkeep[k]);
        });
      }
      // Copy special flags
      ['atkVsBuildings','atkVsDefenses','jammingAura','orbitalBombardment','fleetAura','hasShields','canStealthScout','yieldBonus'].forEach(f => {
        if (m[f] !== undefined) extraFlags[f] = m[f];
      });
    }
  }
  return { hp, atk, spd, upkeep, fighterCapacity, extraFlags };
}

function _shipBuildCost(shipClass, variant) {
  const def = SHIP_DEFS[shipClass];
  if (!def) return null;
  let cost = { ...def.cost };
  if (variant) {
    const vd = SHIP_VARIANTS[variant];
    if (vd && vd.costMult && vd.costMult !== 1.0) {
      Object.keys(cost).forEach(k => {
        cost[k] = Math.round(cost[k] * vd.costMult);
      });
    }
  }
  return cost;
}

// ─── Building Functions ─────────────────────────────────────────────────────

function canBuildShip(shipClass, variant) {
  initFleet();
  const def = SHIP_DEFS[shipClass];
  if (!def) return { ok: false, reason: 'Unknown ship class' };

  // Check spaceport exists
  const hasSpaceport = state.planet.continents.some(c =>
    c.conquered && c.bldgs && c.bldgs.some(b => b.type === 'spaceport')
  );
  if (!hasSpaceport) return { ok: false, reason: 'No Spaceport constructed' };

  // Check research unlock for dreadnaught
  if (def.requiresResearch && !state.researchDone.has(def.requiresResearch)) {
    // Check by name fallback (research might be stored differently)
    const dreadUnlocked = Array.from(state.researchDone).some(r => r === 'dreadnaught_unlock') ||
      state.techUnlocked.has('dreadnaught');
    if (!dreadUnlocked) return { ok: false, reason: 'Requires Dreadnaught research unlock' };
  }

  // Check max per fleet
  if (def.maxPerFleet !== null) {
    const count = state.fleet.ships.filter(s => s.class === shipClass).length +
      state.fleet.buildQueue.filter(q => q.class === shipClass).length;
    if (count >= def.maxPerFleet) {
      return { ok: false, reason: `Max ${def.maxPerFleet} ${def.name}(s) allowed per Spaceport` };
    }
  }

  // Fighter cap
  if (shipClass === 'fighter') {
    const fighterCount = state.fleet.ships.filter(s => s.class === 'fighter').length +
      state.fleet.buildQueue.filter(q => q.class === 'fighter').length;
    if (fighterCount >= 20) return { ok: false, reason: 'Fighter cap reached (20 max)' };
  }

  const cost = _shipBuildCost(shipClass, variant);
  if (!cost) return { ok: false, reason: 'Invalid variant' };

  // Validate variant belongs to this class
  if (variant) {
    const vd = SHIP_VARIANTS[variant];
    if (!vd) return { ok: false, reason: 'Unknown variant' };
    if (vd.parentClass !== shipClass) return { ok: false, reason: 'Variant does not match ship class' };
  }

  const res = state.res;
  if (cost.metal > 0 && (res.metal || 0) < cost.metal)
    return { ok: false, reason: `Need ${fmt(cost.metal)} Metal (have ${fmt(res.metal || 0)})` };
  if (cost.food > 0 && (res.food || 0) < cost.food)
    return { ok: false, reason: `Need ${fmt(cost.food)} Food (have ${fmt(res.food || 0)})` };
  if (cost.research > 0 && (res.research || 0) < cost.research)
    return { ok: false, reason: `Need ${fmt(cost.research)} Research (have ${fmt(res.research || 0)})` };
  if (cost.credits > 0 && (res.credits || 0) < cost.credits)
    return { ok: false, reason: `Need ${fmt(cost.credits)} Credits (have ${fmt(res.credits || 0)})` };

  return { ok: true, reason: null };
}

function startShipBuild(shipClass, variant) {
  initFleet();
  const check = canBuildShip(shipClass, variant);
  if (!check.ok) { toast('// ' + check.reason.toUpperCase() + ' //'); return; }

  const cost = _shipBuildCost(shipClass, variant);
  const def = SHIP_DEFS[shipClass];

  // Deduct resources
  state.res.metal = (state.res.metal || 0) - (cost.metal || 0);
  state.res.food = (state.res.food || 0) - (cost.food || 0);
  state.res.research = (state.res.research || 0) - (cost.research || 0);
  state.res.credits = (state.res.credits || 0) - (cost.credits || 0);

  const vd = variant ? SHIP_VARIANTS[variant] : null;
  const shipName = vd ? vd.name : def.name;
  const buildEnd = Date.now() + def.buildTime * 1000;

  state.fleet.buildQueue.push({
    id: nextUid(),
    class: shipClass,
    variant: variant || null,
    name: shipName,
    buildEnd,
    buildStart: Date.now(),
    buildTime: def.buildTime * 1000,
  });

  renderAllResBars();
  toast(`// ${shipName.toUpperCase()} CONSTRUCTION STARTED //`);
  // Refresh spaceport detail if visible
  if (typeof _refreshFleetUI === 'function') _refreshFleetUI();
}

function _shipBuildTick() {
  if (!state.fleet || !state.fleet.buildQueue || state.fleet.buildQueue.length === 0) return;
  const now = Date.now();
  const completed = [];
  state.fleet.buildQueue = state.fleet.buildQueue.filter(q => {
    if (now >= q.buildEnd) { completed.push(q); return false; }
    return true;
  });
  completed.forEach(q => {
    const def = SHIP_DEFS[q.class];
    const stats = _shipFinalStats(q.class, q.variant);
    const ship = {
      id: q.id,
      class: q.class,
      variant: q.variant,
      name: q.name,
      hp: stats.hp, maxHp: stats.hp,
      atk: stats.atk, spd: stats.spd,
      status: 'docked',
      buildEnd: null,
      carriedFighters: [],
      assignedContinent: null,
      flags: stats.extraFlags,
    };
    state.fleet.ships.push(ship);
    toast(`// ${q.name.toUpperCase()} CONSTRUCTION COMPLETE //`);
  });
  if (completed.length > 0 && typeof _refreshFleetUI === 'function') _refreshFleetUI();
}

// Start the build tick interval (call once on game load)
function startShipBuildInterval() {
  if (window._shipBuildIntervalId) clearInterval(window._shipBuildIntervalId);
  window._shipBuildIntervalId = setInterval(_shipBuildTick, 1000);
}

// ─── Upkeep Functions ───────────────────────────────────────────────────────

function calcFleetUpkeep() {
  initFleet();
  const total = { metal: 0, food: 0, energy: 0, credits: 0 };
  state.fleet.ships.forEach(ship => {
    const stats = _shipFinalStats(ship.class, ship.variant);
    if (!stats) return;
    total.metal += stats.upkeep.metal || 0;
    total.food += stats.upkeep.food || 0;
    total.energy += stats.upkeep.energy || 0;
    total.credits += stats.upkeep.credits || 0;
  });
  return total;
}

function applyFleetUpkeep() {
  initFleet();
  if (state.fleet.ships.length === 0) return;
  const upkeep = calcFleetUpkeep();
  const res = state.res;

  // Warn if any resource is critically short
  const metalShort = (res.metal || 0) < upkeep.metal;
  const foodShort = (res.food || 0) < upkeep.food;
  const energyShort = (res.energy || 0) < upkeep.energy;
  const creditsShort = (res.credits || 0) < upkeep.credits;

  if (metalShort || foodShort || energyShort || creditsShort) {
    // Decommission the most expensive ship if fully bankrupt
    const totalIncome = _estimateTotalIncome();
    const canAffordAny = (res.metal + res.food + res.energy + res.credits) > 0;
    if (!canAffordAny || (metalShort && foodShort)) {
      // Decommission most expensive ship
      let mostExpensive = null, maxCost = -1;
      state.fleet.ships.forEach(ship => {
        const stats = _shipFinalStats(ship.class, ship.variant);
        const totalUpkeep = stats.upkeep.metal + stats.upkeep.food + stats.upkeep.energy + stats.upkeep.credits;
        if (totalUpkeep > maxCost) { maxCost = totalUpkeep; mostExpensive = ship; }
      });
      if (mostExpensive) {
        state.fleet.ships = state.fleet.ships.filter(s => s.id !== mostExpensive.id);
        toast(`// ${mostExpensive.name.toUpperCase()} DECOMMISSIONED — BANKRUPT //`);
      }
      return;
    }
    toast('// FLEET UPKEEP WARNING: LOW RESOURCES //');
  }

  // Deduct upkeep
  res.metal = Math.max(0, (res.metal || 0) - upkeep.metal);
  res.food = Math.max(0, (res.food || 0) - upkeep.food);
  res.energy = Math.max(0, (res.energy || 0) - upkeep.energy);
  res.credits = Math.max(0, (res.credits || 0) - upkeep.credits);
}

function _estimateTotalIncome() {
  // Rough estimate from buildings — used for upkeep warning threshold
  let metal = 0, food = 0;
  state.planet.continents.forEach(c => {
    if (!c.conquered || !c.bldgs) return;
    c.bldgs.forEach(b => {
      if (b.type === 'resourceCollector') metal += 15 * (b.level || 1);
      if (b.type === 'farm') food += 12 * (b.level || 1);
    });
  });
  return { metal, food };
}

// ─── Ship Assignment ────────────────────────────────────────────────────────

function assignShip(shipId, role, contIdx) {
  initFleet();
  const ship = state.fleet.ships.find(s => s.id === shipId);
  if (!ship) { toast('// SHIP NOT FOUND //'); return; }

  const validRoles = ['docked', 'patrolling', 'mining'];
  if (!validRoles.includes(role)) { toast('// INVALID ROLE //'); return; }

  if (role === 'patrolling' || role === 'mining') {
    if (contIdx === undefined || contIdx === null) {
      toast('// ASSIGN CONTINENT FOR THIS ROLE //'); return;
    }
    const cont = state.planet.continents[contIdx];
    if (!cont || !cont.conquered) { toast('// CONTINENT NOT CONTROLLED //'); return; }
    ship.assignedContinent = contIdx;
  } else {
    ship.assignedContinent = null;
  }

  ship.status = role;
  toast(`// ${ship.name.toUpperCase()} STATUS: ${role.toUpperCase()} //`);
  if (typeof _refreshFleetUI === 'function') _refreshFleetUI();
}

function renameShip(shipId, newName) {
  initFleet();
  const ship = state.fleet.ships.find(s => s.id === shipId);
  if (!ship) return;
  const trimmed = newName.trim().slice(0, 24);
  if (!trimmed) return;
  ship.name = trimmed;
  if (typeof _refreshFleetUI === 'function') _refreshFleetUI();
}

// ─── UI Helpers ─────────────────────────────────────────────────────────────

function _hpBarHTML(hp, maxHp) {
  const pct = Math.max(0, Math.min(100, Math.round((hp / maxHp) * 100)));
  const col = pct > 60 ? 'var(--mil)' : pct > 30 ? 'var(--rust)' : 'var(--blood)';
  return `<div style="height:4px;background:#1a1e10;border-radius:2px;overflow:hidden;width:100%;margin-top:4px">
    <div style="height:100%;width:${pct}%;background:${col};transition:width 0.3s"></div>
  </div><div style="font-size:9px;color:var(--muted);margin-top:2px">${fmt(hp)} / ${fmt(maxHp)} HP</div>`;
}

function _statusBadge(status) {
  const cfg = {
    docked:     { col: 'var(--steel)',  label: 'DOCKED' },
    patrolling: { col: 'var(--mil)',    label: 'PATROL' },
    mining:     { col: 'var(--rust)',   label: 'MINING' },
    building:   { col: 'var(--gold)',   label: 'BUILDING' },
  };
  const c = cfg[status] || { col: 'var(--muted)', label: status.toUpperCase() };
  return `<span style="display:inline-block;background:rgba(0,0,0,0.5);border:1px solid ${c.col};
    color:${c.col};padding:1px 6px;font-size:9px;font-weight:900;letter-spacing:1px;border-radius:2px">${c.label}</span>`;
}

function _classColor(cls) {
  const map = { miner:'steel', fighter:'mil', carrier:'rust', cruiser:'blood', dreadnaught:'gold' };
  return map[cls] || 'steel';
}

// ─── Fleet Screen HTML ───────────────────────────────────────────────────────

function getFleetScreenHTML() {
  initFleet();
  const sections = [];

  sections.push(getFleetUpkeepHTML());
  sections.push(getBuildQueueHTML());
  sections.push(getFleetRosterHTML());

  return sections.join('');
}

function getFleetRosterHTML() {
  initFleet();
  const ships = state.fleet.ships;
  if (ships.length === 0) {
    return `<div class="panel steel">
      <div style="font-size:11px;font-weight:900;letter-spacing:2px;color:var(--muted);text-align:center;padding:12px 0">
        NO SHIPS IN FLEET<br><span style="font-size:10px;font-weight:400">Build ships at the Spaceport</span>
      </div>
    </div>`;
  }

  const rows = ships.map(ship => {
    const def = SHIP_DEFS[ship.class];
    const stats = _shipFinalStats(ship.class, ship.variant);
    const cls = _classColor(ship.class);
    const contOptions = state.planet.continents.map((c, i) =>
      c.conquered ? `<option value="${i}" ${ship.assignedContinent === i ? 'selected' : ''}>${c.name}</option>` : ''
    ).join('');

    const carrierInfo = (ship.class === 'carrier')
      ? `<div style="font-size:9px;color:var(--muted);margin-top:3px">
           Fighters: ${ship.carriedFighters.length}/${stats.fighterCapacity || 8}
         </div>` : '';

    const variantLabel = ship.variant
      ? `<span style="font-size:9px;color:var(--gold);display:block;margin-top:1px">${SHIP_VARIANTS[ship.variant].name}</span>` : '';

    return `<div style="display:flex;align-items:flex-start;gap:10px;padding:10px;
      background:var(--plate2);border-top:1px solid var(--edge);border-bottom:1px solid #0d0f08;
      border-left:2px solid var(--${cls});margin-bottom:4px">
      <span style="font-size:24px;flex-shrink:0;width:32px;text-align:center">${def.icon}</span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px">${ship.name}</span>
          ${_statusBadge(ship.status)}
        </div>
        ${variantLabel}
        <div style="font-size:10px;color:var(--muted);margin-top:2px">
          ATK ${ship.atk} · SPD ${ship.spd} · Upkeep: ${stats.upkeep.metal}⚙ ${stats.upkeep.food}🌾${stats.upkeep.energy > 0 ? ' ' + stats.upkeep.energy + '⚡' : ''}${stats.upkeep.credits > 0 ? ' ' + stats.upkeep.credits + '¢' : ''}
        </div>
        ${_hpBarHTML(ship.hp, ship.maxHp)}
        ${carrierInfo}
        <div style="display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap">
          <select onchange="assignShip(${ship.id}, this.value, this.options[this.selectedIndex].dataset.cont)"
            style="background:var(--plate);border:1px solid var(--edge);color:var(--text);
            font-family:inherit;font-size:10px;padding:2px 4px;cursor:pointer"
            data-ship="${ship.id}">
            <option value="docked" ${ship.status === 'docked' ? 'selected' : ''}>Docked</option>
            <optgroup label="Patrol">
              ${state.planet.continents.map((c,i) => c.conquered
                ? `<option value="patrolling" data-cont="${i}" ${ship.status==='patrolling'&&ship.assignedContinent===i?'selected':''}>${c.name} - Patrol</option>` : '').join('')}
            </optgroup>
            ${ship.class === 'miner' ? `<optgroup label="Mine">
              ${state.planet.continents.map((c,i) => c.conquered
                ? `<option value="mining" data-cont="${i}" ${ship.status==='mining'&&ship.assignedContinent===i?'selected':''}>${c.name} - Mine</option>` : '').join('')}
            </optgroup>` : ''}
          </select>
          <button onclick="scrapShip(${ship.id})" class="gal-btn blood" style="flex-shrink:0">
            <div class="gal-btn-inner" style="padding:3px 8px;font-size:9px;letter-spacing:1px">SCRAP</div>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  return `<div class="panel mil" style="margin-bottom:10px">
    <div style="font-size:11px;font-weight:900;letter-spacing:2px;color:var(--mil);margin-bottom:8px">
      ◈ FLEET ROSTER <span style="color:var(--muted);font-weight:400">(${ships.length} ship${ships.length !== 1 ? 's' : ''})</span>
    </div>
    ${rows}
  </div>`;
}

function getBuildQueueHTML() {
  initFleet();
  const queue = state.fleet.buildQueue;
  if (queue.length === 0) return '';

  const now = Date.now();
  const rows = queue.map(q => {
    const elapsed = now - q.buildStart;
    const pct = Math.min(100, Math.round((elapsed / q.buildTime) * 100));
    const remaining = Math.max(0, Math.ceil((q.buildEnd - now) / 1000));
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    const def = SHIP_DEFS[q.class];
    const cls = _classColor(q.class);
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px;
      background:var(--plate2);border-left:2px solid var(--${cls});margin-bottom:4px">
      <span style="font-size:20px;flex-shrink:0">${def.icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px">${q.name}</div>
        <div style="height:6px;background:#0d0f08;border-radius:3px;overflow:hidden;margin:4px 0">
          <div style="height:100%;width:${pct}%;background:var(--${cls});transition:width 1s;border-radius:3px"></div>
        </div>
        <div style="font-size:9px;color:var(--muted)">${pct}% — ${mins > 0 ? mins + 'm ' : ''}${secs}s remaining</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="panel rust" style="margin-bottom:10px">
    <div style="font-size:11px;font-weight:900;letter-spacing:2px;color:var(--rust);margin-bottom:8px">
      ⚙ BUILD QUEUE (${queue.length})
    </div>
    ${rows}
  </div>`;
}

function getFleetUpkeepHTML() {
  initFleet();
  const upkeep = calcFleetUpkeep();
  const income = _estimateTotalIncome();

  // Determine warning level
  const metalRatio = income.metal > 0 ? upkeep.metal / income.metal : (upkeep.metal > 0 ? 999 : 0);
  const foodRatio  = income.food  > 0 ? upkeep.food  / income.food  : (upkeep.food  > 0 ? 999 : 0);
  const maxRatio = Math.max(metalRatio, foodRatio);
  const warnCol = maxRatio >= 1.0 ? 'var(--blood)' : maxRatio >= 0.8 ? 'var(--warn)' : 'var(--mil)';
  const warnMsg = maxRatio >= 1.0 ? '⚠ CRITICAL — FLEET UPKEEP EXCEEDS INCOME' :
                  maxRatio >= 0.8 ? '⚠ WARNING — UPKEEP NEAR INCOME LIMIT' :
                  '✓ FLEET SUSTAINABLE';

  if (upkeep.metal === 0 && upkeep.food === 0 && upkeep.energy === 0) {
    return `<div class="panel steel" style="margin-bottom:10px">
      <div style="font-size:10px;color:var(--muted);text-align:center;padding:4px 0">No ships — no upkeep</div>
    </div>`;
  }

  return `<div class="panel" style="margin-bottom:10px;border-top-color:${warnCol}">
    <div style="font-size:11px;font-weight:900;letter-spacing:2px;color:${warnCol};margin-bottom:8px">
      📊 FLEET UPKEEP / TICK
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">
      ${upkeep.metal > 0 ? `<div style="font-size:11px">⚙ Metal: <span style="color:var(--rust);font-weight:900">${fmt(upkeep.metal)}</span><span style="color:var(--muted);font-size:9px"> / ${fmt(income.metal)} income</span></div>` : ''}
      ${upkeep.food > 0 ? `<div style="font-size:11px">🌾 Food: <span style="color:var(--rust);font-weight:900">${fmt(upkeep.food)}</span><span style="color:var(--muted);font-size:9px"> / ${fmt(income.food)} income</span></div>` : ''}
      ${upkeep.energy > 0 ? `<div style="font-size:11px">⚡ Energy: <span style="color:var(--rust);font-weight:900">${fmt(upkeep.energy)}</span></div>` : ''}
      ${upkeep.credits > 0 ? `<div style="font-size:11px">¢ Credits: <span style="color:var(--rust);font-weight:900">${fmt(upkeep.credits)}</span></div>` : ''}
    </div>
    <div style="font-size:10px;font-weight:900;letter-spacing:1px;color:${warnCol}">${warnMsg}</div>
  </div>`;
}

// ─── Ship Build Menu HTML ────────────────────────────────────────────────────

function getShipBuildMenuHTML() {
  const classes = Object.keys(SHIP_DEFS);
  const tabs = classes.map(cls => {
    const def = SHIP_DEFS[cls];
    const col = _classColor(cls);
    return `<button onclick="fleetSelectClass('${cls}')" id="fleet-tab-${cls}"
      style="flex:1;padding:6px 4px;font-size:9px;font-weight:900;letter-spacing:1px;
      text-transform:uppercase;font-family:inherit;cursor:pointer;border:1px solid var(--edge);
      background:var(--plate);color:var(--muted);transition:all 0.15s"
      class="fleet-class-tab">${def.icon}<br>${def.name}</button>`;
  }).join('');

  const panels = classes.map(cls => {
    const def = SHIP_DEFS[cls];
    const col = _classColor(cls);
    const check = canBuildShip(cls, null);

    // Base variant card
    const baseCost = _shipBuildCost(cls, null);
    const baseStats = _shipFinalStats(cls, null);
    const baseCard = _variantCardHTML(cls, null, def, baseCost, baseStats, col);

    // Variant cards
    const variantKeys = Object.keys(SHIP_VARIANTS).filter(k => SHIP_VARIANTS[k].parentClass === cls);
    const variantCards = variantKeys.map(vk => {
      const vd = SHIP_VARIANTS[vk];
      const cost = _shipBuildCost(cls, vk);
      const stats = _shipFinalStats(cls, vk);
      return _variantCardHTML(cls, vk, def, cost, stats, col, vd);
    }).join('');

    return `<div class="fleet-class-panel" id="fleet-panel-${cls}" style="display:none">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5">${def.role}</div>
      <div style="font-size:10px;color:var(--steel);margin-bottom:8px">
        HP ${baseStats.hp} · ATK ${baseStats.atk} · SPD ${baseStats.spd} ·
        Build time: ${_fmtTime(def.buildTime)} ·
        Upkeep: ${baseStats.upkeep.metal}⚙ ${baseStats.upkeep.food}🌾${baseStats.upkeep.energy > 0 ? ' ' + baseStats.upkeep.energy + '⚡' : ''}${baseStats.upkeep.credits > 0 ? ' ' + baseStats.upkeep.credits + '¢' : ''}
      </div>
      ${!check.ok ? `<div style="font-size:10px;color:var(--blood);font-weight:900;margin-bottom:8px;padding:6px;
        background:rgba(192,48,16,0.1);border:1px solid var(--blood)">⚠ ${check.reason}</div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        ${baseCard}${variantCards}
      </div>
    </div>`;
  }).join('');

  return `<div class="panel rust" style="margin-bottom:10px">
    <div style="font-size:11px;font-weight:900;letter-spacing:2px;color:var(--rust);margin-bottom:10px">
      ✦ BUILD NEW SHIP
    </div>
    <div style="display:flex;gap:4px;margin-bottom:10px;overflow-x:auto">
      ${tabs}
    </div>
    <div id="fleet-build-panels">
      ${panels}
    </div>
  </div>
  <scr` + `ipt>
  (function(){
    // Show first tab
    const first = '${classes[0]}';
    fleetSelectClass(first);
  })();
  </scr` + `ipt>`;
}

function _fmtTime(secs) {
  if (secs < 60) return secs + 's';
  if (secs < 3600) return Math.floor(secs / 60) + 'm ' + (secs % 60) + 's';
  return Math.floor(secs / 3600) + 'h ' + Math.floor((secs % 3600) / 60) + 'm';
}

function _variantCardHTML(cls, variantKey, def, cost, stats, col, vd) {
  const title = vd ? vd.name : def.name + ' (Standard)';
  const desc = vd ? vd.desc : 'Standard configuration.';
  const icon = vd ? vd.icon : def.icon;
  const check = canBuildShip(cls, variantKey);
  const btnCol = check.ok ? col : 'steel';
  const costStr = [
    cost.metal ? `${fmt(cost.metal)}⚙` : '',
    cost.food ? `${fmt(cost.food)}🌾` : '',
    cost.research ? `${fmt(cost.research)}⚛` : '',
    cost.credits ? `${fmt(cost.credits)}¢` : '',
  ].filter(Boolean).join(' · ');

  return `<div style="background:var(--plate2);border:1px solid var(--edge);border-top:2px solid var(--${col});padding:8px">
    <div style="font-size:14px;margin-bottom:4px">${icon}</div>
    <div style="font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;line-height:1.3">${title}</div>
    <div style="font-size:9px;color:var(--muted);margin-bottom:6px;line-height:1.4">${desc}</div>
    <div style="font-size:9px;color:var(--rust);margin-bottom:6px">${costStr}</div>
    <button class="gal-btn ${btnCol}" onclick="startShipBuild('${cls}', ${variantKey ? `'${variantKey}'` : 'null'})"
      style="width:100%" ${!check.ok ? 'title="' + check.reason + '"' : ''}>
      <div class="gal-btn-inner" style="padding:5px 8px;font-size:9px;letter-spacing:1px;width:100%;justify-content:center">
        ${check.ok ? 'BUILD' : 'LOCKED'}
      </div>
    </button>
  </div>`;
}

function fleetSelectClass(cls) {
  document.querySelectorAll('.fleet-class-tab').forEach(t => {
    t.style.background = 'var(--plate)';
    t.style.color = 'var(--muted)';
    t.style.borderColor = 'var(--edge)';
  });
  document.querySelectorAll('.fleet-class-panel').forEach(p => p.style.display = 'none');
  const tab = document.getElementById('fleet-tab-' + cls);
  const panel = document.getElementById('fleet-panel-' + cls);
  if (tab) {
    const col = { miner:'#7a8470', fighter:'#5a8a3c', carrier:'#c87428', cruiser:'#c03010', dreadnaught:'#d4a832' }[cls] || '#7a8470';
    tab.style.background = 'rgba(0,0,0,0.4)';
    tab.style.color = col;
    tab.style.borderColor = col;
  }
  if (panel) panel.style.display = 'block';
}

// ─── Ship Detail HTML ────────────────────────────────────────────────────────

function getShipDetailHTML(shipId) {
  initFleet();
  const ship = state.fleet.ships.find(s => s.id === shipId);
  if (!ship) return '<div class="panel steel">Ship not found.</div>';

  const def = SHIP_DEFS[ship.class];
  const stats = _shipFinalStats(ship.class, ship.variant);
  const col = _classColor(ship.class);
  const vd = ship.variant ? SHIP_VARIANTS[ship.variant] : null;

  const flagsHTML = Object.entries(ship.flags || {}).map(([k, v]) => {
    const labels = {
      atkVsBuildings: `ATK ×${v} vs Buildings`,
      atkVsDefenses: `ATK ×${v} vs Defenses`,
      jammingAura: `Jamming: Enemy defense -${Math.round((1-v)*100)}%`,
      orbitalBombardment: 'Orbital Bombardment',
      fleetAura: `Fleet Aura: +${Math.round((v-1)*100)}% fleet stats`,
      hasShields: 'Shield Generator',
      canStealthScout: 'Stealth Scouting',
      yieldBonus: `Resource Yield +${Math.round((v-1)*100)}%`,
    };
    return labels[k] ? `<div style="font-size:9px;color:var(--gold);margin-top:2px">★ ${labels[k]}</div>` : '';
  }).join('');

  const fighterBay = (ship.class === 'carrier') ? `
    <div style="margin-top:10px">
      <div style="font-size:10px;font-weight:900;letter-spacing:1px;color:var(--rust);margin-bottom:4px">FIGHTER BAY</div>
      <div style="font-size:10px;color:var(--muted)">
        ${ship.carriedFighters.length} / ${stats.fighterCapacity} fighters loaded
      </div>
      <div style="height:4px;background:#0d0f08;border-radius:2px;overflow:hidden;margin-top:4px">
        <div style="height:100%;width:${Math.round((ship.carriedFighters.length / (stats.fighterCapacity || 1)) * 100)}%;background:var(--mil)"></div>
      </div>
    </div>` : '';

  return `<div class="panel ${col}">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:32px">${def.icon}</span>
      <div>
        <div style="font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:2px">${ship.name}</div>
        <div style="font-size:10px;color:var(--muted)">${vd ? vd.name : def.name} · ${_statusBadge(ship.status)}</div>
      </div>
    </div>
    ${_hpBarHTML(ship.hp, ship.maxHp)}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px">
      <div style="text-align:center;background:var(--plate2);padding:6px;border:1px solid var(--edge)">
        <div style="font-size:16px;font-weight:900;color:var(--blood)">${ship.atk}</div>
        <div style="font-size:9px;color:var(--muted)">ATK</div>
      </div>
      <div style="text-align:center;background:var(--plate2);padding:6px;border:1px solid var(--edge)">
        <div style="font-size:16px;font-weight:900;color:var(--mil)">${ship.spd}</div>
        <div style="font-size:9px;color:var(--muted)">SPD</div>
      </div>
      <div style="text-align:center;background:var(--plate2);padding:6px;border:1px solid var(--edge)">
        <div style="font-size:16px;font-weight:900;color:var(--steel)">${ship.maxHp}</div>
        <div style="font-size:9px;color:var(--muted)">MAX HP</div>
      </div>
    </div>
    <div style="margin-top:8px;font-size:10px;color:var(--muted)">
      Upkeep: ${stats.upkeep.metal}⚙ · ${stats.upkeep.food}🌾${stats.upkeep.energy > 0 ? ' · ' + stats.upkeep.energy + '⚡' : ''}${stats.upkeep.credits > 0 ? ' · ' + stats.upkeep.credits + '¢' : ''}
    </div>
    ${flagsHTML}
    ${fighterBay}
    <div style="margin-top:10px">
      <label style="font-size:10px;color:var(--muted);display:block;margin-bottom:4px">RENAME SHIP</label>
      <div style="display:flex;gap:6px">
        <input id="rename-ship-${ship.id}" type="text" value="${ship.name}" maxlength="24"
          style="flex:1;background:var(--plate2);border:1px solid var(--edge);color:var(--text);
          font-family:inherit;font-size:11px;padding:5px 8px"
          onkeydown="if(event.key==='Enter')renameShip(${ship.id},this.value)">
        <button class="gal-btn steel" onclick="renameShip(${ship.id},document.getElementById('rename-ship-${ship.id}').value)">
          <div class="gal-btn-inner" style="padding:5px 10px;font-size:9px">RENAME</div>
        </button>
      </div>
    </div>
  </div>`;
}

// ─── Spaceport Detail HTML ───────────────────────────────────────────────────

function getSpaceportDetailHTML(bldg) {
  initFleet();

  // Auto-refresh build queue display via polling
  const refreshScript = `<scr` + `ipt>
  if(window._fleetUiInterval) clearInterval(window._fleetUiInterval);
  window._fleetUiInterval = setInterval(function(){
    const qEl = document.getElementById('fleet-build-queue-live');
    if(qEl) { qEl.innerHTML = getBuildQueueHTML(); }
  }, 1000);
  function _refreshFleetUI(){
    const el = document.getElementById('fleet-main-container');
    if(el) el.innerHTML = _getFleetMainContent();
  }
  function _getFleetMainContent(){
    return getFleetUpkeepHTML() + getBuildQueueHTML() + getFleetRosterHTML();
  }
  </scr` + `ipt>`;

  return `<div id="fleet-main-container" style="margin-top:8px">
    ${getFleetUpkeepHTML()}
    <div id="fleet-build-queue-live">${getBuildQueueHTML()}</div>
    ${getFleetRosterHTML()}
  </div>
  <div style="margin-top:10px">
    ${getShipBuildMenuHTML()}
  </div>
  ${refreshScript}`;
}

// ─── Scrap / Decommission ────────────────────────────────────────────────────

function scrapShip(shipId) {
  initFleet();
  const idx = state.fleet.ships.findIndex(s => s.id === shipId);
  if (idx === -1) { toast('// SHIP NOT FOUND //'); return; }
  const ship = state.fleet.ships[idx];
  // Return 25% of build cost in metal
  const cost = _shipBuildCost(ship.class, ship.variant);
  const scrapMetal = Math.round((cost.metal || 0) * 0.25);
  state.fleet.ships.splice(idx, 1);
  if (scrapMetal > 0) state.res.metal = (state.res.metal || 0) + scrapMetal;
  renderAllResBars();
  toast(`// ${ship.name.toUpperCase()} SCRAPPED — RECOVERED ${fmt(scrapMetal)} METAL //`);
  if (typeof _refreshFleetUI === 'function') _refreshFleetUI();
}
