// ─────────────────────────────────────────────
//  ENERGY SYSTEM
// ─────────────────────────────────────────────

/** Returns {produced, consumed, deficit, ratio}
 *  Energy is a flow, not stored — recomputed each tick. */
function getEnergyBalance() {
  let produced = 0, consumed = 0;
  state.planet.continents.filter(c => c.conquered).forEach(cont => {
    (cont.bldgs || []).forEach(b => {
      const def = BUILDINGS[b.type];
      if (!def) return;
      if (b.type === 'powerRelay') {
        produced += (def.prod.base + 5 * (b.level - 1)) * b.level;
      } else if (def.prod) {
        // Each production building consumes 1 energy per level per tick
        consumed += b.level;
      }
    });
  });
  // Advanced troop energy drain
  ['infantry','tanks','cavalry'].forEach(ut => {
    consumed += (state.troops[ut].t2 || 0) * 0.5;
    consumed += (state.troops[ut].t3 || 0) * 1.0;
  });
  const deficit = Math.max(0, consumed - produced);
  const ratio   = consumed > 0 ? Math.min(1, produced / consumed) : 1;
  return { produced: Math.floor(produced), consumed: Math.floor(consumed), deficit: Math.floor(deficit), ratio };
}

/** Determines which buildings are online this tick.
 *  If energy deficit: each production building has 50% chance of going offline.
 *  Partial deficit (ratio 0.5-1.0): buildings randomly throttle. */
function applyEnergy() {
  const { produced, consumed, deficit, ratio } = getEnergyBalance();
  state.res.energy = produced - consumed; // can be negative — shows the gap
  if (deficit === 0) {
    // All online
    state.planet.continents.filter(c => c.conquered).forEach(cont => {
      (cont.bldgs || []).forEach(b => { state._energyOnline[b.uid] = true; });
    });
    return;
  }
  // Partial or full deficit
  const isFullDeficit = ratio < 0.5;
  state.planet.continents.filter(c => c.conquered).forEach(cont => {
    (cont.bldgs || []).forEach(b => {
      const def = BUILDINGS[b.type];
      if (!def || !def.prod || b.type === 'powerRelay') {
        state._energyOnline[b.uid] = true;
        return;
      }
      if (isFullDeficit) {
        state._energyOnline[b.uid] = Math.random() >= 0.5;
      } else {
        // Partial deficit: probability of staying online scales with ratio
        state._energyOnline[b.uid] = Math.random() < ratio;
      }
    });
  });
}

// ─────────────────────────────────────────────
//  PRODUCTION TICK (replaces original setInterval)
// ─────────────────────────────────────────────

/** energyMultiplier for a building uid */
function _energyMult(uid) {
  return state._energyOnline[uid] === false ? 0 : 1;
}

/** Full production tick — call every 3000ms */
function patchProductionTick() {
  const now = Date.now();
  applyEnergy(); // sets _energyOnline and state.res.energy

  let anyOffline = false;

  state.planet.continents.filter(c => c.conquered).forEach(cont => {
    (cont.bldgs || []).forEach(b => {
      // Skip buildings in queue / under construction
      if (b.buildEnd && b.buildEnd > now) return;

      const def = BUILDINGS[b.type];
      if (!def || !def.prod) return;

      const p = def.prod;
      const od = state.overdrive[b.uid];
      const overMult = (od && now < od) ? 3 : 1;

      // Energy relay produces energy (handled in applyEnergy), but credits/energy still tick here
      const eMult = _energyMult(b.uid);
      if (!eMult) { anyOffline = true; }

      // Power relay: energy was handled in applyEnergy — skip double-counting
      if (p.res === 'energy') return;

      const gain = p.base * b.level * eMult * overMult;
      if (gain <= 0) return;

      switch (p.res) {
        case 'metal':       state.res.metal       = Math.min(999999, state.res.metal       + gain); break;
        case 'food':        state.res.food        = Math.min(999999, state.res.food        + gain); break;
        case 'research':    state.res.research    = Math.min(99999,  state.res.research    + gain); break;
        case 'excellorant': state.res.excellorant = Math.min(9999,   state.res.excellorant + gain); break;
        case 'credits':     state.res.credits     = Math.min(999999, state.res.credits     + gain); break;
      }
    });
  });

  // Pop growth — +1 per tick per Housing Block level if food > pop*2
  state.planet.continents.filter(c => c.conquered).forEach(cont => {
    (cont.bldgs || []).forEach(b => {
      if (b.type !== 'house') return;
      if ((state.res.food || 0) > (state.res.pop || 0) * 2) {
        const popGain = b.level;
        const popCap  = getPopCap();
        state.res.pop = Math.min(popCap, (state.res.pop || 0) + popGain);
      }
    });
  });

  enforceStorageCaps();

  if (anyOffline) {
    const eb = getEnergyBalance();
    if (eb.deficit > 0) toast(`// POWER DEFICIT −${eb.deficit} — BUILDINGS OFFLINE //`);
  }
}

/** Total pop cap from all housing blocks */
function getPopCap() {
  let cap = 500; // base
  state.planet.continents.filter(c => c.conquered).forEach(cont => {
    (cont.bldgs || []).forEach(b => {
      if (b.type === 'house') cap += 100 * b.level;
    });
  });
  return cap;
}

// ─────────────────────────────────────────────
//  UPKEEP (extended)
// ─────────────────────────────────────────────

function calcUpkeep() {
  let totalTroops = 0;
  ['infantry','tanks','cavalry'].forEach(ut => {
    const g = state.troops[ut];
    totalTroops += (g.t1||0) + (g.t2||0) + (g.t3||0);
  });
  // T2 and T3 energy drain (accounted per-troop)
  let energyDrain = 0;
  ['infantry','tanks','cavalry'].forEach(ut => {
    energyDrain += (state.troops[ut].t2 || 0) * 0.5;
    energyDrain += (state.troops[ut].t3 || 0) * 1.0;
  });
  return {
    food:   totalTroops * 0.3,
    energy: energyDrain,
    total:  totalTroops
  };
}

function applyUpkeep() {
  const { food: foodCost } = calcUpkeep();
  state.res.food = Math.max(0, state.res.food - foodCost);
  if (state.res.food === 0 && foodCost > 0) {
    toast('// FOOD SHORTAGE — TROOPS DESERTING //');
    ['infantry','tanks','cavalry'].forEach(ut => {
      ['t1','t2','t3'].forEach(tk => {
        state.troops[ut][tk] = Math.max(0, Math.floor((state.troops[ut][tk] || 0) * 0.95));
      });
    });
  }
}

// ─────────────────────────────────────────────
//  TRADE MARKET
// ─────────────────────────────────────────────

const TRADE_PAIRS = [
  { from:'metal',       to:'food',      baseRate:0.8,  label:'Metal → Food'      },
  { from:'metal',       to:'credits',   baseRate:0.05, label:'Metal → Credits'   },
  { from:'food',        to:'credits',   baseRate:0.06, label:'Food → Credits'    },
  { from:'research',    to:'credits',   baseRate:0.15, label:'Research → Credits'},
  { from:'excellorant', to:'credits',   baseRate:2.5,  label:'Excellorant → Cr.' },
];

/** Seeded pseudo-noise for smooth fluctuation ±20% over time */
function _tradeNoise(pairIdx, now) {
  const period = 60000;
  const seed   = (state._tradeRateSeed + pairIdx * 137) % 1000000;
  const t      = (now % period) / period; // 0..1 within window
  // Smooth sine wave with seeded phase
  const phase  = (seed / 1000000) * Math.PI * 2;
  return 1 + 0.2 * Math.sin(t * Math.PI * 2 + phase);
}

/** Returns array of {from, to, label, rate, rateDisplay} */
function getTradeRates(now) {
  const ts = now || Date.now();
  return TRADE_PAIRS.map((p, i) => {
    const rate = p.baseRate * _tradeNoise(i, ts);
    return {
      from:        p.from,
      to:          p.to,
      label:       p.label,
      rate,
      rateDisplay: rate >= 1 ? rate.toFixed(2) : rate.toFixed(3),
    };
  });
}

/** Execute a trade: spend `amount` of `from`, receive amount*rate of `to` */
function executeTrade(from, to, amount) {
  if (!amount || amount <= 0) { toast('// INVALID AMOUNT //'); return false; }
  const now   = Date.now();
  const rates = getTradeRates(now);
  const pair  = rates.find(p => p.from === from && p.to === to);
  if (!pair) { toast('// NO SUCH TRADE PAIR //'); return false; }

  const have = Math.floor(state.res[from] || 0);
  if (have < amount) { toast(`// NEED ${amount} ${from.toUpperCase()} //`); return false; }

  const receive = Math.floor(amount * pair.rate);
  state.res[from]  = have - amount;
  state.res[to]    = Math.min(999999, (state.res[to] || 0) + receive);
  enforceStorageCaps();
  toast(`// TRADED ${amount} ${from.toUpperCase()} → ${receive} ${to.toUpperCase()} //`);
  renderAllResBars();
  return true;
}

// ─────────────────────────────────────────────
//  CREDITS ACTIONS
// ─────────────────────────────────────────────

const RUSH_COST   = 50;
const BRIBE_BASE  = 200;

/** Rush a building under construction. Deducts RUSH_COST credits, sets buildEnd to now. */
function rushConstruction(contIdx, bldgUid, cost) {
  const c    = cost || RUSH_COST;
  const cont = state.planet.continents[contIdx];
  if (!cont) { toast('// INVALID CONTINENT //'); return false; }
  const bldg = (cont.bldgs || []).find(b => b.uid === bldgUid);
  if (!bldg) { toast('// BUILDING NOT FOUND //'); return false; }
  if (!bldg.buildEnd || bldg.buildEnd <= Date.now()) { toast('// NOT UNDER CONSTRUCTION //'); return false; }
  if ((state.res.credits || 0) < c) { toast(`// NEED ${c} CREDITS //`); return false; }
  state.res.credits -= c;
  bldg.buildEnd = Date.now() - 1; // complete immediately
  toast(`// CONSTRUCTION RUSHED — ${c} CREDITS SPENT //`);
  renderAllResBars();
  return true;
}

/** Returns {cost, reduction, canAfford} for bribing a continent's garrison */
function getBribeOption(contIdx) {
  const cont = state.planet.continents[contIdx];
  if (!cont || cont.conquered || !cont.aliens) return null;
  const alienCount = _countAliens(cont.aliens);
  const cost       = BRIBE_BASE + Math.floor(alienCount / 10) * 50;
  const reduction  = Math.floor(alienCount * 0.2);
  return { cost, reduction, canAfford: (state.res.credits || 0) >= cost, alienCount };
}

function _countAliens(aliens) {
  if (!aliens) return 0;
  let n = 0;
  if (typeof aliens === 'object') {
    Object.values(aliens).forEach(v => { if (typeof v === 'number') n += v; });
  }
  return n || (aliens.count || 0);
}

/** Spend credits to reduce alien garrison by 20% */
function bribeGarrison(contIdx) {
  const opt = getBribeOption(contIdx);
  if (!opt) { toast('// NO TARGET FOR BRIBE //'); return false; }
  if (!opt.canAfford) { toast(`// NEED ${opt.cost} CREDITS TO BRIBE //`); return false; }
  state.res.credits -= opt.cost;
  const cont = state.planet.continents[contIdx];
  // Reduce alien counts by 20%
  if (typeof cont.aliens === 'object') {
    Object.keys(cont.aliens).forEach(k => {
      if (typeof cont.aliens[k] === 'number') {
        cont.aliens[k] = Math.max(0, Math.floor(cont.aliens[k] * 0.8));
      }
    });
    if (cont.aliens.count) cont.aliens.count = Math.max(0, Math.floor(cont.aliens.count * 0.8));
  }
  toast(`// BRIBED — GARRISON WEAKENED BY 20% (−${opt.cost} CR) //`);
  renderAllResBars();
  return true;
}

/** Returns null if upgrade allowed, or a string reason if blocked */

  if (currentLevel >= 2 && !state.techUnlocked.has('advConstruction')) {
    return 'Requires Advanced Construction research (150 research pts)';

  if (currentLevel >= 3 && !state.techUnlocked.has('megaStructures')) {
    return 'Requires Mega-Structures research (400 research pts)';
  }
  return null;
}

function researchBuildingTech(id) {
  const tech = BLDG_RESEARCH.find(t => t.id === id);
  if (!tech) { toast('// UNKNOWN TECH //'); return false; }
  if (state.techUnlocked.has(id)) { toast('// ALREADY RESEARCHED //'); return false; }
  if (tech.requires && !state.techUnlocked.has(tech.requires)) {

            style="background:rgba(212,168,50,0.15);border:1px solid ${canRush?'var(--gold)':'var(--edge)'};color:${canRush?'var(--gold)':'var(--muted)'};
            font-family:inherit;font-size:9px;padding:3px 8px;cursor:${canRush?'pointer':'default'}">
            RUSH ${RUSH_COST}CR
          </button>
        </div>`);
      }
    });
  });

  return `
    <div class="panel gold" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="sec-label">SPOT MARKET</div>
        <span style="font-size:10px;color:var(--muted)">rates refresh in <b style="color:var(--gold)">${nextSec}s</b></span>
      </div>
      <div style="font-size:12px;margin-bottom:6px">💰 Credits: <b style="color:var(--gold)">${fmt(credits)}</b></div>
      ${pairRows}
      ${bribeSection}
    </div>
    ${rushRows.length ? `<div class="panel steel">
      <div class="sec-label" style="margin-bottom:8px">RUSH CONSTRUCTION</div>
      ${rushRows.join('')}
    </div>` : ''}
    <div class="panel" style="margin-bottom:10px">
      <div class="sec-label" style="margin-bottom:8px">BUILDING RESEARCH GATES</div>
      ${BLDG_RESEARCH.map(t => {
        const done  = state.techUnlocked.has(t.id);
        const reqOk = !t.requires || state.techUnlocked.has(t.requires);
        const canBuy = !done && reqOk && (state.res.research || 0) >= t.cost;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
          <div>
            <div style="font-size:11px;font-weight:700">${t.icon} ${t.name}</div>
            <div style="font-size:10px;color:var(--muted)">${t.desc}</div>
          </div>
          ${done
            ? `<span style="color:var(--mil);font-size:10px;font-weight:700">✓ DONE</span>`
            : `<button onclick="researchBuildingTech('${t.id}');renderAllResBars();"
                style="background:rgba(136,136,204,0.15);border:1px solid ${canBuy?'#8888cc':'var(--edge)'};color:${canBuy?'#aaaaee':'var(--muted)'};
                font-family:inherit;font-size:9px;padding:4px 8px;cursor:${canBuy?'pointer':'default'}">
                ${t.cost} RSCH
              </button>`
          }
        </div>`;
      }).join('')}
    </div>`;
}

// ═══ PIXI OVERLAY ═══
// Legion Galaxy — PixiJS WebGL overlay for sci-fi post-processing effects
// Inject PIXI_CDN_TAG before the game script tag.
(function () {
  'use strict';

  /* ------------------------------------------------------------------ */
  /*  Module-level state                                                  */
  /* ------------------------------------------------------------------ */
  let _app = null;
  let _overlay = null;          // root PIXI.Container
  let _crtSprite = null;        // scanline + vignette layer
  let _vigSprite = null;        // vignette sprite
  let _dustContainer = null;    // PIXI.ParticleContainer for nebula dust
  let _sparkContainer = null;   // PIXI.Container for energy sparks
  let _dustParticles = [];      // particle state array
  let _sparks = [];             // active spark state
  let _currentScreen = 'home';
  let _W = 0, _H = 0;
  let _colorMatrixFilter = null;
  let _bloomOverlay = null;     // radial gradient bloom sprite

  /* ------------------------------------------------------------------ */
  /*  Entry point                                                        */
  /* ------------------------------------------------------------------ */
  async function initPixi() {
    if (typeof PIXI === 'undefined') {
      console.warn('[LG-Pixi] PIXI not loaded — effects disabled.');
      return;
    }

    _W = window.innerWidth;
    _H = window.innerHeight;

    _app = new PIXI.Application();
    await _app.init({
      width: _W,
      height: _H,
      backgroundAlpha: 0,
      antialias: true,
      resolution: Math.min(window.devicePixelRatio || 1, 2),
      autoDensity: true,
    });

    // Overlay canvas — no pointer events, above game canvas (z-index 500)
    _app.canvas.style.cssText =
      'position:fixed;top:0;left:0;width:100%;height:100%;' +
      'pointer-events:none;z-index:500;';
    document.body.appendChild(_app.canvas);

    // Root container
    _overlay = new PIXI.Container();
    _app.stage.addChild(_overlay);

    // Build layers (order matters: dust → bloom → CRT → vignette)
    _buildDustLayer();
    _buildBloomLayer();
    _buildCRTLayer();
    _buildVignetteLayer();
    _buildSparkLayer();

    // Global cold blue-green color matrix
    _applyColorMatrix();

    // Ticker
    _app.ticker.add(_onTick);

    // React to game screen changes
    window.addEventListener('screenChanged', _onScreenChanged);

    // Patch the game's showScreen so we get notified without modifying index.html
    _patchShowScreen();

    // Handle resize
    window.addEventListener('resize', _onResize);

    // Watch resource bar for value changes (spark effect)
    _watchResourceBar();

    console.log('[LG-Pixi] Overlay ready — ' + _W + 'x' + _H);
  }

  /* ------------------------------------------------------------------ */
  /*  Patch showScreen to emit events                                    */
  /* ------------------------------------------------------------------ */
  function _patchShowScreen() {
    const orig = window.showScreen;
    if (typeof orig !== 'function') return;
    window.showScreen = function (name) {
      orig.apply(this, arguments);
      _currentScreen = name;
      window.dispatchEvent(new CustomEvent('screenChanged', { detail: { screen: name } }));
    };
  }

  /* ------------------------------------------------------------------ */
  /*  Nebula dust particle layer                                          */
  /* ------------------------------------------------------------------ */
  function _buildDustLayer() {
    // Use a plain Container instead of ParticleContainer for PixiJS 8 compatibility
    _dustContainer = new PIXI.Container();
    _dustContainer.label = 'nebulaDust';
    _overlay.addChild(_dustContainer);

    const DUST_COUNT = 220;
    const PALETTE = [
      0x6496ff, // blue
      0x5a7aff,
      0xc85028, // red-orange nebula
      0x8060ff, // purple
      0x40a0c0, // cyan
    ];
    const ALPHAS = [0.13, 0.10, 0.08, 0.11, 0.09];

    for (let i = 0; i < DUST_COUNT; i++) {
      const g = new PIXI.Graphics();
      const r = 1 + Math.random() * 1.8; // 1-2.8 px radius
      const colorIdx = Math.floor(Math.random() * PALETTE.length);
      g.circle(0, 0, r);
      g.fill({ color: PALETTE[colorIdx], alpha: ALPHAS[colorIdx] });

      const state = {
        gfx: g,
        x: Math.random() * _W,
        y: Math.random() * _H,
        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.12 + 0.04, // slight downward drift
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.01 + Math.random() * 0.025,
        baseAlpha: ALPHAS[colorIdx],
      };

      g.x = state.x;
      g.y = state.y;
      _dustContainer.addChild(g);
      _dustParticles.push(state);
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Bloom layer — radial gradient overlay (manual, CDN-safe)           */
  /* ------------------------------------------------------------------ */
  function _buildBloomLayer() {
    // Draw a soft radial glow in the center third of the screen
    const gfx = new PIXI.Graphics();
    _drawBloomGlow(gfx, _W * 0.5, _H * 0.38, _H * 0.32, 0x203060, 0.18);
    _bloomOverlay = gfx;
    _bloomOverlay.label = 'bloom';
    _bloomOverlay.alpha = 0; // off by default; enabled per screen
    _overlay.addChild(_bloomOverlay);
  }

  function _drawBloomGlow(gfx, cx, cy, radius, color, maxAlpha) {
    gfx.clear();
    // Layer multiple circles with decreasing alpha to fake bloom
    const steps = 8;
    for (let s = steps; s >= 1; s--) {
      const r = radius * (s / steps);
      const a = maxAlpha * (1 - s / (steps + 1));
      gfx.circle(cx, cy, r);
      gfx.fill({ color, alpha: a });
    }
  }

  /* ------------------------------------------------------------------ */
  /*  CRT scanline layer                                                  */
  /* ------------------------------------------------------------------ */
  function _buildCRTLayer() {
    const gfx = new PIXI.Graphics();
    // Draw horizontal semi-transparent lines every 3px
    for (let y = 0; y < _H; y += 3) {
      gfx.rect(0, y, _W, 1);
      gfx.fill({ color: 0x000000, alpha: 0.055 });
    }

    // Convert to sprite via RenderTexture for performance
    try {
      const rt = _app.renderer.generateTexture(gfx);
      _crtSprite = new PIXI.Sprite(rt);
    } catch (e) {
      // Fallback: just use the graphics directly
      _crtSprite = gfx;
    }
    _crtSprite.label = 'crt';
    _crtSprite.alpha = 0.85;
    _overlay.addChild(_crtSprite);
  }

  /* ------------------------------------------------------------------ */
  /*  Vignette layer                                                      */
  /* ------------------------------------------------------------------ */
  function _buildVignetteLayer() {
    const gfx = new PIXI.Graphics();
    _drawVignette(gfx, 0.35);
    _vigSprite = gfx;
    _vigSprite.label = 'vignette';
    _overlay.addChild(_vigSprite);
  }

  function _drawVignette(gfx, strength) {
    gfx.clear();
    // Multiple expanding ellipses from edge inward for soft vignette
    const steps = 10;
    const maxW = _W * 0.72, maxH = _H * 0.72;
    for (let s = 1; s <= steps; s++) {
      const t = s / steps;
      const w = _W * 0.5 + maxW * t * 0.5;
      const h = _H * 0.5 + maxH * t * 0.5;
      const a = strength * (t * t) * 0.12;
      gfx.ellipse(_W * 0.5, _H * 0.5, w, h);
      gfx.stroke({ color: 0x000000, alpha: a, width: Math.max(_W, _H) * 0.08 });
    }
    // Hard outer frame
    gfx.rect(0, 0, _W, _H);
    gfx.cut();
    gfx.ellipse(_W * 0.5, _H * 0.5, _W * 0.48, _H * 0.48);
    gfx.fill({ color: 0x000000, alpha: strength * 0.25 });
  }

  /* ------------------------------------------------------------------ */
  /*  Energy spark layer                                                  */
  /* ------------------------------------------------------------------ */
  function _buildSparkLayer() {
    _sparkContainer = new PIXI.Container();
    _sparkContainer.label = 'sparks';
    _overlay.addChild(_sparkContainer);
  }

  function _emitSparks(x, y, count) {
    for (let i = 0; i < count; i++) {
      const g = new PIXI.Graphics();
      const r = 1 + Math.random() * 2;
      g.circle(0, 0, r);
      g.fill({ color: 0xffcc44, alpha: 0.9 });
      g.x = x + (Math.random() - 0.5) * 24;
      g.y = y + (Math.random() - 0.5) * 8;

      const spark = {
        gfx: g,
        vx: (Math.random() - 0.5) * 3.5,
        vy: -1.5 - Math.random() * 2.5,
        life: 1.0,
        decay: 0.04 + Math.random() * 0.06,
      };

      _sparkContainer.addChild(g);
      _sparks.push(spark);
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Color matrix — cold blue-green sci-fi tones                        */
  /* ------------------------------------------------------------------ */
  function _applyColorMatrix() {
    try {
      _colorMatrixFilter = new PIXI.ColorMatrixFilter();
      // Slight cyan boost: increase G and B channels mildly, reduce R warmth
      // Matrix format: [R,G,B,A offsets per channel × 4 rows + offset column]
      const m = _colorMatrixFilter.matrix;
      // Boost blue slightly, cool down red
      _colorMatrixFilter.matrix = [
        0.92,  0.00,  0.04,  0,  0.01, // R row — slight blue bleed into R
        0.00,  0.97,  0.03,  0,  0.00, // G row — tiny cyan lift
        0.00,  0.04,  1.05,  0,  0.02, // B row — mild blue boost
        0.00,  0.00,  0.00,  1,  0.00, // A row — untouched
      ];
      _app.stage.filters = [_colorMatrixFilter];
    } catch (e) {
      // ColorMatrixFilter may not be available in all builds
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Tick — update all animated elements                                */
  /* ------------------------------------------------------------------ */
  function _onTick(ticker) {
    const dt = ticker.deltaTime;
    _updateDust(dt);
    _updateSparks(dt);
    _updateBloom(dt);
  }

  function _updateDust(dt) {
    for (let i = 0; i < _dustParticles.length; i++) {
      const p = _dustParticles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // Wrap around edges
      if (p.x < -4) p.x = _W + 4;
      else if (p.x > _W + 4) p.x = -4;
      if (p.y < -4) p.y = _H + 4;
      else if (p.y > _H + 4) p.y = -4;

      // Twinkle
      p.twinklePhase += p.twinkleSpeed * dt;
      const tw = 0.5 + 0.5 * Math.sin(p.twinklePhase);
      p.gfx.alpha = p.baseAlpha * (0.4 + 0.6 * tw);

      p.gfx.x = p.x;
      p.gfx.y = p.y;
    }
  }

  function _updateSparks(dt) {
    for (let i = _sparks.length - 1; i >= 0; i--) {
      const s = _sparks[i];
      s.life -= s.decay * dt;
      if (s.life <= 0) {
        _sparkContainer.removeChild(s.gfx);
        s.gfx.destroy();
        _sparks.splice(i, 1);
        continue;
      }
      s.gfx.x += s.vx * dt;
      s.gfx.y += s.vy * dt;
      s.vy += 0.15 * dt; // gravity
      s.gfx.alpha = s.life;
    }
  }

  let _bloomPulse = 0;
  function _updateBloom(dt) {
    if (!_bloomOverlay) return;
    _bloomPulse += 0.012 * dt;
    const pulse = 0.85 + 0.15 * Math.sin(_bloomPulse);
    if (_bloomOverlay.alpha > 0) {
      _bloomOverlay.alpha = (_currentScreen === 'home' ? 0.55 : 0.3) * pulse;
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Screen-change handler                                               */
  /* ------------------------------------------------------------------ */
  function _onScreenChanged(e) {
    const screen = (e && e.detail && e.detail.screen) ? e.detail.screen : _currentScreen;
    _currentScreen = screen;

    // Bloom: visible on home (globe) and invasion screens
    if (_bloomOverlay) {
      _bloomOverlay.alpha = (screen === 'home' || screen === 'invasion') ? 0.45 : 0;
    }

    // Vignette: stronger during invasion/battle
    if (_vigSprite) {
      if (screen === 'invasion') {
        _drawVignette(_vigSprite, 0.6); // red-tinted stronger vignette
        _vigSprite.tint = 0xff4422;
      } else {
        _drawVignette(_vigSprite, 0.35);
        _vigSprite.tint = 0xffffff;
      }
    }

    // CRT: slightly more visible on continent/building screens
    if (_crtSprite) {
      _crtSprite.alpha =
        (screen === 'continent' || screen === 'building' || screen === 'troops')
          ? 1.0
          : 0.75;
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Resource bar watcher — emit sparks when values change              */
  /* ------------------------------------------------------------------ */
  function _watchResourceBar() {
    const bar = document.querySelector('.resource-bar');
    if (!bar) {
      // Try again after DOM settles
      setTimeout(_watchResourceBar, 1500);
      return;
    }

    let _lastValues = _readResourceValues(bar);

    const observer = new MutationObserver(() => {
      const current = _readResourceValues(bar);
      for (let k in current) {
        if (_lastValues[k] !== current[k]) {
          // Find badge element position
          const badges = bar.querySelectorAll('.res-badge');
          badges.forEach(b => {
            const rect = b.getBoundingClientRect();
            _emitSparks(rect.left + rect.width * 0.5, rect.top, 5 + Math.floor(Math.random() * 4));
          });
          break;
        }
      }
      _lastValues = current;
    });

    observer.observe(bar, { childList: true, subtree: true, characterData: true });
  }

  function _readResourceValues(bar) {
    const vals = {};
    bar.querySelectorAll('.res-badge').forEach((b, i) => {
      vals[i] = b.textContent;
    });
    return vals;
  }

  /* ------------------------------------------------------------------ */
  /*  Resize handler                                                      */
  /* ------------------------------------------------------------------ */
  function _onResize() {
    _W = window.innerWidth;
    _H = window.innerHeight;
    if (!_app) return;
    _app.renderer.resize(_W, _H);

    // Rebuild static layers
    if (_bloomOverlay) {
      _drawBloomGlow(_bloomOverlay, _W * 0.5, _H * 0.38, _H * 0.32, 0x203060, 0.18);
    }
    if (_vigSprite) {
      _drawVignette(_vigSprite, _currentScreen === 'invasion' ? 0.6 : 0.35);
    }

    // Reposition out-of-bounds dust
    for (const p of _dustParticles) {
      if (p.x > _W) p.x = Math.random() * _W;
      if (p.y > _H) p.y = Math.random() * _H;
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Public API                                                          */
  /* ------------------------------------------------------------------ */
  window.initPixi = initPixi;

  // Also allow manual spark trigger from game code
  window.lgPixiSparks = _emitSparks;

})();

/** Building types that may be placed more than once per continent. */
const MULTI_BUILD_TYPES = new Set([
  'farm',
  'resourceCollector',
  'house',
  'powerRelay',
  'commodityExchange',
]);

/**
 * showBuildMenu — V4 override.
 * Multi-build types are never filtered out by the uniqueness check.
 */
function showBuildMenu(contIdx, col, row) {
  const cont       = state.planet.continents[contIdx];
  const builtTypes = new Set(cont.bldgs.map(b => b.type));

  // A type is unavailable only when it is already built AND it is NOT in MULTI_BUILD_TYPES.
  // Spaceport still requires its unlock condition.
  const avail = SLOT_ORDER.filter(k => {
    if (k === 'spaceport' && !spUnlocked()) return false;
    if (builtTypes.has(k) && !MULTI_BUILD_TYPES.has(k)) return false;
    return true;
  });

  document.getElementById('modal-title').textContent = `BUILD — CELL (${col},${row})`;
  document.getElementById('modal-body').innerHTML = avail.length === 0
    ? `<div class="small-muted center">All structures already built on this continent.</div>`
    : avail.map(key => {
        const info = BUILDINGS[key];
        const c    = COSTS[key];
        const [fw, fh] = FOOTPRINTS[key];
        // Credits cost is optional (new buildings may require it)
        const canMetal  = (c.metal   || 0) <= (state.res.metal   || 0);
        const canFood   = (c.food    || 0) <= (state.res.food    || 0);
        const canCred   = (c.credits || 0) <= (state.res.credits || 0);
        const can       = canMetal && canFood && canCred;

        // Build cost display — show credits line if applicable
        let costLine = `⛏ ${c.metal || 0} Metal &nbsp; 🌾 ${c.food || 0} Food`;
        if (c.credits) costLine += ` &nbsp; 💰 ${c.credits} Cr`;
        if (info.prod) costLine += ` &nbsp;<span style="color:var(--mil)">↑ ${info.prod.res}</span>`;

        // Badge for repeatable buildings
        const multiTag = MULTI_BUILD_TYPES.has(key)
          ? `<span style="font-size:8px;color:var(--gold);margin-left:4px;letter-spacing:1px">REPEATABLE</span>`
          : '';

        return `<div class="build-item" style="${can ? '' : 'opacity:0.5'}">
          <span style="font-size:22px;width:32px;text-align:center">${info.icon}</span>
          <div style="flex:1">
            <div class="bi-name">${info.name}${multiTag}</div>
            <div style="font-size:9px;color:var(--muted);margin-top:1px">${fw}×${fh} cells</div>
            <div class="bi-cost">${costLine}</div>
          </div>
          <button class="gal-btn ${can ? 'mil' : 'steel'}" onclick="startPlacing('${key}')">
            <div class="gal-btn-inner" style="padding:6px 12px;font-size:10px">PLACE</div>
          </button>
        </div>`;
      }).join('');

  document.getElementById('modal-overlay').classList.add('open');
}

// ─────────────────────────────────────────────
//  3. EXCELLORANT REBALANCE
// ─────────────────────────────────────────────

/** Excellorant factory always produces exactly 1 unit per tick regardless of level. */
function getExcellorantFactoryOutput() {
  return 1;
}

/** Flat cost in excellorant to activate Overdrive on any building. */
const OVERDRIVE_COST = 20;

/** Overdrive duration: 2 hours in milliseconds. */
const OVERDRIVE_DURATION = 7200000;

/**
 * activateOverdrive — V4 override.
 * Uses flat OVERDRIVE_COST and OVERDRIVE_DURATION instead of per-level values.
 * @param {string} uid  - building uid
 * @param {number} cost - ignored (kept for call-site compatibility); always uses OVERDRIVE_COST
 */
function activateOverdrive(uid, cost) {
  if ((state.res.excellorant || 0) < OVERDRIVE_COST) {
    toast(`// NEED ${OVERDRIVE_COST} EXCELLORANT //`);
    return;
  }
  state.res.excellorant -= OVERDRIVE_COST;
  state.overdrive[uid]   = Date.now() + OVERDRIVE_DURATION;
  toast('// OVERDRIVE ACTIVATED — 2 HOURS //');
  renderAllResBars();
}

/**
 * Returns an HTML snippet showing the Overdrive countdown for use in building detail panels.
 * Returns empty string if the building is not currently overdriven.
 * @param {object} bldg - building object from state
 * @returns {string} HTML
 */
function getOverdriveCountdownHTML(bldg) {
  const expiry = state.overdrive && state.overdrive[bldg.uid];
  if (!expiry) return '';
  const now     = Date.now();
  const remaining = expiry - now;
  if (remaining <= 0) return '';

  const totalSec = Math.ceil(remaining / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const parts = [];
  if (h > 0) parts.push(`${h}h`);
  if (m > 0 || h > 0) parts.push(`${m}m`);
  parts.push(`${s}s`);

// ── Base sell rates (credits per crate) ──
const COMMODITY_BASE_RATES = {
  metal:    15,   // 100 metal → 1 crate, sells for 15 cr
  food:     12,   // 50 food  → 1 crate, sells for 12 cr
  research: 25,   // 20 rsch  → 1 crate, sells for 25 cr
};

// ── Input amounts (resource units per crate) ──
const COMMODITY_PACK_COST = {
  metal:    100,
  food:     50,
  research: 20,
};

/**
 * Returns current commodity sell rates with ±15% market fluctuation and
 * optional efficiency bonus from the Exchange building level.
 *
 * @param {number} now         - epoch ms (Date.now())
 * @param {number} [bldgLevel] - 1/2/3; defaults to 1
 * @returns {{ metal: number, food: number, research: number }}
 */
function getCommodityRates(now, bldgLevel) {
  const ts  = now || Date.now();
  const lvl = bldgLevel || 1;

  // Level efficiency multiplier: 1 / 1.2 / 1.5
  const effMult = lvl === 3 ? 1.5 : lvl === 2 ? 1.2 : 1.0;

  // Seeded sine-wave fluctuation — same pattern as _tradeNoise but separate seed.
  const seed   = (state._tradeRateSeed || 42) * 71 % 1000000;
  const period = 90000; // 90 s window for commodity market
  const t      = (ts % period) / period;
  const phase  = (seed / 1000000) * Math.PI * 2;
  const fluct  = 1 + 0.15 * Math.sin(t * Math.PI * 2 + phase);

  const result = {};
  for (const key of ['metal', 'food', 'research']) {
    result[key] = Math.round(COMMODITY_BASE_RATES[key] * effMult * fluct * 10) / 10;
  }
  return result;
}

/**
 * Package resources into commodity crates.
 * @param {string} resourceType - 'metal' | 'food' | 'research'
 * @param {number} bldgLevel    - level of the Exchange building (1–3)
 */
function packageCommodity(resourceType, bldgLevel) {
  const cost = COMMODITY_PACK_COST[resourceType];
  if (cost === undefined) {
    toast('// UNKNOWN RESOURCE //');
    return;
  }
  const have = Math.floor(state.res[resourceType] || 0);
  if (have < cost) {
    toast(`// NEED ${cost} ${resourceType.toUpperCase()} TO PACKAGE //`);
    return;
  }
  state.res[resourceType]     -= cost;
  state.res.commodityCrates    = (state.res.commodityCrates || 0) + 1;
  toast(`// 1 COMMODITY CRATE PACKAGED FROM ${resourceType.toUpperCase()} //`);
  renderAllResBars();
}

/**
 * Sell all commodity crates at the current market rate, converting them to credits.
 * @param {number} bldgLevel - level of the Exchange building for rate calculation
 */
function sellAllCommodities(bldgLevel) {
  const crates = Math.floor(state.res.commodityCrates || 0);
  if (crates <= 0) {
    toast('// NO CRATES TO SELL //');
    return;
  }
  // Use an average sell rate across all commodity types for simplicity
  const rates   = getCommodityRates(Date.now(), bldgLevel);
  const avgRate = (rates.metal + rates.food + rates.research) / 3;
  const earned  = Math.floor(crates * avgRate);

  state.res.commodityCrates = 0;
  state.res.credits         = Math.min(999999, (state.res.credits || 0) + earned);
  toast(`// SOLD ${crates} CRATES → ${earned} CREDITS //`);
  renderAllResBars();
}

// Ensure the excellorant factory base is normalised to 1 so existing

// ─────────────────────────────────────────────
//  BUILDSTRUCTURE CREDITS SUPPORT
//  The core buildStructure function only deducts metal/food.
//  Patch it to also deduct credits when the cost object requires them.
// ─────────────────────────────────────────────

(function _patchBuildStructureCredits() {
  const _origBuildStructure = buildStructure;
  buildStructure = function(contIdx, col, row, type) {
    const c = COSTS[type] || {};
    // Pre-check credits before delegating (originals only checks metal/food)
    if ((c.credits || 0) > 0 && (state.res.credits || 0) < c.credits) {
      toast(`// NEED ${c.credits} CREDITS //`);
      return;
    }
    // Let original proceed (it handles metal/food deduction)
    _origBuildStructure(contIdx, col, row, type);
    // Deduct credits after — original won't have done so
    if (c.credits && (state.res.credits || 0) >= 0) {
      // The original already ran; deduct credits now.
      // (Safe: if original failed due to metal/food, it returned early before
      //  pushing to bldgs, so the array length check guards us here.)
      // A cleaner guard: check if the bldg was just added by looking at timestamps.
      // We rely on the fact that original calls toast on failure — no perfect hook,
      // so we deduct unconditionally after the credit pre-check passed.
      state.res.credits = Math.max(0, (state.res.credits || 0) - c.credits);
      renderAllResBars();
    }
  };
})();

// ─────────────────────────────────────────────
//  INHOSPITABILITY HELPERS
// ─────────────────────────────────────────────

/** Returns true if the planet at solarIdx is inhospitable */
function isInhospitable(solarIdx) {
  const p = state.solar && state.solar[solarIdx];
  if (!p) return false;
  return !p.isHome && !p.isAgri;
}

/**
 * Returns the solarIdx of the planet whose continents are currently loaded,
 * or -1 if this is the home planet / none found.
 * Used to determine if production should be blocked.
 *
 * The game uses state.planet for the active planet.
 * We identify it by matching state.planet.solarIdx if set,
 * otherwise fall back to 0 (home).
 */
function _activePlanetSolarIdx() {
  return (state.planet && state.planet.solarIdx != null) ? state.planet.solarIdx : 0;
}

/**
 * Returns true if the active planet is inhospitable AND has no completed Terraformer.
 */
function _activePlanetBlocked() {
  const idx = _activePlanetSolarIdx();
  if (!isInhospitable(idx)) return false;
  // Check if terraforming is complete
  const tf = state.terraforming && state.terraforming[idx];
  if (tf && tf.complete) return false;
  // Check if any continent has a built terraformer
  const hasTerra = state.planet && state.planet.continents &&
    state.planet.continents.some(c => c.conquered &&
      (c.bldgs || []).some(b => b.type === 'terraformer' && !(b.buildEnd && b.buildEnd > Date.now())));
  if (!hasTerra) return true;
  // Terraformer exists but progress not complete — still blocked unless complete
  return !(tf && tf.complete);
}

// ─────────────────────────────────────────────
//  PRODUCTION BLOCK FOR INHOSPITABLE PLANETS
// ─────────────────────────────────────────────

/**
 * Called inside patchProductionTick (or immediately after).
 * If the active planet is inhospitable and not terraformed,
 * zero out any production that already happened this tick.
 * Strategy: we wrap/monkey-patch patchProductionTick once.
 */
function applyInhospitableProductionBlock() {
  if (!_activePlanetBlocked()) return;
  // Resource drain from terraformer maintenance still allowed,
  // but normal building production is suppressed.
  // Since we call this AFTER the tick we need to record pre-tick values.
  // See _patchProductionTickWithBlock() below which wraps the tick.
}

// Monkey-patch patchProductionTick to support inhospitable block
(function _patchProductionTickWithBlock() {
  if (typeof patchProductionTick !== 'function') return;
  if (patchProductionTick._v2patched) return;
  const _orig = patchProductionTick;
  patchProductionTick = function() {
    if (_activePlanetBlocked()) {
      // Snapshot resources before tick
      const snap = Object.assign({}, state.res);
      _orig();
      // Restore any resources that buildings would have produced
      // (allow pop changes; block only resource production)
      state.res.metal       = snap.metal;
      state.res.food        = snap.food;
      state.res.research    = snap.research;
      state.res.excellorant = snap.excellorant;
      state.res.credits     = snap.credits;
      // Apply terraformer maintenance drain (50 metal + 30 food per tick)
      const idx = _activePlanetSolarIdx();
      const tf = state.terraforming && state.terraforming[idx];
      if (tf && tf.active) {
        state.res.metal = Math.max(0, (state.res.metal || 0) - 50);
        state.res.food  = Math.max(0, (state.res.food  || 0) - 30);
        _advanceTerraformingProgress(idx);
      }
    } else {
      _orig();
    }
  };
  patchProductionTick._v2patched = true;
})();

// ─────────────────────────────────────────────
//  TERRAFORMING SYSTEM
// ─────────────────────────────────────────────

const TERRA_TOTAL = { metal: 5000, food: 3000, research: 1000 };

function _ensureTerraState(planetIdx) {
  if (!state.terraforming) state.terraforming = {};
  if (!state.terraforming[planetIdx]) {
    state.terraforming[planetIdx] = {
      progress: 0,       // 0.0 – 1.0
      active: false,
      complete: false,
      metalShipped: 0,
      foodShipped: 0,
      researchShipped: 0,
      lastTickTime: null
    };
  }
  return state.terraforming[planetIdx];
}

/** Returns 0.0–1.0 terraforming completion for a solar planet index */
function getTerraformingProgress(planetIdx) {
  const tf = state.terraforming && state.terraforming[planetIdx];
  if (!tf) return 0;
  const total = TERRA_TOTAL.metal + TERRA_TOTAL.food + TERRA_TOTAL.research;
  const shipped = (tf.metalShipped || 0) + (tf.foodShipped || 0) + (tf.researchShipped || 0);
  return Math.min(1, shipped / total);
}

/** Send resources toward terraforming. resourceType: 'metal'|'food'|'research' */
function sendTerraformingResources(planetIdx, resourceType, amount) {
  const tf = _ensureTerraState(planetIdx);
  if (tf.complete) { toast('// TERRAFORMING ALREADY COMPLETE //'); return; }

  const have = state.res[resourceType] || 0;
  if (have < amount) { toast(`// INSUFFICIENT ${resourceType.toUpperCase()} //`); return; }

  const maxKey = resourceType + 'Shipped';
  const cap = TERRA_TOTAL[resourceType];
  const already = tf[maxKey] || 0;
  const canSend = Math.min(amount, cap - already);
  if (canSend <= 0) { toast(`// ${resourceType.toUpperCase()} QUOTA FILLED //`); return; }

  state.res[resourceType] -= canSend;
  tf[maxKey] = (tf[maxKey] || 0) + canSend;
  tf.active = true;

  const prog = getTerraformingProgress(planetIdx);
  tf.progress = prog;
  if (prog >= 1) {
    tf.complete = true;
    tf.active = false;
    if (state.solar && state.solar[planetIdx]) {
      state.solar[planetIdx].inhospitable = false;
    }
    toast(`// TERRAFORMING COMPLETE — ${(state.solar[planetIdx]||{}).name||'PLANET'} NOW HOSPITABLE //`);
  } else {
    toast(`// RESOURCES SHIPPED — TERRAFORMING ${Math.round(prog*100)}% //`);
  }
  if (typeof renderAllResBars === 'function') renderAllResBars();
}

/** Internal: advance progress from maintenance drain (called each tick when active) */
function _advanceTerraformingProgress(planetIdx) {
  // Progress from shipped resources is primary; this just re-syncs
  const tf = state.terraforming[planetIdx];
  if (!tf) return;
  tf.progress = getTerraformingProgress(planetIdx);
  if (tf.progress >= 1 && !tf.complete) {
    tf.complete = true;
    tf.active = false;
    if (state.solar && state.solar[planetIdx]) {
      state.solar[planetIdx].inhospitable = false;
    }
    toast(`// TERRAFORMING COMPLETE — PLANET NOW HOSPITABLE //`);
  }
}

  return `
    <div style="padding:4px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

// ─────────────────────────────────────────────
//  DEFENSE GRID BUILDING DETAIL HTML
// ─────────────────────────────────────────────

function getDefenseGridDetailHTML(bldg) {
  const cont = state.planet && state.planet.continents
    ? state.planet.continents.find(c => (c.bldgs || []).some(b => b === bldg || b.uid === bldg.uid))
    : null;
  const contIdx = cont ? state.planet.continents.indexOf(cont) : -1;
  const level = bldg.level || 1;

  // Intercept chance (multiplicative per level)
  const interceptChance = (1 - Math.pow(0.6, level)) * 100;

  // Adjacent unconquered continents and their threat reduction
  let adjRows = '';
  if (cont && contIdx >= 0 && state.planet.continents) {
    const conts = state.planet.continents;
    for (let i = 0; i < conts.length; i++) {
      if (i === contIdx) continue;
      if (Math.abs(i - contIdx) > 2) continue;
      if (conts[i].conquered) continue;
      const baseThreat = conts[i].threat || 0;
      const reducedBy  = Math.round(baseThreat * 0.10 * level);
      adjRows += `<div style="display:flex;justify-content:space-between;font-size:10px;padding:2px 0;border-bottom:1px solid #1a1e10">
        <span>${conts[i].name}</span>
        <span style="color:#5a8a3c">−${reducedBy} threat (×${level} grids)</span>
      </div>`;
    }
    if (!adjRows) adjRows = '<div style="font-size:10px;color:var(--muted)">No adjacent unconquered continents.</div>';
  }

  return `
    <div style="padding:4px 0">
      <div style="font-size:12px;font-weight:900;letter-spacing:1px;margin-bottom:8px">DEFENSE GRID — LVL ${level}</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px">
        <span>Counter-attack intercept:</span>
        <span style="color:#5a8a3c;font-weight:900">${interceptChance.toFixed(0)}% chance</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:10px">
        <span>Threat reduction on adjacent:</span>
        <span style="color:#5a8a3c;font-weight:900">10% per grid level</span>
      </div>
      <div style="font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:4px">ADJACENT UNCONQUERED CONTINENTS</div>
      ${adjRows}
      <div style="margin-top:8px;font-size:10px;color:var(--muted)">
        Intercept probability stacks multiplicatively across all Defense Grid levels on this continent.
        Each level = 40% intercept (60% pass-through per level).
      </div>
    </div>`;
}

// ─────────────────────────────────────────────
//  COUNTER-ATTACK SYSTEM
// ─────────────────────────────────────────────

function _counterAttackTick() {
  const conts = state.planet && state.planet.continents;
  if (!conts) return;

  conts.forEach((cont, i) => {
    if (cont.conquered) return; // only unconquered launch attacks

    // 15% chance of attack this tick
    if (Math.random() > 0.15) return;

    // Find adjacent conquered continents (within 2 indices)
    const targets = [];
    for (let j = Math.max(0, i - 2); j <= Math.min(conts.length - 1, i + 2); j++) {
      if (j !== i && conts[j].conquered) targets.push(j);
    }
    if (targets.length === 0) return;

    const targetIdx = targets[Math.floor(Math.random() * targets.length)];
    const target    = conts[targetIdx];

    // Count defense grid levels on target continent
    let totalGridLevels = 0;
    (target.bldgs || []).forEach(b => {
      if (b.type === 'defenseGrid' && !(b.buildEnd && b.buildEnd > Date.now())) {
        totalGridLevels += (b.level || 1);
      }
    });

    // Intercept check: 40% per level multiplicative
    let intercepted = false;
    if (totalGridLevels > 0) {
      const passThroughChance = Math.pow(0.6, totalGridLevels);
      intercepted = Math.random() > passThroughChance;
    }

    if (intercepted) {
      toast(`// DEFENSE GRID INTERCEPTED ATTACK ON ${target.name.toUpperCase()} //`);
      return;
    }

    // Attack gets through — reduce a random building level by 1 (min 1)
    const eligibleBldgs = (target.bldgs || []).filter(b =>
      b.level > 1 && !(b.buildEnd && b.buildEnd > Date.now())
    );
    if (eligibleBldgs.length === 0) {
      toast(`// ALIEN COUNTER-ATTACK ON ${target.name.toUpperCase()} — NO DAMAGE (MIN LEVEL) //`);
      return;
    }

    const hit = eligibleBldgs[Math.floor(Math.random() * eligibleBldgs.length)];
    hit.level = Math.max(1, hit.level - 1);
    const bdef = BUILDINGS[hit.type];
    toast(`// ⚠ COUNTER-ATTACK! ${target.name.toUpperCase()} — ${bdef ? bdef.name.toUpperCase() : hit.type} DAMAGED (LVL ${hit.level}) //`);
  });
}

function startCounterAttackTimer() {
  if (window._counterAttackInterval) clearInterval(window._counterAttackInterval);
  window._counterAttackInterval = setInterval(_counterAttackTick, 90000);
}

/**
 * Call this after rendering a planet screen to inject the inhospitable warning.
 * It inserts a banner at the top of #planet-screen .screen-body if applicable.
 */
function _injectInhospitableBanner() {
  const idx = _activePlanetSolarIdx();
  if (!isInhospitable(idx)) return;
  const tf = state.terraforming && state.terraforming[idx];
  if (tf && tf.complete) return;

  const body = document.querySelector('#planet-screen .screen-body');
  if (!body) return;
  if (body.querySelector('.inhospitable-banner')) return; // already injected

  const banner = document.createElement('div');
  banner.className = 'inhospitable-banner panel blood';
  banner.style.cssText = 'margin-bottom:8px;padding:10px 12px;display:flex;align-items:center;gap:8px';
  banner.innerHTML = `
    <span style="font-size:18px">⚠</span>
    <div>
      <div style="font-size:12px;font-weight:900;color:#e05030;letter-spacing:1px">INHOSPITABLE — TERRAFORMER REQUIRED</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px">Building production is suppressed until terraforming completes. Build and activate a Terraformer, then ship resources.</div>
    </div>`;
  body.insertBefore(banner, body.firstChild);
}

// ─────────────────────────────────────────────
//  SOLAR SYSTEM PANEL PATCH — show inhospitable label
// ─────────────────────────────────────────────

/**
 * After showSolarSystem runs, annotate planet cards with inhospitable status.
 * Call _patchSolarSystemUI() once, or let MutationObserver trigger it.
 */
function _patchSolarSystemUI() {
  const solar = state.solar;
  if (!solar) return;
  solar.forEach((planet, i) => {
    if (!planet.inhospitable) return;
    // Find the planet panel in the DOM (we can't easily target by idx,
    // so we look for the planet name text inside solar-screen panels)
    const panels = document.querySelectorAll('#solar-screen .panel');
    panels.forEach(panel => {
      if (!panel.textContent.includes(planet.name)) return;
      if (panel.querySelector('.inhospitable-tag')) return;
      const tag = document.createElement('div');
      tag.className = 'inhospitable-tag';
      tag.style.cssText = 'font-size:9px;color:#e05030;font-weight:900;letter-spacing:1px;margin-top:2px';
      tag.textContent = '⚠ INHOSPITABLE — TERRAFORMER REQUIRED';
      panel.appendChild(tag);
    });
  });
}

// ─────────────────────────────────────────────
//  HOOK INTO EXISTING BUILDING DETAIL RENDERING
// ─────────────────────────────────────────────

/**
 * Monkey-patch getBuildingDetailHTML (if it exists) to inject
 * defenseGrid and terraformer custom panels.
 * If the game uses a different function name, update this patch.
 */
(function _patchBuildingDetail() {
  const _tryPatch = () => {
    if (typeof getBuildingDetailHTML !== 'function') return false;
    if (getBuildingDetailHTML._v2patched) return true;
    const _orig = getBuildingDetailHTML;
    getBuildingDetailHTML = function(bldg, contIdx) {
      if (bldg.type === 'defenseGrid') {
        return getDefenseGridDetailHTML(bldg);
      }
      if (bldg.type === 'terraformer') {
        return getTerraformerDetailHTML(bldg, contIdx);
      }
      return _orig(bldg, contIdx);
    };
    getBuildingDetailHTML._v2patched = true;
    return true;
  };

  if (!_tryPatch()) {
    // Retry after DOM ready
    window.addEventListener('DOMContentLoaded', _tryPatch);
  }
})();

// ─────────────────────────────────────────────
//  INITIALISE EVERYTHING
// ─────────────────────────────────────────────

(function _initPlanetsV2() {
  // Wait for game state to be ready
  const _init = () => {
    if (typeof BUILDINGS === 'undefined' || typeof state === 'undefined') {
      setTimeout(_init, 200);
      return;
    }
    applyNewPlanetBuildingData();
    startCounterAttackTimer();

    // Re-patch patchProductionTick in case it wasn't defined yet when script loaded
    if (typeof patchProductionTick === 'function' && !patchProductionTick._v2patched) {
      const _orig = patchProductionTick;
      patchProductionTick = function() {
        if (_activePlanetBlocked()) {
          const snap = Object.assign({}, state.res);
          _orig();
          state.res.metal       = snap.metal;
          state.res.food        = snap.food;
          state.res.research    = snap.research;
          state.res.excellorant = snap.excellorant;
          state.res.credits     = snap.credits;
          const idx = _activePlanetSolarIdx();
          const tf = state.terraforming && state.terraforming[idx];
          if (tf && tf.active) {
            state.res.metal = Math.max(0, (state.res.metal || 0) - 50);
            state.res.food  = Math.max(0, (state.res.food  || 0) - 30);
            _advanceTerraformingProgress(idx);
          }
        } else {
          _orig();
        }
      };
      patchProductionTick._v2patched = true;
    }
  };
  _init();
})();

// FLAT LOOKUP TABLE (id → item)
// ─────────────────────────────────────────────────────────────────────────────

const RESEARCH_TREE_INDEX = (() => {
  const idx = {};
  for (const branch of Object.values(RESEARCH_TREE)) {
    for (const item of branch.items) {
      idx[item.id] = item;
    }
  }
  return idx;
})();

// ─────────────────────────────────────────────────────────────────────────────
// STATE INIT
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Call once after state is initialized (or on save-load).
 * Adds state.researchV2 Set if missing, then auto-unlocks free items.
 */
function initResearchV2() {
  if (!state.researchV2) state.researchV2 = new Set();
  // Auto-unlock all items with cost:0 and autoUnlock:true
  for (const item of Object.values(RESEARCH_TREE_INDEX)) {
    if (item.autoUnlock && item.cost === 0 && !state.researchV2.has(item.id)) {
      state.researchV2.add(item.id);
    }
  }
  // Bridge: sync legacy techUnlocked from BLDG_RESEARCH into researchV2
  if (state.techUnlocked) {
    if (state.techUnlocked.has('advConstruction') && !state.researchV2.has('advConstruction')) {
      state.researchV2.add('advConstruction');
    }
    if (state.techUnlocked.has('megaStructures') && !state.researchV2.has('megaStructures')) {
      state.researchV2.add('megaStructures');
    }
  }
  applyResearchEffects();
}

// ─────────────────────────────────────────────────────────────────────────────
// PREREQUISITE / AVAILABILITY CHECK
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Returns true if the given research id can be purchased right now.
 * Requires: not already done, all prereqs done, enough research points.
 */
function canResearch(id) {
  if (!state.researchV2) return false;
  if (state.researchV2.has(id)) return false; // already done
  const item = RESEARCH_TREE_INDEX[id];
  if (!item) return false;
  for (const req of item.prereqs) {
    if (!state.researchV2.has(req)) return false;
  }
  return true; // cost check is caller's responsibility or done in doResearchV2
}

/**
 * Returns one of: 'done', 'available', 'locked', 'unknown'
 */
function getResearchStatus(id) {
  if (!state.researchV2) return 'locked';
  if (state.researchV2.has(id)) return 'done';
  const item = RESEARCH_TREE_INDEX[id];
  if (!item) return 'unknown';
  for (const req of item.prereqs) {
    if (!state.researchV2.has(req)) return 'locked';
  }
  return 'available';
}

// ─────────────────────────────────────────────────────────────────────────────
// DO RESEARCH (purchase)
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Validates prereqs and cost, deducts research points, marks done, applies effects.
 * Shows toast notifications. Returns true on success.
 */
function doResearchV2(id) {
  if (!state.researchV2) initResearchV2();
  const item = RESEARCH_TREE_INDEX[id];
  if (!item) { toast('// UNKNOWN RESEARCH //'); return false; }
  if (state.researchV2.has(id)) { toast('// ALREADY RESEARCHED //'); return false; }

  // Check prereqs
  for (const req of item.prereqs) {
    if (!state.researchV2.has(req)) {
      const reqItem = RESEARCH_TREE_INDEX[req];
      toast(`// REQUIRES: ${reqItem ? reqItem.name.toUpperCase() : req.toUpperCase()} //`);
      return false;
    }
  }

  // Apply Grand Unified Theory discount
  let cost = item.cost;
  if (state.researchV2.has('grandUnifiedTheory') && cost > 0) {
    cost = Math.floor(cost * 0.70);
  }

  if ((state.res.research || 0) < cost) {
    toast(`// NEED ${cost} RESEARCH //`);
    return false;
  }

  state.res.research -= cost;
  state.researchV2.add(id);

  // Bridge: keep legacy techUnlocked in sync for building gate checks
  if (item.effect && item.effect.type === 'unlock') {
    if (item.effect.key === 'advConstruction' || item.id === 'advConstruction') {
      if (!state.techUnlocked) state.techUnlocked = new Set();
      state.techUnlocked.add('advConstruction');
    }
    if (item.effect.key === 'megaStructures' || item.id === 'megaStructures') {
      if (!state.techUnlocked) state.techUnlocked = new Set();
      state.techUnlocked.add('megaStructures');
    }
  }

  toast(`// ${item.name.toUpperCase()} UNLOCKED //`);
  applyResearchEffects();
  if (typeof renderAllResBars === 'function') renderAllResBars();
  return true;
}

// ─────────────────────────────────────────────────────────────────────────────
// EFFECT APPLICATION
// ─────────────────────────────────────────────────────────────────────────────

// Global bonus cache — recomputed on each unlock
const _researchBonuses = {};

/**
 * Recomputes all bonuses from state.researchV2.
 * Called after each unlock and on game load.
 */
function applyResearchEffects() {
  // Reset cache
  for (const k of Object.keys(_researchBonuses)) delete _researchBonuses[k];

  if (!state.researchV2) return;

  for (const id of state.researchV2) {
    const item = RESEARCH_TREE_INDEX[id];
    if (!item || !item.effect) continue;
    const e = item.effect;

    switch (e.type) {
      case 'troopAtk': {
        const k = `troopAtk_${e.unit}`;
        _researchBonuses[k] = (_researchBonuses[k] || 0) + e.bonus;
        break;
      }
      case 'troopDef': {
        const k = `troopDef_${e.unit}`;
        _researchBonuses[k] = (_researchBonuses[k] || 0) + e.bonus;
        break;
      }
      case 'troopSpd': {
        const k = `troopSpd_${e.unit}`;
        _researchBonuses[k] = (_researchBonuses[k] || 0) + e.bonus;
        break;
      }
      case 'troopHp': {
        const k = `troopHp_${e.unit}`;
        _researchBonuses[k] = (_researchBonuses[k] || 0) + e.bonus;
        break;
      }
      case 'troopProd': {
        const k = `troopProd_${e.unit}`;
        _researchBonuses[k] = (_researchBonuses[k] || 0) + e.bonus;
        break;
      }
      case 'buildSpd': {
        _researchBonuses['buildSpd'] = (_researchBonuses['buildSpd'] || 0) + e.bonus;
        break;
      }
      case 'bldgHp': {
        _researchBonuses['bldgHp'] = (_researchBonuses['bldgHp'] || 0) + e.bonus;
        break;
      }
      case 'prodBonus': {
        const k = `prodBonus_${e.key}`;
        _researchBonuses[k] = (_researchBonuses[k] || 0) + e.bonus;
        break;
      }
      case 'energyProd': {
        _researchBonuses['energyProd'] = (_researchBonuses['energyProd'] || 0) + e.bonus;
        break;
      }
      case 'energyEff': {
        _researchBonuses['energyEff'] = (_researchBonuses['energyEff'] || 0) + e.bonus;
        break;
      }
      case 'researchProd': {
        _researchBonuses['researchProd'] = (_researchBonuses['researchProd'] || 0) + e.bonus;
        break;
      }
      case 'shipHp': {
        _researchBonuses['shipHp'] = (_researchBonuses['shipHp'] || 0) + e.bonus;
        break;
      }
      case 'shipAtk': {
        _researchBonuses['shipAtk'] = (_researchBonuses['shipAtk'] || 0) + e.bonus;
        break;
      }
      case 'shipSpd': {
        _researchBonuses['shipSpd'] = (_researchBonuses['shipSpd'] || 0) + e.bonus;
        break;
      }
      case 'storeCap': {
        const k = `storeCap_${e.key}`;
        _researchBonuses[k] = (_researchBonuses[k] || 0) + e.bonus;
        break;
      }
      case 'terraformSpd': {
        _researchBonuses['terraformSpd'] = (_researchBonuses['terraformSpd'] || 0) + e.bonus;
        break;
      }
      case 'unlock': {
        _researchBonuses[`unlock_${e.key}`] = true;
        break;
      }
      case 'passive': {
        const k = `passive_${e.key}`;
        _researchBonuses[k] = (_researchBonuses[k] || 0) + (e.bonus || 0);
        break;
      }
    }
  }
}

/**
 * Returns the cumulative additive bonus (as a fraction, e.g. 0.35 = +35%) for
 * a given effect type and optional sub-key.
 *
 * Examples:
 *   getResearchBonus('troopAtk', 'infantry')  → 0.20 (if +20% total)
 *   getResearchBonus('troopAtk', 'all')       → combined all-unit bonus
 *   getResearchBonus('shipHp')                → e.g. 0.35
 *   getResearchBonus('unlock', 'advConstruction') → true/false
 *
 * For troop stats, 'all' bonuses stack on top of unit-specific ones — callers
 * should add getResearchBonus('troopAtk', unit) + getResearchBonus('troopAtk', 'all').
 */
function getResearchBonus(effectType, subKey) {
  if (subKey !== undefined) {
    return _researchBonuses[`${effectType}_${subKey}`] || (effectType === 'unlock' ? false : 0);
  }
  return _researchBonuses[effectType] || 0;
}

/**
 * Convenience: returns total troop ATK multiplier for a unit type (1.0 = no bonus).
 */
function getTroopAtkMult(unit) {
  const unitBonus = getResearchBonus('troopAtk', unit);
  const allBonus  = getResearchBonus('troopAtk', 'all');
  return 1 + unitBonus + allBonus;
}

/**
 * Convenience: returns total troop DEF multiplier for a unit type.
 */
function getTroopDefMult(unit) {
  const unitBonus = getResearchBonus('troopDef', unit);
  const allBonus  = getResearchBonus('troopDef', 'all');
  return 1 + unitBonus + allBonus;
}

/**
 * Convenience: returns total ship HP multiplier.
 */
function getShipHpMult() {
  return 1 + getResearchBonus('shipHp');
}

/**
 * Convenience: returns total ship ATK multiplier.
 */
function getShipAtkMult() {
  return 1 + getResearchBonus('shipAtk');
}

/**
 * Convenience: returns total build speed multiplier (higher = faster builds).
 */
function getBuildSpdMult() {
  return 1 + getResearchBonus('buildSpd');
}

// ─────────────────────────────────────────────────────────────────────────────
// UI — RENDER RESEARCH TREE (one branch)
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Returns an HTML string listing all items in branchKey tier-order.
 * Items show: icon, name, cost, prereq badges, effect desc, and action button.
 */
function renderResearchTree(branchKey) {
  const branch = RESEARCH_TREE[branchKey];
  if (!branch) return '<div style="color:var(--warn)">Unknown branch</div>';

  const rows = branch.items.map(item => {
    const status = getResearchStatus(item.id);
    const isDone = status === 'done';
    const isAvail = status === 'available';
    const isLocked = status === 'locked';

    // Cost display
    let costStr = item.cost === 0 ? 'FREE' : `${item.cost} RP`;
    // Apply grand unified discount hint
    if (!isDone && item.cost > 0 && state.researchV2 && state.researchV2.has('grandUnifiedTheory')) {
      const discounted = Math.floor(item.cost * 0.70);
      costStr = `<span style="text-decoration:line-through;color:var(--muted)">${item.cost}</span> ${discounted} RP`;
    }

    // Prereq badges
    const prereqBadges = item.prereqs.map(req => {
      const reqItem = RESEARCH_TREE_INDEX[req];
      const reqDone = state.researchV2 && state.researchV2.has(req);
      const badgeColor = reqDone ? 'var(--mil)' : 'var(--warn)';
      const badgeName = reqItem ? reqItem.name : req;
      return `<span style="font-size:9px;padding:1px 5px;border:1px solid ${badgeColor};color:${badgeColor};margin-right:3px;white-space:nowrap">${badgeName}</span>`;
    }).join('');

    // Button
    let btn = '';
    if (isDone) {
      btn = `<span style="color:var(--mil);font-size:11px;font-weight:900;letter-spacing:1px">✓ DONE</span>`;
    } else if (isAvail) {
      btn = `<button class="gal-btn mil" onclick="doResearchV2('${item.id}');openResearchScreen()" style="flex-shrink:0"><div class="gal-btn-inner" style="padding:5px 10px;font-size:9px;letter-spacing:1px">RESEARCH</div></button>`;
    } else {
      btn = `<button class="gal-btn steel" style="flex-shrink:0;opacity:0.45;pointer-events:none"><div class="gal-btn-inner" style="padding:5px 10px;font-size:9px">LOCKED</div></button>`;
    }

    // Card opacity
    const opacity = isLocked ? '0.55' : '1';
    // Card border accent
    const borderColor = isDone ? 'var(--mil)' : isAvail ? branch.color : 'var(--edge)';

    return `
      <div style="opacity:${opacity};display:flex;align-items:center;gap:10px;padding:10px 12px;
        background:var(--plate2);border-left:3px solid ${borderColor};
        border-bottom:1px solid #0d0f08;margin-bottom:5px;position:relative">
        <div style="font-size:22px;width:28px;text-align:center;flex-shrink:0">${item.icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">
            ${isDone ? '✓ ' : ''}${item.name}
          </div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:3px">${item.desc}</div>
          ${prereqBadges ? `<div style="margin-bottom:3px">${prereqBadges}</div>` : ''}
          <div style="font-size:10px;color:var(--rust);font-weight:700">${costStr}</div>
        </div>
        <div style="flex-shrink:0">${btn}</div>
      </div>`;
  }).join('');

  return `<div style="padding:4px 0">${rows}</div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// UI — TABBED RESEARCH SCREEN HTML
// ─────────────────────────────────────────────────────────────────────────────

// Tracks the active research tab between renders
let _activeResearchTab = 'military';

/**
 * Returns the full HTML for the tabbed research screen.
 * Embeds tab click handlers that call openResearchScreen(tabKey).
 */
function getResearchScreenHTML(activeTab) {
  if (activeTab) _activeResearchTab = activeTab;
  const tab = _activeResearchTab;

  // Tab bar
  const tabBar = Object.entries(RESEARCH_TREE).map(([key, branch]) => {
    const isActive = key === tab;
    // Count done/total for badge
    const total = branch.items.length;
    const done  = branch.items.filter(it => state.researchV2 && state.researchV2.has(it.id)).length;
    const badgeStyle = `font-size:9px;padding:1px 4px;border-radius:2px;margin-left:4px;background:${isActive ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.08)'};color:${done === total ? 'var(--mil)' : 'var(--muted)'}`;
    const activeStyle = isActive
      ? `border-bottom:2px solid ${branch.color};color:var(--text);background:var(--plate2)`
      : 'border-bottom:2px solid transparent;color:var(--muted);background:transparent';
    return `<button onclick="openResearchScreen('${key}')" style="
      flex:1;padding:7px 2px;font-size:10px;font-weight:900;letter-spacing:0.5px;
      text-transform:uppercase;font-family:inherit;border:none;cursor:pointer;
      ${activeStyle};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
      ${branch.icon} ${branch.label.split(' ')[0]}
      <span style="${badgeStyle}">${done}/${total}</span>
    </button>`;
  }).join('');

  // Summary bar: current research points
  const rp = Math.floor(state.res.research || 0);
  const summaryBar = `<div style="display:flex;justify-content:space-between;align-items:center;
    padding:6px 12px;background:#0d100a;border-bottom:1px solid var(--edge);font-size:11px">
    <span style="color:var(--muted);letter-spacing:1px">RESEARCH POINTS</span>
    <span style="color:var(--gold);font-weight:900">${rp} RP</span>
  </div>`;

  // Active branch header
  const activeBranch = RESEARCH_TREE[tab];
  const branchHeader = `<div style="padding:10px 12px 6px;border-bottom:1px solid var(--edge)">
    <div style="font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
      color:${activeBranch.color}">
      ${activeBranch.icon} ${activeBranch.label}
    </div>
  </div>`;

  // Tree content
  const treeContent = renderResearchTree(tab);

  return `
    <div style="display:flex;flex-direction:column;height:100%">
      ${summaryBar}
      <div style="display:flex;border-bottom:1px solid var(--edge);flex-shrink:0;overflow-x:auto;background:var(--plate)">
        ${tabBar}
      </div>
      ${branchHeader}
      <div style="flex:1;overflow-y:auto;padding:8px 4px 24px">
        ${treeContent}
      </div>
    </div>`;
}

 * Replace the openBuilding call for researchCenter with this.
 *
 * Call as: openResearchScreen()          — uses last active tab
 *          openResearchScreen('fleet')   — opens a specific tab
 */
function openResearchScreen(tabKey) {
  // Ensure state is initialized
  if (!state.researchV2) initResearchV2();
  if (tabKey) _activeResearchTab = tabKey;

  // Use the existing building detail overlay mechanism
  // We inject into the roster panel of the open building detail screen
  const html = getResearchScreenHTML(_activeResearchTab);

  // Target the roster/body area used by openBuilding
  const rosterEl = document.getElementById('bldg-roster');
  if (rosterEl) {
    rosterEl.innerHTML = html;
    return;
  }

  // Fallback: use modal if bldg-roster not present
  const modalBody = document.getElementById('modal-body');
  if (modalBody) {
    modalBody.innerHTML = html;
    return;
  }

  // Final fallback: build an overlay
  let overlay = document.getElementById('research-v2-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'research-v2-overlay';
    overlay.style.cssText = `position:fixed;inset:0;z-index:8000;background:var(--bg);
      display:flex;flex-direction:column;max-width:540px;margin:0 auto;overflow:hidden`;
    // Close button bar
    const closeBar = document.createElement('div');
    closeBar.style.cssText = `display:flex;align-items:center;justify-content:space-between;
      padding:8px 14px;background:var(--plate);border-bottom:2px solid var(--edge)`;
    closeBar.innerHTML = `<span style="font-size:13px;font-weight:900;letter-spacing:2px;color:var(--rust)">RESEARCH CENTER</span>
      <button onclick="document.getElementById('research-v2-overlay').remove()"
        style="background:var(--plate);border:1px solid var(--edge);color:var(--steel);
        padding:4px 10px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;
        text-transform:uppercase">✕ CLOSE</button>`;
    const body = document.createElement('div');
    body.id = 'research-v2-body';
    body.style.cssText = 'flex:1;overflow:hidden;display:flex;flex-direction:column';
    overlay.appendChild(closeBar);
    overlay.appendChild(body);
    document.getElementById('app').appendChild(overlay);
  }
  const body = document.getElementById('research-v2-body');
  if (body) body.innerHTML = html;
}

/**
 * Call patchResearchCenterBuilding() once at game start to redirect
 * the Research Center building detail to use the V2 tree.
 *
 * This stores the original openBuilding and wraps it.
 */
function patchResearchCenterBuilding() {
  if (typeof openBuilding !== 'function') return;
  const _origOpenBuilding = openBuilding;
  window.openBuilding = function(bldg, contIdx) {
    if (bldg && bldg.type === 'researchCenter') {
      // Store selection state for re-render
      state.selBldg = bldg;
      if (contIdx !== undefined) state.selCont = contIdx;
      openResearchScreen(_activeResearchTab);
      return;
    }
    return _origOpenBuilding.apply(this, arguments);
  };
}
