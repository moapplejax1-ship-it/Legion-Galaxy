  ctx.fillStyle = '#7adba0';
  ctx.beginPath();
  ctx.ellipse(px + pw * 0.42, py + ph * 0.1, pw * 0.08, ph * 0.05, -0.5, 0, Math.PI * 2);
  ctx.fill();
}

const _iconCache = {};
function buildingIconDataURL(type) {
  if (_iconCache[type]) return _iconCache[type];
  const drawer = BUILDING_DRAWERS[type];
  const size = 40;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0c1018';
  ctx.fillRect(0, 0, size, size);
  if (drawer) drawer(ctx, 0, 0, size, size, 1);
  const url = c.toDataURL();
  _iconCache[type] = url;
  return url;
}

const BUILDING_DRAWERS = {
  colonyCenter: drawColonyCenter, resourceCollector: drawResourceCollector,
  barracks: drawBarracks, farm: (ctx,px,py,pw,ph,lvl)=>drawFarm(ctx,px,py,pw,ph,lvl),
  housingBlock: drawHousingBlock, researchCenter: drawResearchCenter,
  powerRelay: drawPowerRelay, tradePost: drawTradePost, storehouse: drawStorehouse,
  excellorantFactory: drawExcellorantFactory, spaceport: drawSpaceport,
  commodityExchange: drawCommodityExchange, defenseGrid: drawDefenseGrid,
  terraformer: drawTerraformer,
};

function drawGridBuilding(ctx, bldg, cellSize, now) {
  const def = BUILDING_DEFS[bldg.type];
  if (!def) return;
  const px = bldg.col * cellSize;
  const py = bldg.row * cellSize;
  const pw = def.w * cellSize;
  const ph = def.h * cellSize;
  if (!bldg.built) {
    ctx.fillStyle = 'rgba(80,80,30,0.7)';
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = '#c0a030';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
    // scaffolding lines
    ctx.strokeStyle = 'rgba(200,160,50,0.5)';
    for (let xi = 0; xi < def.w; xi++) {
      ctx.beginPath();
      ctx.moveTo(px + xi * cellSize + cellSize * 0.5, py);
      ctx.lineTo(px + xi * cellSize + cellSize * 0.5, py + ph);
      ctx.stroke();
    }
    const progress = bldg.buildEnd ? Math.max(0, Math.min(1, 1 - (bldg.buildEnd - now) / 30000)) : 0;
    ctx.fillStyle = '#c0a030';
    ctx.fillRect(px + 2, py + ph - 8, (pw - 4) * progress, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '9px monospace';
    ctx.fillText(Math.floor(progress * 100) + '%', px + 4, py + ph - 10);
    return;
  }
  const drawer = BUILDING_DRAWERS[bldg.type];
  if (drawer) {
    drawer(ctx, px, py, pw, ph, bldg.level);
  } else {
    ctx.fillStyle = '#334';
    ctx.fillRect(px + 1, py + 1, pw - 2, ph - 2);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
  // overdrive glow
  const odExp = state.overdrive[bldg._uid];
  if (odExp && now < odExp) {
    ctx.strokeStyle = 'rgba(255,200,0,0.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#ffd700';
    ctx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
    ctx.shadowBlur = 0;
  }
  // level badge
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(px + pw - 14, py + 2, 12, 12);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 9px monospace';
  ctx.fillText(bldg.level, px + pw - 10, py + 12);
}

function drawContinentMap(canvas, cont) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const seed = strSeed(cont.name);
  const rng = mkRng(seed);
  paintTerrain(ctx, W, H, rng, cont.conquered, cont.threat);
  // grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= GCOLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, H); ctx.stroke();
  }
  for (let r = 0; r <= GROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(W, r * CELL); ctx.stroke();
  }
  // buildings
  const now = Date.now();
  cont.bldgs.forEach(b => drawGridBuilding(ctx, b, CELL, now));
  // placing highlight
  if (state.placing) {
    const def = BUILDING_DEFS[state.placing];
    if (def) {
      ctx.fillStyle = 'rgba(0,255,100,0.15)';
      for (let r = 0; r < GROWS; r++) {
        for (let c = 0; c < GCOLS; c++) {
          if (canPlace(cont, c, r, state.placing)) {
            ctx.fillRect(c * CELL + 1, r * CELL + 1, def.w * CELL - 2, def.h * CELL - 2);
          }
        }
      }
    }
  }
}

// ─── SECTION 6: TROOPS SYSTEM ────────────────────────────────────────────────

function getTotalTroops(ut) {
  return (state.troops[ut].t1 || 0) + (state.troops[ut].t2 || 0) + (state.troops[ut].t3 || 0);
}

function getTotalAllTroops() {
  return Object.keys(state.troops).reduce((s, ut) => s + getTotalTroops(ut), 0);
}

function deployedTroops() {
  return (state.invasion.playerUnits || []).length;
}

function openTroops(fromContIdx) {
  showScreen('troops');
  const backBtn = document.getElementById('troops-back');
  if (backBtn) {
    backBtn.onclick = fromContIdx != null ? () => openContinent(fromContIdx) : goHome;
  }
  renderTroopsBody();
  renderAllResBars();
}

function renderTroopsBody() {
  const el = document.getElementById('troops-body');
  if (!el) return;
  let html = '<div class="troops-grid">';
  Object.entries(TROOP_DEFS).forEach(([ut, def]) => {
    const tr = state.troops[ut];
    const qty = state.trainQty[ut] || 1;
    const trainCostStr = Object.entries(def.trainCost).map(([r, v]) => `${v * qty} ${r}`).join(', ');
    const canTrain = Object.entries(def.trainCost).every(([r, v]) => (state.res[r] || 0) >= v * qty);
    const r1 = def.upgRecipe[0], r2 = def.upgRecipe[1];
    const canUpg12 = tr.t1 >= r1[0];
    const canUpg23 = tr.t2 >= r2[0];
    html += `<div class="troop-card">
      <div class="troop-header">${def.icon} ${def.names[0]} / ${def.names[1]} / ${def.names[2]}</div>
      <div class="troop-counts">T1: ${tr.t1} | T2: ${tr.t2} | T3: ${tr.t3}</div>
      <div class="troop-stats">HP: ${def.hp} | ATK: ${def.atk} | DEF: ${def.def} | SPD: ${def.spd}</div>
      <div class="train-row">
        <button onclick="adjTrainQty('${ut}',-1)">−</button>
        <span> x${qty} </span>
        <button onclick="adjTrainQty('${ut}',1)">+</button>
        <button ${canTrain ? '' : 'disabled'} onclick="trainTroops('${ut}')">TRAIN (${trainCostStr})</button>
      </div>
      <div class="upg-row">
        <button ${canUpg12 ? '' : 'disabled'} onclick="upgradeTroops('${ut}',1,1)">${r1[0]} T1 → ${r1[1]} T2</button>
        <button ${canUpg23 ? '' : 'disabled'} onclick="upgradeTroops('${ut}',2,1)">${r2[0]} T2 → ${r2[1]} T3</button>
      </div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function adjTrainQty(ut, delta) {
  const def = TROOP_DEFS[ut];
  if (!def) return;
  state.trainQty[ut] = Math.max(1, (state.trainQty[ut] || 1) + delta * (def.batchSize || 1));
  renderTroopsBody();
}

function trainTroops(unitType) {
  const def = TROOP_DEFS[unitType];
  if (!def) return;
  const qty = state.trainQty[unitType] || 1;
  const canAfford = Object.entries(def.trainCost).every(([r, v]) => (state.res[r] || 0) >= v * qty);
  if (!canAfford) { toast('// INSUFFICIENT RESOURCES //'); return; }
  Object.entries(def.trainCost).forEach(([r, v]) => { state.res[r] -= v * qty; });
  state.troops[unitType].t1 = (state.troops[unitType].t1 || 0) + qty;
  renderTroopsBody();
  renderAllResBars();
  toast(`// TRAINED ${qty} ${def.names[0]} //`);
}

function upgradeTroops(unitType, fromTier, qty) {
  const def = TROOP_DEFS[unitType];
  if (!def) return;
  const recipe = fromTier === 1 ? def.upgRecipe[0] : def.upgRecipe[1];
  if (!recipe) return;
  const [need, give] = recipe;
  const fromKey = 't' + fromTier;
  const toKey   = 't' + (fromTier + 1);
  const have = state.troops[unitType][fromKey] || 0;
  if (have < need) { toast('// NOT ENOUGH TROOPS //'); return; }
  state.troops[unitType][fromKey] -= need;
  state.troops[unitType][toKey]    = (state.troops[unitType][toKey] || 0) + give;
  renderTroopsBody();
  toast(`// UPGRADED ${need} ${def.names[fromTier - 1]} → ${give} ${def.names[fromTier]} //`);
}

// ─── SECTION 7: INVASION / COMBAT SYSTEM ─────────────────────────────────────

let _battleInterval = null;
let _battleRafId    = null;

function _makeUnit(side, type, tier, x, y) {
  const def = TROOP_DEFS[type];
  if (!def) return null;
  const tm = TROOP_TIER_MULT[tier - 1] || 1;
  const atkMult = side === 'player' ? getTroopAtkMult(type) : 1;
  const defMult = side === 'player' ? getTroopDefMult(type) : 1;
  const hp = Math.floor(def.hp * tm);
  return {
    id: state._uid++, side, type, tier, x, y,
    hp, maxHp: hp,
    atk: def.atk * tm * atkMult,
    def: def.def * defMult,
    spd: def.spd * (1 + getResearchBonus('troopSpd')),
    cooldown: 0, lastHit: 0, alive: true,
  };
}

function _genEnemyUnits(aliens, contIdx) {
  const units = [];
  const W = 400;
  const rng = mkRng(strSeed('aliens' + contIdx));
  const addUnits = (type, count, tier) => {
    for (let i = 0; i < count; i++) {
      const x = 20 + rng() * (W - 40);
      const y = 20 + rng() * 80;
      units.push(_makeUnit('enemy', type, tier, x, y));
    }
  };
  if (aliens.infantry > 0) addUnits('infantry', Math.min(aliens.infantry, 40), 1);
  if (aliens.tanks > 0)    addUnits('tanks',    Math.min(aliens.tanks, 20), 1);
  if (aliens.cavalry > 0)  addUnits('cavalry',  Math.min(aliens.cavalry, 20), 1);
  return units;
}

function openInvasion(contIdx) {
  const cont = state.planet.continents[contIdx];
  state.invasion = {
    contIdx, phase: 'deploy',
    playerUnits: [], enemyUnits: [],
    battleResult: null,
    deployType: 'infantry', deployTier: 1,
  };
  if (cont.aliens) {
    state.invasion.enemyUnits = _genEnemyUnits(cont.aliens, contIdx);
  }
  const titleEl = document.getElementById('inv-title');
  if (titleEl) titleEl.textContent = '⚔ INVADE: ' + cont.name;
  const backBtn = document.getElementById('inv-back');
  if (backBtn) {
    backBtn.onclick = () => {
      if (_battleRafId) { cancelAnimationFrame(_battleRafId); _battleRafId = null; }
      openContinent(contIdx);
    };
  }
  showScreen('invasion');
  renderInvasionDeploy();
}

function renderInvasionDeploy() {
  const el = document.getElementById('inv-body');
  if (!el) return;
  const inv = state.invasion;
  const cont = state.planet.continents[inv.contIdx];
  let html = `<div class="inv-deploy">
    <h3>⚔ INVADE: ${cont.name} [${cont.threat}]</h3>
    <div class="inv-garrison">Enemy: 🪖${cont.aliens ? cont.aliens.infantry : 0} 🚂${cont.aliens ? cont.aliens.tanks : 0} 🐴${cont.aliens ? cont.aliens.cavalry : 0}</div>
    <div class="unit-select">`;
  Object.entries(TROOP_DEFS).forEach(([ut, def]) => {
    ['t1','t2','t3'].forEach((tier, ti) => {
      const count = state.troops[ut][tier] || 0;
      const sel = (inv.deployType === ut && inv.deployTier === ti + 1) ? ' selected' : '';
      html += `<button class="unit-btn${sel}" onclick="setDeployUnit('${ut}',${ti + 1})" ${count === 0 ? 'disabled' : ''}>
        ${def.icon} T${ti + 1} (${count})
      </button>`;
    });
  });
  html += `</div>
    <p>Deployed: ${inv.playerUnits.length} units</p>
    <p>Click the canvas below to place units on the battlefield</p>
    <button onclick="engageInvasion()" ${inv.playerUnits.length > 0 ? '' : 'disabled'}>⚔ ENGAGE</button>
    <button onclick="goHome()">↩ RETREAT</button>
  </div>`;
  el.innerHTML = html;
  setupInvasionCanvas();
}

function setDeployUnit(type, tier) {
  state.invasion.deployType = type;
  state.invasion.deployTier = tier;
  renderInvasionDeploy();
}

function setupInvasionCanvas() {
  const canvas = document.getElementById('invasion-map');
  if (!canvas) return;
  canvas.width  = canvas.parentElement ? (canvas.parentElement.clientWidth || 400) : 400;
  canvas.height = 240;
  _drawDeployPhase(canvas);
  canvas.onclick = (e) => {
    if (state.invasion.phase !== 'deploy') return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (my < canvas.height * 0.5) return; // only bottom half
    const type = state.invasion.deployType;
    const tier = state.invasion.deployTier;
    const tierKey = 't' + tier;
    if ((state.troops[type][tierKey] || 0) < 1) { toast('// NO UNITS //'); return; }
    state.troops[type][tierKey]--;
    const unit = _makeUnit('player', type, tier, mx, my);
    state.invasion.playerUnits.push(unit);
    _drawDeployPhase(canvas);
    renderInvasionDeploy();
  };
}

function _drawDeployPhase(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#0a1008';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(0, H * 0.5);
  ctx.lineTo(W, H * 0.5);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(0,100,255,0.08)';
  ctx.fillRect(0, H * 0.5, W, H * 0.5);
  ctx.fillStyle = 'rgba(255,30,30,0.08)';
  ctx.fillRect(0, 0, W, H * 0.5);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '10px monospace';
  ctx.fillText('DEPLOY ZONE', 10, H - 10);
  ctx.fillText('ENEMY ZONE', 10, 16);
  state.invasion.playerUnits.forEach(u => _drawUnit(ctx, u, W, H, Date.now()));
  state.invasion.enemyUnits.forEach(u => _drawUnit(ctx, u, W, H, Date.now()));
}

function _drawUnit(ctx, u, W, H, now) {
  if (!u.alive) return;
  const isPlayer = u.side === 'player';
  const flash = (now - u.lastHit) < 200;
  ctx.save();
  const hpRatio = u.hp / u.maxHp;
  const baseColor = isPlayer
    ? (flash ? '#ffffff' : `rgba(40,120,255,${0.7 + hpRatio * 0.3})`)
    : (flash ? '#ffffff' : `rgba(255,40,40,${0.7 + hpRatio * 0.3})`);
  if (u.type === 'infantry') {
    ctx.beginPath();
    ctx.arc(u.x, u.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = baseColor;
    ctx.fill();
  } else if (u.type === 'tanks') {
    ctx.fillStyle = baseColor;
    ctx.fillRect(u.x - 7, u.y - 7, 14, 14);
  } else if (u.type === 'cavalry') {
    ctx.beginPath();
    ctx.moveTo(u.x, u.y - 9);
    ctx.lineTo(u.x + 8, u.y + 7);
    ctx.lineTo(u.x - 8, u.y + 7);
    ctx.closePath();
    ctx.fillStyle = baseColor;
    ctx.fill();
  }
  // HP bar
  ctx.fillStyle = '#333';
  ctx.fillRect(u.x - 8, u.y - 14, 16, 4);
  ctx.fillStyle = hpRatio > 0.5 ? '#40e040' : hpRatio > 0.25 ? '#e0e040' : '#e04040';
  ctx.fillRect(u.x - 8, u.y - 14, 16 * hpRatio, 4);
  ctx.restore();
}

function _drawBattlefield(canvas, now) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const inv = state.invasion;
  const cont = state.planet.continents[inv.contIdx];
  ctx.fillStyle = '#0a1008';
  ctx.fillRect(0, 0, W, H);
  if (cont.threat === 'FORTIFIED' || cont.threat === 'GUARDED') {
    const wallY = Math.floor(H * 0.30);
    const wallH = 12;
    ctx.fillStyle = '#403020';
    ctx.fillRect(0, wallY, W, wallH);
    for (let x = 0; x < W; x += 20) {
      ctx.fillStyle = '#504030';
      ctx.fillRect(x, wallY - 6, 14, 8);
    }
  }
  inv.playerUnits.forEach(u => _drawUnit(ctx, u, W, H, now));
  inv.enemyUnits.forEach(u  => _drawUnit(ctx, u, W, H, now));
  if (inv.phase === 'done' && inv.battleResult) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H * 0.3, W, H * 0.4);
    ctx.fillStyle = inv.battleResult === 'victory' ? '#40ff40' : '#ff4040';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(inv.battleResult === 'victory' ? '// VICTORY //' : '// DEFEAT //', W / 2, H * 0.55);
    ctx.textAlign = 'left';
  }
}

function _battleTick() {
  const inv = state.invasion;
  const now = Date.now();
  const RANGE = 100;
  // player attacks enemies
  inv.playerUnits.forEach(pu => {
    if (!pu.alive || pu.cooldown > now) return;
    let nearest = null, nearDist = Infinity;
    inv.enemyUnits.forEach(eu => {
      if (!eu.alive) return;
      const d = Math.hypot(pu.x - eu.x, pu.y - eu.y);
      if (d < nearDist) { nearDist = d; nearest = eu; }
    });
    if (nearest && nearDist < RANGE) {
      const dmg = Math.max(1, pu.atk / nearest.def);
      nearest.hp -= dmg;
      nearest.lastHit = now;
      if (nearest.hp <= 0) nearest.alive = false;
      pu.cooldown = now + 600;
    } else if (nearest) {
      const dx = nearest.x - pu.x, dy = nearest.y - pu.y;
      const dist = Math.hypot(dx, dy);
      pu.x += (dx / dist) * pu.spd * 1000;
      pu.y += (dy / dist) * pu.spd * 1000;
    }
  });
  // enemy attacks player
  inv.enemyUnits.forEach(eu => {
    if (!eu.alive || eu.cooldown > now) return;
    let nearest = null, nearDist = Infinity;
    inv.playerUnits.forEach(pu => {
      if (!pu.alive) return;
      const d = Math.hypot(eu.x - pu.x, eu.y - pu.y);
      if (d < nearDist) { nearDist = d; nearest = pu; }
    });
    if (nearest && nearDist < RANGE) {
      const dmg = Math.max(1, eu.atk / nearest.def);
      nearest.hp -= dmg;
      nearest.lastHit = now;
      if (nearest.hp <= 0) nearest.alive = false;
      eu.cooldown = now + 800;
    } else if (nearest) {
      const dx = nearest.x - eu.x, dy = nearest.y - eu.y;
      const dist = Math.hypot(dx, dy);
      eu.x += (dx / dist) * eu.spd * 1000;
      eu.y += (dy / dist) * eu.spd * 1000;
    }
  });
  const allEnemyDead  = inv.enemyUnits.every(u => !u.alive);
  const allPlayerDead = inv.playerUnits.every(u => !u.alive);
  if (allEnemyDead || allPlayerDead) {
    _endBattle(allEnemyDead ? 'victory' : 'defeat');
  }
}

function engageInvasion() {
  state.invasion.phase = 'battle';
  if (_battleInterval) clearInterval(_battleInterval);
  _battleInterval = setInterval(_battleTick, 50);
  const canvas = document.getElementById('invasion-map');
  if (!canvas) return;
  canvas.onclick = null;
  const loop = (now) => {
    if (state.invasion.phase !== 'battle' && state.invasion.phase !== 'done') return;
    _drawBattlefield(canvas, now);
    if (state.invasion.phase === 'battle') _battleRafId = requestAnimationFrame(loop);
  };
  _battleRafId = requestAnimationFrame(loop);
}

function _endBattle(result) {
  if (_battleInterval) { clearInterval(_battleInterval); _battleInterval = null; }
  if (_battleRafId)    { cancelAnimationFrame(_battleRafId); _battleRafId = null; }
  state.invasion.phase = 'done';
  state.invasion.battleResult = result;
  const canvas = document.getElementById('invasion-map');
  if (canvas) _drawBattlefield(canvas, Date.now());
  const lossMult = result === 'victory' ? 0.10 : 0.30;
  const survivalBonus = getResearchBonus('survivalChance');
  const effectiveLoss = Math.max(0, lossMult - survivalBonus);
  ['infantry','tanks','cavalry'].forEach(ut => {
    ['t1','t2','t3'].forEach(tier => {
      state.troops[ut][tier] = Math.floor((state.troops[ut][tier] || 0) * (1 - effectiveLoss));
    });
  });
  const el = document.getElementById('inv-body');
  if (el) {
    const cont = state.planet.continents[state.invasion.contIdx];
    const resultMsg = result === 'victory' ? '// VICTORY //' : '// DEFEAT //';
    const actionBtn = result === 'victory'
      ? `<button onclick="finalizeVictory(${state.invasion.contIdx})">CLAIM TERRITORY</button>`
      : `<button onclick="goHome()">RETREAT</button>`;
    el.innerHTML = `<div class="battle-result">
      <h2 style="color:${result === 'victory' ? '#40ff40' : '#ff4040'}">${resultMsg}</h2>
      <p>${result === 'victory' ? 'Continental garrison eliminated.' : 'Forces repelled.'}</p>
      <p>Troop losses: ${Math.floor(effectiveLoss * 100)}%</p>
      ${actionBtn}
    </div>`;
  }
}

function finalizeVictory(contIdx) {
  const cont = state.planet.continents[contIdx];
  cont.conquered = true;
  cont.aliens    = null;
  // place colony center
  if (cont.bldgs.length === 0) {
    cont.bldgs.push({_uid: state._uid++, type:'colonyCenter', col:0, row:0, level:1, built:true, buildEnd:null});
  }
  toast('// CONTINENT SECURED //');
  renderHome();
  showScreen('home');
}

// ─── SECTION 8: RESEARCH V2 SYSTEM ───────────────────────────────────────────

let _researchBonuses = {};

function initResearchV2() {
  Object.values(RESEARCH_TREE).forEach(item => {
    if (item.free) state.researchV2.add(item.id);
  });
  applyResearchEffects();
}

function canResearch(id) {
  const item = RESEARCH_TREE[id];
  if (!item) return false;
  if (state.researchV2.has(id)) return false;
  if (!item.prereqs.every(p => state.researchV2.has(p))) return false;
  const costMult = 1 + (_researchBonuses.researchCostMult || 0);
  const cost = Math.floor((item.cost || 0) * Math.max(0.1, costMult));
  if ((state.res.research || 0) < cost) return false;
  return true;
}

function doResearchV2(id) {
  if (!canResearch(id)) { toast('// CANNOT RESEARCH //'); return; }
  const item = RESEARCH_TREE[id];
  const costMult = 1 + (_researchBonuses.researchCostMult || 0);
  const cost = Math.floor((item.cost || 0) * Math.max(0.1, costMult));
  state.res.research -= cost;
  state.researchV2.add(id);
  applyResearchEffects();
  renderAllResBars();
  toast('// RESEARCH COMPLETE: ' + item.name + ' //');
}

function applyResearchEffects() {
  const b = {
    troopAtk:{}, troopDef:{}, troopHp:{}, troopSpd:{}, troopCasMult:{},
    buildSpd:0, allProduction:0, collectorOutput:0, farmOutput:0, researchOutput:0,
    creditsOutput:0, shipHp:0, shipAtk:0, shipSpd:0, energyOutput:0,
    energyConsumption:0, storageCap:0, researchCostMult:0, garrisonReduction:0,
    terraformSpd:0, overdriveDuration:0, barracksOutput:0, tradeRates:0,
    commodityPkg:0, allShips:0, survivalChance:0,
  };
  state.researchV2.forEach(id => {
    const item = RESEARCH_TREE[id];
    if (!item) return;
    const eff = item.effects || {};
    if (eff.troopAtk)   Object.assign(b.troopAtk,    eff.troopAtk);
    if (eff.troopDef)   Object.assign(b.troopDef,    eff.troopDef);
    if (eff.troopHp)    Object.assign(b.troopHp,     eff.troopHp);
    if (eff.troopSpd)   { b.troopSpd = (b.troopSpd || 0) + (eff.troopSpd.all || 0); }
    if (eff.troopCasMult) Object.assign(b.troopCasMult, eff.troopCasMult);
    if (eff.buildSpd)        b.buildSpd        += eff.buildSpd;
    if (eff.allProduction)   b.allProduction   += eff.allProduction;
    if (eff.collectorOutput) b.collectorOutput += eff.collectorOutput;
    if (eff.farmOutput)      b.farmOutput      += eff.farmOutput;
    if (eff.researchOutput)  b.researchOutput  += eff.researchOutput;
    if (eff.creditsOutput)   b.creditsOutput   += eff.creditsOutput;
    if (eff.shipHp)          b.shipHp          += eff.shipHp;
    if (eff.shipAtk)         b.shipAtk         += eff.shipAtk;
    if (eff.shipSpd)         b.shipSpd         += eff.shipSpd;
    if (eff.energyOutput)    b.energyOutput    += eff.energyOutput;
    if (eff.energyConsumption) b.energyConsumption += eff.energyConsumption;
    if (eff.storageCap)      b.storageCap      += eff.storageCap;
    if (eff.researchCostMult) b.researchCostMult += eff.researchCostMult;
    if (eff.garrisonReduction) b.garrisonReduction += eff.garrisonReduction;
    if (eff.terraformSpd)    b.terraformSpd    += eff.terraformSpd;
    if (eff.overdriveDuration) b.overdriveDuration += eff.overdriveDuration;
    if (eff.barracksOutput)  b.barracksOutput  += eff.barracksOutput;
    if (eff.tradeRates)      b.tradeRates      += eff.tradeRates;
    if (eff.commodityPkg)    b.commodityPkg    += eff.commodityPkg;
    if (eff.allShips)        b.allShips        += eff.allShips;
    if (eff.survivalChance)  b.survivalChance  += eff.survivalChance;
  });
  _researchBonuses = b;
}

function getResearchBonus(key, subKey) {
  if (!_researchBonuses) return 0;
  if (subKey !== undefined) {
    const sub = _researchBonuses[key];
    if (!sub) return 0;
    return (sub[subKey] !== undefined ? sub[subKey] : (sub['all'] || 0));
  }
  return _researchBonuses[key] || 0;
}

function getTroopAtkMult(unit) { return 1 + getResearchBonus('troopAtk', unit) + ((_researchBonuses.troopAtk && _researchBonuses.troopAtk.all) || 0); }
function getTroopDefMult(unit) { return 1 + getResearchBonus('troopDef', unit) + ((_researchBonuses.troopDef && _researchBonuses.troopDef.all) || 0); }
function getShipHpMult()  { return 1 + getResearchBonus('shipHp'); }
function getShipAtkMult() { return 1 + getResearchBonus('shipAtk'); }
function getBuildSpdMult() { return 1 + getResearchBonus('buildSpd'); }

function getResearchScreenHTML(activeTab) {
  const branches = ['military','engineering','science','economy','fleet','planetary'];
  const tab = activeTab || 'military';
  let tabs = '<div class="rtabs">';
  branches.forEach(b => {
    tabs += `<button class="rtab${b === tab ? ' active' : ''}" onclick="openResearchScreen('${b}')">${b.toUpperCase()}</button>`;
  });
  tabs += '</div>';
  let items = '<div class="ritems">';
  Object.values(RESEARCH_TREE).filter(it => it.branch === tab).forEach(item => {
    const done = state.researchV2.has(item.id);
    const costMult = 1 + (_researchBonuses.researchCostMult || 0);
    const cost = Math.floor((item.cost || 0) * Math.max(0.1, costMult));
    const prereqsMet = item.prereqs.every(p => state.researchV2.has(p));
    const canAfford = (state.res.research || 0) >= cost;
    const available = prereqsMet && !done && canAfford;
    const locked = !prereqsMet || done;
    let border = done ? '#d4a832' : available ? '#c84010' : '#334';
    let btn = '';
    if (!done && prereqsMet) {
      btn = `<button ${available ? '' : 'disabled'} onclick="doResearchV2('${item.id}');openResearchScreen('${tab}')">BUY (${cost} ⚛)</button>`;
    }
    const prereqNames = item.prereqs.map(p => RESEARCH_TREE[p] ? RESEARCH_TREE[p].name : p).join(', ');
    items += `<div class="ri" style="border:1px solid ${border};opacity:${locked && !done ? '0.5' : '1'}">
      ${done ? '✓ ' : ''}<b>${item.name}</b>${item.free ? ' [FREE]' : ''}
      <div class="ri-eff">${JSON.stringify(item.effects).replace(/[{}"]/g,'').slice(0,60)}</div>
      ${prereqNames ? `<div class="ri-pre">Req: ${prereqNames}</div>` : ''}
      ${btn}
    </div>`;
  });
  items += '</div>';
  return tabs + items;
}

function openResearchScreen(tabKey) {
  openModal('Research', getResearchScreenHTML(tabKey || 'military'), {wide: true});
}

// ─── SECTION 9: FLEET V2 SYSTEM ──────────────────────────────────────────────

function initFleet() {
  if (!state.fleet) state.fleet = {ships:[], buildQueue:[]};
  if (!state.fleet.ships)      state.fleet.ships = [];
  if (!state.fleet.buildQueue) state.fleet.buildQueue = [];
}

function _shipFinalStats(shipClass, variantId) {
  const base = SHIP_DEFS[shipClass];
  if (!base) return null;
  let hpM = 1, atkM = 1, spdM = 1;
  if (variantId) {
    const variants = SHIP_VARIANTS[shipClass] || [];
    const vd = variants.find(v => v.id === variantId);
    if (vd) { hpM = vd.hpMult; atkM = vd.atkMult; spdM = vd.spdMult; }
  }
  return {
    hp:  Math.floor(base.hp  * hpM  * getShipHpMult()),
    atk: Math.floor(base.atk * atkM * getShipAtkMult()),
    spd: base.spd * spdM * (1 + getResearchBonus('shipSpd')),
  };
}

function _shipBuildCost(shipClass, variantId) {
  const base = SHIP_DEFS[shipClass];
  if (!base) return {};
  let costMult = 1;
  if (variantId) {
    const variants = SHIP_VARIANTS[shipClass] || [];
    const vd = variants.find(v => v.id === variantId);
    if (vd) costMult = vd.costMult;
  }
  const out = {};
  Object.entries(base.cost).forEach(([r, v]) => { out[r] = Math.ceil(v * costMult); });
  return out;
}

function canBuildShip(shipClass, variantId) {
  if (!spUnlocked()) return {ok:false, reason:'Requires 3 conquered continents + Spaceport'};
  const hasSpaceport = state.planet.continents.some(c =>
    c.conquered && c.bldgs.some(b => b.type === 'spaceport' && b.built)
  );
  if (!hasSpaceport) return {ok:false, reason:'Build a Spaceport first'};
  if (shipClass === 'dreadnaught') {
    const unlocked = state.researchV2.has('capitalShipDoctrine') || state.researchV2.has('warpTheory');
    if (!unlocked) return {ok:false, reason:'Requires Capital Ship Doctrine or Warp Theory'};
  }
  if (shipClass === 'carrier' && !state.researchV2.has('carrierTech')) {
    return {ok:false, reason:'Requires Carrier Tech research'};
  }
  const baseDef = SHIP_DEFS[shipClass];
  if (baseDef.maxFleet !== null) {
    const count = state.fleet.ships.filter(s => s.class === shipClass).length
                + state.fleet.buildQueue.filter(s => s.class === shipClass).length;
    if (count >= baseDef.maxFleet) return {ok:false, reason:`Max fleet limit (${baseDef.maxFleet}) reached`};
  }
  const cost = _shipBuildCost(shipClass, variantId);
  const affordable = Object.entries(cost).every(([r, v]) => (state.res[r] || 0) >= v);
  if (!affordable) return {ok:false, reason:'Insufficient resources'};
  return {ok:true, reason:''};
}

function startShipBuild(shipClass, variantId) {
  const check = canBuildShip(shipClass, variantId);
  if (!check.ok) { toast('// ' + check.reason.toUpperCase() + ' //'); return; }
  const cost = _shipBuildCost(shipClass, variantId);
  Object.entries(cost).forEach(([r, v]) => { state.res[r] -= v; });
  const base = SHIP_DEFS[shipClass];
  const buildTime = base.buildTime * 1000;
  const entry = {
    id: state._uid++, class: shipClass, variant: variantId || null,
    name: base.name, buildStart: Date.now(), buildEnd: Date.now() + buildTime,
  };
  state.fleet.buildQueue.push(entry);
  renderAllResBars();
  toast('// SHIP QUEUED //');
}

function _shipBuildTick() {
  const now = Date.now();
  const done = state.fleet.buildQueue.filter(q => now >= q.buildEnd);
  if (done.length === 0) return;
  done.forEach(q => {
    const stats = _shipFinalStats(q.class, q.variant);
    const base  = SHIP_DEFS[q.class];
    const ship = {
      id: q.id, class: q.class, variant: q.variant,
      name: q.name, hp: stats.hp, maxHp: stats.hp,
      atk: stats.atk, spd: stats.spd,
      upkeep: {...(base.upkeep || {})},
      status: 'idle', assignedContinent: null,
    };
    state.fleet.ships.push(ship);
    toast('// SHIP COMMISSIONED: ' + ship.name + ' //');
  });
  state.fleet.buildQueue = state.fleet.buildQueue.filter(q => now < q.buildEnd);
}

function startShipBuildInterval() {
  setInterval(_shipBuildTick, 1000);
}

function calcFleetUpkeep() {
  const total = {metal:0, food:0, energy:0, credits:0};
  state.fleet.ships.forEach(s => {
    const u = s.upkeep || {};
    Object.keys(total).forEach(r => { total[r] += (u[r] || 0); });
  });
  return total;
}

function applyFleetUpkeep() {
  const upkeep = calcFleetUpkeep();
  Object.entries(upkeep).forEach(([r, v]) => {
    state.res[r] = (state.res[r] || 0) - v;
    if (state.res[r] < 0) {
      state.res[r] = 0;
      // decommission most expensive ship
      const byUpkeep = [...state.fleet.ships].sort((a, b) => {
        const ua = Object.values(a.upkeep || {}).reduce((s, v) => s + v, 0);
        const ub = Object.values(b.upkeep || {}).reduce((s, v) => s + v, 0);
        return ub - ua;
      });
      if (byUpkeep.length > 0) {
        state.fleet.ships = state.fleet.ships.filter(s => s.id !== byUpkeep[0].id);
        toast('// SHIP DECOMMISSIONED: UPKEEP FAILURE //');
      }
    }
  });
}

function assignShip(shipId, status, contIdx) {
  const ship = state.fleet.ships.find(s => s.id === shipId);
  if (!ship) return;
  ship.status = status;
  ship.assignedContinent = contIdx !== undefined ? contIdx : null;
}

function renameShip(shipId, newName) {
  const ship = state.fleet.ships.find(s => s.id === shipId);
  if (!ship) return;
  ship.name = newName;
  const el = document.getElementById('bld-body');
  if (el) {
    const bldg = state.selBldg;
    if (bldg) el.innerHTML = getFleetScreenHTML();
  }
}

function getFleetScreenHTML() {
  const queue = state.fleet.buildQueue;
  const ships = state.fleet.ships;
  const upkeep = calcFleetUpkeep();
  const upkeepStr = Object.entries(upkeep).filter(([,v])=>v>0).map(([r,v])=>`${fmt(v)} ${r}`).join(', ');
  let html = '<div class="fleet-ui"><h3>Fleet Command</h3>';
  // Build Queue
  html += '<div class="fleet-section"><b>Build Queue</b>';
  if (queue.length === 0) html += '<p>Empty</p>';
  queue.forEach(q => {
    const rem = Math.max(0, Math.ceil((q.buildEnd - Date.now()) / 1000));
    html += `<div class="fleet-q-row">${q.name} — ${rem}s remaining</div>`;
  });
  html += '</div>';
  // Ship Builder
  html += '<div class="fleet-section"><b>Build Ships</b>';
  Object.entries(SHIP_DEFS).forEach(([cls, def]) => {
    const check = canBuildShip(cls, null);
    const costStr = Object.entries(def.cost).map(([r,v])=>`${fmt(v)} ${r}`).join(', ');
    html += `<div class="fleet-build-row">
      <b>${def.name}</b> HP:${def.hp} ATK:${def.atk} — ${costStr}<br>
      <button ${check.ok ? '' : 'disabled'} onclick="startShipBuild('${cls}',null)">${check.ok ? 'BUILD' : check.reason}</button>`;
    const variants = SHIP_VARIANTS[cls] || [];
    variants.forEach(v => {
      const vCheck = canBuildShip(cls, v.id);
      html += `<button ${vCheck.ok ? '' : 'disabled'} onclick="startShipBuild('${cls}','${v.id}')">${v.name}</button>`;
    });
    html += '</div>';
  });
  html += '</div>';
  // Fleet Roster
  html += '<div class="fleet-section"><b>Fleet Roster</b>';
  if (ships.length === 0) html += '<p>No ships</p>';
  ships.forEach(s => {
    html += `<div class="fleet-ship-row">
      ${s.name} (${s.class}) HP:${s.hp}/${s.maxHp} ATK:${s.atk} — ${s.status}
      <button onclick="renameShip(${s.id},prompt('New name:',${JSON.stringify(s.name)})||${JSON.stringify(s.name)})">✏</button>
    </div>`;
  });
  html += '</div>';
  // Upkeep
  html += `<div class="fleet-section"><b>Upkeep:</b> ${upkeepStr || 'none'}</div>`;
  html += '</div>';
  return html;
}

// ─── SECTION 10: TERRAFORMING, DEFENSE GRID, SOLAR SYSTEM ────────────────────

function getTerraformingProgress(idx) {
  const tf = state.terraforming[idx];
  if (!tf) return 0;
  const p = (tf.metalShipped / 5000 + tf.foodShipped / 3000 + tf.researchShipped / 1000) / 3;
  return Math.min(1, p);
}

function sendTerraformingResources(idx, type, amount) {
  const sol = state.solar[idx];
  if (!sol || !sol.inhospitable) return;
  if ((state.res[type] || 0) < amount) { toast('// INSUFFICIENT ' + type.toUpperCase() + ' //'); return; }
  if (!state.terraforming[idx]) state.terraforming[idx] = {active:false, metalShipped:0, foodShipped:0, researchShipped:0};
  state.res[type] -= amount;
  const key = type + 'Shipped';
  state.terraforming[idx][key] = (state.terraforming[idx][key] || 0) + amount;
  const progress = getTerraformingProgress(idx);
  renderAllResBars();
  if (progress >= 1.0) {
    sol.inhospitable = false;
    toast('// TERRAFORMING COMPLETE: ' + sol.name + ' //');
  } else {
    toast(`// TERRAFORMING: ${Math.floor(progress * 100)}% //`);
  }
  const bldgEl = document.getElementById('bld-body');
  if (bldgEl && state.selBldg && state.selBldg.type === 'terraformer') {
    renderBuildingDetail(state.selBldg, state.selCont);
  }
}

function getTerraformerDetailHTML(bldg, contIdx) {
  const solarIdx = 2; // default to Cinder Hollow; in a full game this would be tied to planet
  const sol = state.solar[solarIdx];
  const tf  = state.terraforming[solarIdx] || {metalShipped:0, foodShipped:0, researchShipped:0};
  const prog = getTerraformingProgress(solarIdx);
  const pct  = Math.floor(prog * 100);
  const active = tf.active;
  if (!sol) return '<p>No inhospitable planet assigned.</p>';
  return `<div class="tf-detail">
    <h3>Terraformer — Level ${bldg.level}</h3>
    <p>Target: ${sol.name} — ${sol.inhospitable ? 'INHOSPITABLE' : 'TERRAFORMED'}</p>
    <div class="tf-prog-bar"><div style="width:${pct}%;height:100%;background:#30c060"></div></div>
    <p>${pct}% complete</p>
    <p>Metal: ${fmt(tf.metalShipped)}/5000 | Food: ${fmt(tf.foodShipped)}/3000 | Research: ${fmt(tf.researchShipped)}/1000</p>
    <button onclick="sendTerraformingResources(${solarIdx},'metal',500)">+500 Metal</button>
    <button onclick="sendTerraformingResources(${solarIdx},'food',200)">+200 Food</button>
    <button onclick="sendTerraformingResources(${solarIdx},'research',100)">+100 Research</button>
    <button onclick="toggleTerraformer(${solarIdx})">${active ? 'DEACTIVATE' : 'ACTIVATE'} AUTO-DRAIN</button>
  </div>`;
}

function toggleTerraformer(solarIdx) {
  if (!state.terraforming[solarIdx]) state.terraforming[solarIdx] = {active:false, metalShipped:0, foodShipped:0, researchShipped:0};
  state.terraforming[solarIdx].active = !state.terraforming[solarIdx].active;
  if (state.selBldg) renderBuildingDetail(state.selBldg, state.selCont);
}

function _terraformingTick() {
  Object.keys(state.terraforming).forEach(idxStr => {
    const tf = state.terraforming[idxStr];
    if (!tf || !tf.active) return;
    const sol = state.solar[parseInt(idxStr)];
    if (!sol || !sol.inhospitable) return;
    state.res.metal = Math.max(0, (state.res.metal || 0) - 50);
    state.res.food  = Math.max(0, (state.res.food  || 0) - 30);
    tf.metalShipped    += 50;
    tf.foodShipped     += 30;
    const prog = getTerraformingProgress(parseInt(idxStr));
    if (prog >= 1.0) {
      sol.inhospitable = false;
      tf.active = false;
      toast('// TERRAFORMING COMPLETE: ' + sol.name + ' //');
    }
  });
}

function getDefenseGridDetailHTML(bldg) {
  const intercept = (1 - Math.pow(0.6, bldg.level)) * 100;
  const threatRed  = 10 * bldg.level;
  return `<div class="dg-detail">
    <h3>Defense Grid — Level ${bldg.level}</h3>
    <p>Interception Chance: ${intercept.toFixed(1)}%</p>
    <p>Adjacent Threat Reduction: ${threatRed}%</p>
    <p>Higher levels stack multiplicatively for interception.</p>
  </div>`;
}

function _counterAttackTick() {
  const continents = state.planet.continents;
  const conquered  = continents.filter(c => c.conquered);
  const unconquered = continents.filter(c => !c.conquered);
  if (conquered.length === 0 || unconquered.length === 0) return;
  const rng = mkRng(Date.now() & 0xffff);
  conquered.forEach(target => {
    if (rng() > 0.15) return;
    // compute interception
    let interceptChance = 0;
    const grids = target.bldgs.filter(b => b.type === 'defenseGrid' && b.built);
    if (grids.length > 0) {
      interceptChance = 1 - grids.reduce((prod, g) => prod * Math.pow(0.6, g.level), 1);
      interceptChance += getResearchBonus('defenseGridBonus') * 0.5;
    }
    if (rng() < interceptChance) {
      toast('// COUNTER-ATTACK INTERCEPTED //');
      return;
    }
    // apply damage
    const bldgs = target.bldgs.filter(b => b.built);
    if (bldgs.length > 0 && rng() > 0.5) {
      const victim = bldgs[Math.floor(rng() * bldgs.length)];
      victim.level = Math.max(1, victim.level - 1);
      toast('// COUNTER-ATTACK: ' + (BUILDING_DEFS[victim.type] ? BUILDING_DEFS[victim.type].name : victim.type) + ' DAMAGED //');
    } else {
      const types = ['infantry','tanks','cavalry'];
      const ut = types[Math.floor(rng() * types.length)];
      ['t1','t2','t3'].forEach(tier => {
        state.troops[ut][tier] = Math.floor((state.troops[ut][tier] || 0) * 0.95);
      });
      toast('// COUNTER-ATTACK: TROOP LOSSES //');
    }
  });
}

function startCounterAttackTimer() {
  setInterval(_counterAttackTick, 90000);
}

function drawPlanet(canvas, col, size, ring) {
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  canvas.width  = size;
  canvas.height = size;
  const cx = size / 2, cy = size / 2, r = size * 0.42;
  const [rc, gc, bc] = col || [100,100,150];
  const grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.05, cx, cy, r);
  grad.addColorStop(0, `rgb(${Math.min(255,rc+80)},${Math.min(255,gc+80)},${Math.min(255,bc+80)})`);
  grad.addColorStop(0.5, `rgb(${rc},${gc},${bc})`);
  grad.addColorStop(1, `rgb(${Math.floor(rc*0.3)},${Math.floor(gc*0.3)},${Math.floor(bc*0.3)})`);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  if (ring) {
    ctx.strokeStyle = `rgba(${rc},${gc},${bc},0.5)`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * 1.5, r * 0.3, Math.PI * 0.15, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function showSolarSystem() {
  const el = document.getElementById('solar-body');
  if (el) {
    let html = '<div class="solar-grid">';
    state.solar.forEach((sol, idx) => {
      const canColonize = spUnlocked() && !sol.colonized && !sol.inhospitable;
      const colonizeCost = 1000 + idx * 500;
      const tfProg = sol.inhospitable ? Math.floor(getTerraformingProgress(idx) * 100) : 100;
      html += `<div class="solar-card">
        <canvas id="planet-canvas-${idx}" width="80" height="80"></canvas>
        <div class="solar-info">
          <b>${sol.name}</b>${sol.isHome ? ' [HOME]' : ''}${sol.isAgri ? ' [AGRI]' : ''}<br>
          Status: ${sol.colonized ? 'COLONIZED' : 'UNCLAIMED'}<br>
          ${sol.inhospitable ? `Inhospitable — Terraform: ${tfProg}%` : ''}
          ${!sol.colonized && sol.inhospitable ? `<button onclick="sendTerraformingResources(${idx},'metal',500)">TF +500m</button>` : ''}
          ${canColonize ? `<button onclick="colonizePlanet(${idx})">COLONIZE (${colonizeCost} metal)</button>` : ''}
          ${sol.colonized && !sol.isHome ? '<span class="tag-col">Active</span>' : ''}
        </div>
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
    state.solar.forEach((sol, idx) => {
      const c = document.getElementById('planet-canvas-' + idx);
      if (c) drawPlanet(c, sol.col, 80, idx === 3);
    });
  }
  renderAllResBars();
  showScreen('solar');
}

function colonizePlanet(idx) {
  if (!spUnlocked()) { toast('// NEED 3 CONTINENTS + SPACEPORT //'); return; }
  const sol = state.solar[idx];
  if (!sol || sol.colonized) return;
  if (sol.inhospitable) { toast('// TERRAFORM FIRST //'); return; }
  const cost = 1000 + idx * 500;
  if ((state.res.metal || 0) < cost) { toast('// INSUFFICIENT METAL //'); return; }
  state.res.metal -= cost;
  sol.colonized = true;
  renderAllResBars();
  toast('// COLONIZED: ' + sol.name + ' //');
  showSolarSystem();
}

// ─── SECTION 11: HOME SCREEN & GLOBE VIEW ────────────────────────────────────

let _globeSelectedIdx  = -1;
let _globeTouchStartX  = 0;
let _globeTouchStartY  = 0;

function _genContPoly(seed, cx, cy, rx, ry, pts) {
  const rng = mkRng(strSeed(seed));
  const poly = [];
  for (let i = 0; i < pts; i++) {
    const angle = (i/pts)*Math.PI*2 - Math.PI/2;
    const jitter = 0.50 + rng()*0.95;
    const aOff = (rng()-0.5)*(Math.PI/pts)*0.8;
    poly.push([cx + Math.cos(angle+aOff)*rx*jitter, cy + Math.sin(angle+aOff)*ry*jitter]);
  }
  return poly;
}

function _getContLayouts(pcx, pcy, r) {
  return [
    {cx:pcx-r*0.38,cy:pcy-r*0.30,rx:r*0.28,ry:r*0.23,pts:14,seed:'cont0'},
    {cx:pcx+r*0.35,cy:pcy-r*0.28,rx:r*0.25,ry:r*0.22,pts:12,seed:'cont1'},
    {cx:pcx-r*0.10,cy:pcy+r*0.05,rx:r*0.32,ry:r*0.26,pts:16,seed:'cont2'},
    {cx:pcx-r*0.42,cy:pcy+r*0.38,rx:r*0.22,ry:r*0.20,pts:11,seed:'cont3'},
    {cx:pcx+r*0.38,cy:pcy+r*0.32,rx:r*0.26,ry:r*0.21,pts:13,seed:'cont4'},
  ];
}

function polyToSVGPath(pts) {
  if (pts.length < 3) return '';
  const n = pts.length;
  let d = '';
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
    if (i === 0) d += `M${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
    const cp1x = p1[0]+(p2[0]-p0[0])/6, cp1y = p1[1]+(p2[1]-p0[1])/6;
    const cp2x = p2[0]-(p3[0]-p1[0])/6, cp2y = p2[1]-(p3[1]-p1[1])/6;
    d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + 'Z';
}

function _genCloudPath(cx, cy, rx, ry, pts, seed) {
  const rng = mkRng(strSeed(seed));
  let d = '';
  for (let i = 0; i < pts; i++) {
    const a = (i/pts)*Math.PI*2;
    const j = 0.4 + rng()*1.1;
    const x = (cx + Math.cos(a)*rx*j).toFixed(1);
    const y = (cy + Math.sin(a)*ry*j).toFixed(1);
    d += (i===0 ? `M${x},${y}` : ` L${x},${y}`);
  }
  return d + 'Z';
}

function renderHome() {
  renderAllResBars();
  const spPanel = document.getElementById('sp-locked');
  if (spPanel) spPanel.style.display = spUnlocked() ? 'none' : 'block';
  requestAnimationFrame(renderGlobeView);
}

function renderGlobeView() {
  const list = document.getElementById('continent-list');
  if (!list) return;

  const W = Math.max(list.offsetWidth || window.innerWidth || 375, 280);
  const H = Math.floor(W * 1.4);
  const pr = Math.floor(W * 0.42);
  const pcx = Math.floor(W / 2);
  const pcy = Math.floor(pr + W * 0.06);

  const layouts = _getContLayouts(pcx, pcy, pr);
  const polys = layouts.map((l, i) =>
    _genContPoly(l.seed + state.planet.continents[i].name, l.cx, l.cy, l.rx, l.ry, l.pts)
  );

  // --- stars ---
  const rng = mkRng(42);
  let stars = '';
  for (let i = 0; i < 70; i++) {
    const x=(rng()*W).toFixed(1), y=(rng()*H).toFixed(1);
    const r=(0.5+rng()*1.8).toFixed(1);
    const op=(0.3+rng()*0.65).toFixed(2);
    stars += `<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(255,255,240,${op})"/>`;
  }

  // --- continent paths ---
  let contPaths = '', contLabels = '';
  state.planet.continents.forEach((cont, i) => {
    const ec = EARTH_COLORS[i % EARTH_COLORS.length];
    const isSel = i === _globeSelectedIdx;
    const isConq = cont.conquered;
    const d = polyToSVGPath(polys[i]);
    const fill = isConq ? ec.land : ec.shadow;
    const stroke = isConq ? '#d4a832' : 'rgba(0,0,0,0.5)';
    const sw = isSel ? 3 : isConq ? 1.5 : 0.8;
    const filterAttr = isSel ? 'filter="url(#sel-glow)"' : '';
    const pts = polys[i];
    const cx = (pts.reduce((s,p)=>s+p[0],0)/pts.length).toFixed(1);
    const cy = (pts.reduce((s,p)=>s+p[1],0)/pts.length).toFixed(1);
    contPaths += `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${filterAttr} data-cont-idx="${i}" style="cursor:pointer"/>`;
    const labelColor = isConq ? '#ffe066' : 'rgba(255,255,255,0.7)';
    contLabels += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="${labelColor}" font-size="8" font-weight="900" font-family="monospace" letter-spacing="1" style="pointer-events:none">${cont.name.toUpperCase()}</text>`;
    if (isConq) contLabels += `<text x="${cx}" y="${(parseFloat(cy)+10).toFixed(1)}" text-anchor="middle" fill="#d4a832" font-size="6" font-family="monospace" style="pointer-events:none">✓SECURED</text>`;
  });

  // --- clouds ---
  const crng = mkRng(99);
  let clouds = '';
  for (let i = 0; i < 5; i++) {
    const cx = pcx + (crng()-0.5)*pr*1.4;
    const cy = pcy + (crng()-0.5)*pr*1.2;
    const rx = pr*(0.08+crng()*0.14), ry = pr*(0.04+crng()*0.08);
    const cd = _genCloudPath(cx, cy, rx, ry, 8, 'cloud'+i);
    clouds += `<path d="${cd}" fill="rgba(255,255,255,0.50)" style="pointer-events:none"/>`;
  }

  // --- conquest pips ---
  const conqN = state.planet.continents.filter(c=>c.conquered).length;
  const pips = Array.from({length:5},(_,i)=>i<conqN?'◆':'◇').join(' ');
  const footY = pcy + pr + 18;

  list.innerHTML = `<div id="globe-view" style="position:relative;width:${W}px;height:${H}px;background:radial-gradient(ellipse at 50% 42%,#0a1428,#04080f 65%,#010204);overflow:hidden;touch-action:manipulation">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="position:absolute;inset:0;pointer-events:none">
<defs>
  <radialGradient id="ocean-rg" cx="38%" cy="35%" r="70%">
    <stop offset="0%" stop-color="#1a5090"/>
    <stop offset="50%" stop-color="#0d3b6e"/>
    <stop offset="100%" stop-color="#061828"/>
  </radialGradient>
  <radialGradient id="atm-rg" cx="50%" cy="50%" r="50%">
    <stop offset="85%" stop-color="rgba(0,0,0,0)"/>
    <stop offset="100%" stop-color="rgba(60,120,255,0.22)"/>
  </radialGradient>
  <filter id="sel-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="planet-clip"><circle cx="${pcx}" cy="${pcy}" r="${pr}"/></clipPath>
</defs>
<!-- stars -->
${stars}
<!-- atmosphere outer glow -->
<circle cx="${pcx}" cy="${pcy}" r="${pr+14}" fill="url(#atm-rg)" style="pointer-events:none"/>
<!-- atmosphere ring -->
<circle cx="${pcx}" cy="${pcy}" r="${pr+8}" fill="none" stroke="rgba(80,160,255,0.20)" stroke-width="12"/>
<!-- ocean disk -->
<circle cx="${pcx}" cy="${pcy}" r="${pr}" fill="url(#ocean-rg)"/>
<!-- landmasses + clouds clipped to planet -->
<g clip-path="url(#planet-clip)" style="pointer-events:all">
${contPaths}
${clouds}
${contLabels}
</g>
<!-- limb darkening -->
<circle cx="${pcx}" cy="${pcy}" r="${pr}" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="${Math.floor(pr*0.08)}"/>
<!-- border -->
<circle cx="${pcx}" cy="${pcy}" r="${pr}" fill="none" stroke="rgba(100,180,255,0.35)" stroke-width="1.5"/>
</svg>
<!-- planet name + pips -->
<div style="position:absolute;left:0;top:${footY}px;width:100%;text-align:center;font-family:monospace;pointer-events:none">
  <div style="font-size:13px;font-weight:900;letter-spacing:3px;color:#80b8ff;text-shadow:0 0 12px rgba(80,160,255,0.6)">${state.planet.name.toUpperCase()}</div>
  <div style="font-size:11px;color:#c8a020;margin-top:4px;letter-spacing:2px">${pips}</div>
  <div style="font-size:9px;color:rgba(255,255,255,0.28);margin-top:8px;letter-spacing:1px">${_globeSelectedIdx>=0?'TAP AGAIN TO ENTER · SWIPE TO CYCLE':'TAP A CONTINENT TO SELECT'}</div>
</div>
</div>`;

  // attach handlers
  const globeEl = document.getElementById('globe-view');
  if (!globeEl) return;
  globeEl.addEventListener('click', e => {
    const t = e.target.closest('[data-cont-idx]');
    if (t) {
      const idx = parseInt(t.getAttribute('data-cont-idx'));
      if (idx === _globeSelectedIdx) { openContinent(idx); }
      else { _globeSelectedIdx = idx; state.selCont = idx; renderGlobeView(); }
      return;
    }
    if (_globeSelectedIdx >= 0) { _globeSelectedIdx = -1; renderGlobeView(); }
  });
  globeEl.addEventListener('touchstart', e => {
    _globeTouchStartX = e.touches[0].clientX;
    _globeTouchStartY = e.touches[0].clientY;
  }, {passive:true});
  globeEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - _globeTouchStartX;
    const dy = e.changedTouches[0].clientY - _globeTouchStartY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      const dir = dx < 0 ? 1 : -1;
      _globeSelectedIdx = ((_globeSelectedIdx < 0 ? 0 : _globeSelectedIdx) + dir + 5) % 5;
      state.selCont = _globeSelectedIdx;
      renderGlobeView();
    }
  }, {passive:true});
}

function refreshGlobeView() {
  if (document.getElementById('continent-list')) renderGlobeView();
}

// ─── SECTION 12: PIXI OVERLAY (optional, non-blocking) ───────────────────────

function initPixi() {
  if (typeof PIXI === 'undefined') return;
  const canvasEl = document.getElementById('pixi-canvas');
  if (!canvasEl) return;
  const app = new PIXI.Application();
  app.init({
    view: canvasEl,
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundAlpha: 0,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
  }).then(() => {
    const W = app.screen.width;
    const H = app.screen.height;

    // ── Nebula dust layer ──
    const dustLayer = new PIXI.Container();
    app.stage.addChild(dustLayer);
    const dustRng = mkRng(777);
    const dusts = [];
    for (let i = 0; i < 200; i++) {
      const g = new PIXI.Graphics();
      const r = 0.5 + dustRng() * 1.5;
      g.circle(0, 0, r);
      g.fill({color: 0xffffff, alpha: 0.3 + dustRng() * 0.4});
      g.x = dustRng() * W;
      g.y = dustRng() * H;
      const speed = 0.002 + dustRng() * 0.01;
      const phase = dustRng() * Math.PI * 2;
      dusts.push({g, speed, phase});
      dustLayer.addChild(g);
    }

    // ── CRT scanlines layer ──
    const scanLayer = new PIXI.Graphics();
    app.stage.addChild(scanLayer);
    for (let y = 0; y < H; y += 4) {
      scanLayer.rect(0, y, W, 1);
    }
    scanLayer.fill({color: 0x000000, alpha: 0.08});

    // ── Vignette layer ──
    const vigLayer = new PIXI.Graphics();
    const vigGrad = new PIXI.FillGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    vigGrad.addColorStop(0, 0x000000);
    vigGrad.addColorStop(0.65, 0x000000);
    vigGrad.addColorStop(1, 0x000000);
    vigLayer.circle(W / 2, H / 2, Math.max(W, H) * 0.7);
    vigLayer.fill({fill: vigGrad, alpha: 0.35});
    app.stage.addChild(vigLayer);

    // ── Ticker ──
    let tick = 0;
    app.ticker.add(() => {
      tick++;
      dusts.forEach(d => {
        d.g.alpha = 0.15 + 0.25 * Math.sin(tick * d.speed + d.phase);
        d.g.x += d.speed * 0.5;
        if (d.g.x > W) d.g.x = 0;
      });
      // Adjust vignette intensity based on active screen
      const activeScreen = document.querySelector('.screen.active');
      const screenId = activeScreen ? activeScreen.id : '';
      const vigAlpha = screenId === 'screen-invasion' ? 0.60 : 0.35;
      vigLayer.alpha = vigAlpha;
      const scanAlpha = (screenId === 'screen-continent' || screenId === 'screen-building') ? 0.12 : 0.05;
      scanLayer.alpha = scanAlpha;
    });
  }).catch(() => { /* Pixi unavailable — silent fail */ });
}

// ─── SECTION 13: INIT BLOCK ──────────────────────────────────────────────────

// Boot economy
initResearchV2();

// Render home screen
renderHome();

// Setup continent map click handler (delayed to ensure DOM is ready)
setTimeout(setupMapClick, 0);

// Start production + upkeep tick (combined)
setInterval(() => {
  productionTick();
  applyUpkeep();
  _terraformingTick();
  // refresh continent map if visible
  const activeScreen = document.querySelector('.screen.active');
  if (activeScreen && activeScreen.id === 'screen-continent') refreshContMap();
}, 3000);

// Fleet build tick
initFleet();
startShipBuildInterval();

// Counter-attack timer
startCounterAttackTimer();

// PixiJS (non-blocking, fails gracefully if PIXI not loaded)
if (typeof PIXI !== 'undefined') initPixi();

// ─── SAVE / LOAD / TITLE SCREEN ──────────────────────────────────────────────

function serializeState() {
  return JSON.stringify(state, (k, v) => v instanceof Set ? {__set: Array.from(v)} : v);
}

function deserializeState(json) {
  return JSON.parse(json, (k, v) => (v && typeof v === 'object' && Array.isArray(v.__set)) ? new Set(v.__set) : v);
}

function hasSave() { return !!localStorage.getItem('lg_save'); }

function saveGame() {
  try {
    localStorage.setItem('lg_save', serializeState());
    localStorage.setItem('lg_save_time', Date.now().toString());
    return true;
  } catch (e) { return false; }
}

function loadGame() {
  const raw = localStorage.getItem('lg_save');
  if (!raw) return false;
  try {
    const loaded = deserializeState(raw);
    Object.keys(state).forEach(k => delete state[k]);
    Object.assign(state, loaded);
    return true;
  } catch (e) { return false; }
}

function manualSaveGame() {
  toast(saveGame() ? '// GAME SAVED //' : '// SAVE FAILED //');
}

function isInGame() {
  const t = document.getElementById('screen-title');
  return !t || !t.classList.contains('active');
}

function startNewGame() {
  if (hasSave() && !confirm('Starting a new campaign will erase your saved progress. Continue?')) return;
  localStorage.removeItem('lg_save');
  localStorage.removeItem('lg_save_time');
  showScreen('home');
  renderHome();
  toast('// NEW CAMPAIGN STARTED //');
}

function continueGame() {
  if (loadGame()) {
    showScreen('home');
    applyResearchEffects();
    renderHome();
    toast('// GAME LOADED //');
  } else {
    toast('// NO SAVE FOUND //');
  }
}

function renderTitleScreen() {
  const btn = document.getElementById('title-continue-btn');
  const sub = document.getElementById('title-continue-sub');
  if (!btn) return;
  if (hasSave()) {
    btn.style.display = 'block';
    const t = parseInt(localStorage.getItem('lg_save_time') || '0', 10);
    if (sub) sub.textContent = t ? 'Last saved: ' + new Date(t).toLocaleString() : '';
  } else {
    btn.style.display = 'none';
    if (sub) sub.textContent = '';
  }
}

renderTitleScreen();

// Autosave every 30s while in-game, and on tab close
setInterval(() => { if (isInGame()) saveGame(); }, 30000);
window.addEventListener('beforeunload', () => { if (isInGame()) saveGame(); });

// ─── DEVELOPER MODE ──────────────────────────────────────────────────────────

state._devMode = localStorage.getItem('lg_dev') === '1' ||
  new URLSearchParams(location.search).get('dev') === '1';
if (state._devMode) localStorage.setItem('lg_dev', '1');

function toggleDevMode() {
  state._devMode = !state._devMode;
  localStorage.setItem('lg_dev', state._devMode ? '1' : '0');
  renderDevButton();
  if (state._devMode) toast('// DEV MODE ON //'); else { toast('// DEV MODE OFF //'); closeModal(); }
}

function renderDevButton() {
  let btn = document.getElementById('dev-toggle-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'dev-toggle-btn';
    btn.className = 'back-btn';
    btn.style.cssText = 'position:fixed;bottom:6px;left:6px;z-index:9999;font-size:9px;opacity:0.5;padding:4px 8px';
    btn.onclick = () => state._devMode ? openDevPanel() : null;
    btn.ondblclick = (e) => { e.stopPropagation(); toggleDevMode(); };
    document.body.appendChild(btn);
  }
  btn.textContent = state._devMode ? '🔧 DEV' : '🔧';
  btn.title = state._devMode ? 'Tap: dev panel · Double-tap: turn off' : 'Double-tap: enable dev mode';
  btn.style.background = state._devMode ? 'var(--gold)' : 'var(--plate2)';
  btn.style.color = state._devMode ? '#000' : 'var(--muted)';
}

function devGiveResources() {
  Object.keys(state.res).forEach(k => state.res[k] = (state.res[k] || 0) + 50000);
  renderAllResBars();
  toast('// +50,000 ALL RESOURCES //');
}

function devInstantBuilds() {
  let n = 0;
  state.planet.continents.forEach(c => c.bldgs.forEach(b => {
    if (!b.built) { b.built = true; b.buildEnd = null; n++; }
  }));
  if (state.fleet && state.fleet.buildQueue) {
    state.fleet.buildQueue.forEach(s => { s.buildEnd = Date.now(); n++; });
  }
  if (typeof refreshContMap === 'function') refreshContMap();
  toast(`// ${n} BUILD(S)/SHIP(S) COMPLETED //`);
}

function devUnlockResearch() {
  Object.values(RESEARCH_TREE).forEach(item => state.researchV2.add(item.id));
  applyResearchEffects();
  toast('// ALL RESEARCH UNLOCKED //');
}

function devConquerAll() {
  state.planet.continents.forEach((c, i) => {
    if (!c.conquered) {
      c.conquered = true;
      c.aliens = null;
      if (!c.bldgs.some(b => b.type === 'colonyCenter')) {
        c.bldgs.push({_uid: state._uid++, type:'colonyCenter', col:0, row:0, level:1, built:true, buildEnd:null});
      }
    }
  });
  renderHome();
  toast('// ALL CONTINENTS CONQUERED //');
}

function devMaxTroops() {
  Object.keys(state.troops).forEach(unit => {
    Object.keys(state.troops[unit]).forEach(tier => { state.troops[unit][tier] = 9999; });
  });
  renderAllResBars();
  toast('// TROOPS MAXED //');
}

function devResetGame() {
  if (!confirm('Reset all game progress? This cannot be undone.')) return;
  localStorage.removeItem('lg_save');
  localStorage.removeItem('lg_dev');
  location.reload();
}

function openDevPanel() {
  const html = `
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px">
        // CHEATS — FOR TESTING ONLY //
      </div>
      <button class="back-btn" onclick="devGiveResources()">+50,000 ALL RESOURCES</button>
      <button class="back-btn" onclick="devInstantBuilds()">INSTANT-COMPLETE BUILDS &amp; SHIPS</button>
      <button class="back-btn" onclick="devUnlockResearch()">UNLOCK ALL RESEARCH</button>
      <button class="back-btn" onclick="devConquerAll()">CONQUER ALL CONTINENTS</button>
      <button class="back-btn" onclick="devMaxTroops()">MAX ALL TROOPS</button>
      <div style="border-top:1px solid var(--edge);margin:6px 0"></div>
      <button class="back-btn" style="color:var(--blood)" onclick="devResetGame()">RESET GAME PROGRESS</button>
      <button class="back-btn" onclick="toggleDevMode()">TURN OFF DEV MODE</button>
    </div>`;
  openModal('// DEVELOPER MODE //', html);
}

renderDevButton();


</script>
