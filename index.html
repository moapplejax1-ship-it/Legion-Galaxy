<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Legion Galaxy</title>
<style>
:root{
  --bg:#0b0d08;--plate:#1c2014;--plate2:#242b18;--edge:#3a4228;
  --rust:#c87428;--mil:#5a8a3c;--blood:#c03010;--steel:#7a8470;
  --text:#c8c4b0;--muted:#6a6858;--warn:#d44400;--gold:#d4a832;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:'Courier New',monospace;color:var(--text)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px)}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;width:100%;height:100%;overflow:hidden;
  display:flex;flex-direction:column;max-width:540px;margin:0 auto}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}
.screen-body{flex:1;overflow-y:auto;padding:10px 12px 28px}
.screen-body::-webkit-scrollbar{width:4px}
.screen-body::-webkit-scrollbar-thumb{background:var(--rust);border-radius:2px}
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 7px;flex-shrink:0;position:relative;
  background:linear-gradient(180deg,#1e2314,#141810);
  border-bottom:2px solid var(--edge);box-shadow:0 2px 14px rgba(0,0,0,0.9)}
.topbar-title{font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
  color:var(--rust);text-shadow:0 0 10px rgba(200,116,40,0.55)}
.back-btn{background:var(--plate);border:1px solid var(--edge);color:var(--steel);
  padding:4px 10px;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1px;
  font-family:inherit;text-transform:uppercase;
  clip-path:polygon(6px 0%,100% 0%,100% 100%,0% 100%,0% 6px)}
.back-btn:hover{background:var(--plate2);color:var(--text);border-color:var(--rust)}
.resource-bar{display:flex;gap:5px;overflow-x:auto;padding:5px 10px;
  background:#0f1209;border-bottom:1px solid var(--edge);flex-shrink:0}
.resource-bar::-webkit-scrollbar{display:none}
.res-badge{display:flex;align-items:center;gap:4px;background:var(--plate);
  border:1px solid var(--edge);padding:3px 8px;white-space:nowrap;font-size:11px;font-weight:700;
  clip-path:polygon(5px 0%,100% 0%,100% 100%,0% 100%,0% 5px)}
.panel{background:var(--plate);
  border-top:1px solid #4a5535;border-left:1px solid #4a5535;
  border-right:1px solid #1a1e10;border-bottom:2px solid #0d0f08;
  padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.panel::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent,transparent 14px,rgba(255,255,255,0.012) 14px,rgba(255,255,255,0.012) 15px)}
.panel.rust{border-top-color:var(--rust);box-shadow:0 0 10px rgba(200,116,40,0.18)}
.panel.mil{border-top-color:var(--mil);box-shadow:0 0 10px rgba(90,138,60,0.18)}
.panel.blood{border-top-color:var(--blood);box-shadow:0 0 10px rgba(192,48,16,0.2)}
.panel.gold{border-top-color:var(--gold);box-shadow:0 0 10px rgba(212,168,50,0.2)}
.panel.steel{border-top-color:var(--steel)}
.gal-btn{display:inline-block;background:none;border:none;cursor:pointer;padding:0;font-family:inherit}
.gal-btn-inner{display:inline-flex;align-items:center;justify-content:center;
  padding:9px 18px;font-size:12px;font-weight:900;letter-spacing:2px;
  text-transform:uppercase;color:var(--text);
  clip-path:polygon(8px 0%,100% 0%,100% calc(100% - 8px),calc(100% - 8px) 100%,0% 100%,0% 8px)}
.gal-btn.rust .gal-btn-inner{background:linear-gradient(160deg,rgba(200,116,40,0.55),rgba(200,116,40,0.18));
  outline:1.5px solid var(--rust);text-shadow:0 0 6px rgba(200,116,40,0.8)}
.gal-btn.mil .gal-btn-inner{background:linear-gradient(160deg,rgba(90,138,60,0.55),rgba(90,138,60,0.18));
  outline:1.5px solid var(--mil);text-shadow:0 0 6px rgba(90,138,60,0.8)}
.gal-btn.blood .gal-btn-inner{background:linear-gradient(160deg,rgba(192,48,16,0.65),rgba(192,48,16,0.2));
  outline:1.5px solid var(--blood);text-shadow:0 0 6px rgba(192,48,16,0.8)}
.gal-btn.gold .gal-btn-inner{background:linear-gradient(160deg,rgba(212,168,50,0.65),rgba(212,168,50,0.2));
  outline:1.5px solid var(--gold);text-shadow:0 0 6px rgba(212,168,50,0.8)}
.gal-btn.steel .gal-btn-inner{background:linear-gradient(160deg,rgba(122,132,112,0.4),rgba(122,132,112,0.1));
  outline:1.5px solid var(--steel)}
.gal-btn:active .gal-btn-inner{filter:brightness(1.5)}
/* ── Troop bar at top of screens ── */
.troop-bar{display:flex;gap:5px;overflow-x:auto;padding:5px 10px;
  background:#0d1008;border-bottom:1px solid var(--edge);flex-shrink:0}
.troop-bar::-webkit-scrollbar{display:none}
.troop-badge{display:flex;align-items:center;gap:4px;background:rgba(20,24,14,0.9);
  border:1px solid var(--edge);padding:3px 8px;white-space:nowrap;font-size:11px;font-weight:700;
  clip-path:polygon(5px 0%,100% 0%,100% 100%,0% 100%,0% 5px)}
/* ── Training card ── */
.train-card{display:flex;align-items:center;gap:10px;padding:10px;
  background:var(--plate2);border-top:1px solid var(--edge);border-bottom:1px solid #0d0f08;
  margin-bottom:6px}
.train-icon{font-size:26px;width:36px;text-align:center;flex-shrink:0}
.train-info{flex:1}
.train-name{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.train-role{font-size:10px;color:var(--muted);margin-top:1px}
.train-cost{font-size:10px;color:var(--rust);margin-top:3px}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-btn{background:var(--plate);border:1px solid var(--edge);color:var(--text);
  width:26px;height:26px;font-size:16px;line-height:1;font-weight:900;cursor:pointer;
  font-family:inherit;text-align:center}
.qty-btn:hover{border-color:var(--rust);color:var(--rust)}
.qty-val{font-size:14px;font-weight:900;min-width:30px;text-align:center;color:var(--gold)}
/* ── Invasion / battle layout ── */
#invasion-map-wrap{width:100%;flex-shrink:0;border-bottom:1px solid var(--edge)}
#invasion-map{display:block;width:100%}
.lane-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;
  padding:8px 10px;background:#0d100a;border-bottom:1px solid var(--edge);flex-shrink:0}
.lane-col{background:var(--plate);border-top:2px solid var(--edge);padding:6px;text-align:center}
.lane-col.left{border-top-color:var(--mil)}
.lane-col.center{border-top-color:var(--rust)}
.lane-col.right{border-top-color:var(--mil)}
.lane-label{font-size:9px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.lane-enemy{font-size:10px;color:var(--blood);margin-bottom:6px;line-height:1.5}
.lane-unit-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:4px}
.lane-unit-icon{font-size:13px}
.lane-unit-type{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;flex:1;text-align:left}
.lane-qty-ctrl{display:flex;align-items:center;gap:3px}
.lqb{background:var(--plate2);border:1px solid var(--edge);color:var(--text);
  width:20px;height:20px;font-size:13px;line-height:1;cursor:pointer;font-family:inherit;text-align:center}
.lqb:hover{border-color:var(--rust);color:var(--rust)}
.lqv{font-size:12px;font-weight:900;min-width:22px;text-align:center;color:var(--gold)}
.lane-strength{font-size:9px;margin-top:4px;letter-spacing:1px}
/* ── Battle log ── */
.battle-log{font-size:11px;line-height:1.8;color:var(--muted);max-height:160px;overflow-y:auto;padding:4px}
.battle-log .hit{color:var(--blood)}
.battle-log .victory{color:var(--mil);font-weight:900}
.battle-log .defeat{color:var(--blood);font-weight:900}
.battle-log .phase{color:var(--rust);font-weight:900}
/* ── Misc ── */
.sec-label{font-size:10px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
  color:var(--rust);margin-bottom:8px;border-left:3px solid var(--rust);padding-left:8px}
.roster-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--edge)}
.roster-row:last-child{border-bottom:none}
.prog-wrap{background:rgba(255,255,255,0.06);height:5px;margin-top:5px;overflow:hidden}
.prog-fill{height:100%;transition:width 0.5s ease}
.small-muted{font-size:12px;color:var(--muted);line-height:1.6}
.build-item{display:flex;align-items:center;gap:10px;padding:10px;
  background:var(--plate2);border-top:1px solid var(--edge);border-bottom:1px solid #0d0f08;margin-bottom:6px;cursor:pointer}
.bi-name{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.bi-cost{font-size:10px;color:var(--rust);margin-top:2px}
.conquest-pips{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.pip{width:13px;height:13px;clip-path:polygon(3px 0%,100% 0%,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.pip.done{background:var(--mil)}.pip.empty{background:#1a1c14;border:1px solid var(--edge)}
#continent-map-wrap{position:relative;width:100%;flex-shrink:0;border-bottom:2px solid var(--edge)}
#continent-map{display:block;width:100%;cursor:pointer}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);
  z-index:200;align-items:flex-end;justify-content:center}
#modal-overlay.open{display:flex}
#modal-box{background:#141810;border-top:2px solid var(--rust);border-left:1px solid var(--edge);
  border-right:1px solid var(--edge);padding:18px;width:100%;max-width:540px;
  max-height:78vh;overflow-y:auto;box-shadow:0 -4px 30px rgba(0,0,0,0.95)}
#modal-box::before{content:'';display:block;width:36px;height:3px;background:var(--rust);margin:0 auto 12px;opacity:.8}
#modal-title{font-size:15px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--rust);margin-bottom:12px}
.planet-wrap{display:flex;justify-content:center;padding:12px 0 6px}
.center{text-align:center}.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.glow-rust{color:var(--rust);text-shadow:0 0 6px rgba(200,116,40,0.6)}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--rust);
  color:#0b0d08;padding:7px 18px;font-weight:900;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .3s;z-index:999;
  clip-path:polygon(8px 0%,100% 0%,100% 100%,0% 100%,0% 8px)}
#placing-banner{display:none;position:absolute;top:4px;left:50%;transform:translateX(-50%);
  background:rgba(212,168,50,0.92);color:#0b0d08;padding:4px 14px;font-size:10px;font-weight:900;
  letter-spacing:2px;z-index:10;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div id="app">

  <!-- ═══ HOME ═══ -->
  <div id="screen-home" class="screen active">
    <div class="topbar">
      <span class="topbar-title">☠ Legion Galaxy</span>
      <div style="display:flex;gap:6px">
        <button class="back-btn" onclick="openTroops()">🪖 Troops</button>
        <button class="back-btn" onclick="showSolarSystem()">⚡ System</button>
      </div>
    </div>
    <div class="resource-bar" id="res-home"></div>
    <div class="screen-body">
      <div class="planet-wrap"><canvas id="home-planet" width="140" height="140"></canvas></div>
      <div class="center mb8">
        <div id="planet-name-lbl" style="font-size:20px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:var(--rust);text-shadow:0 0 10px rgba(200,116,40,0.5)"></div>
        <div class="conquest-pips mt8" id="conquest-pips"></div>
        <div id="conquest-lbl" style="font-size:11px;color:var(--muted);letter-spacing:1px"></div>
      </div>
      <div class="sec-label">Continents</div>
      <div id="continent-list"></div>
      <div id="sp-locked" class="panel blood" style="display:none;font-size:12px;color:var(--muted);line-height:1.6"></div>
    </div>
  </div>

  <!-- ═══ TROOPS ═══ -->
  <div id="screen-troops" class="screen">
    <div class="topbar">
      <button class="back-btn" id="troops-back">← Back</button>
      <span class="topbar-title">🪖 Barracks</span>
      <span></span>
    </div>
    <div class="resource-bar" id="res-troops"></div>
    <div class="screen-body" id="troops-body"></div>
  </div>

  <!-- ═══ CONTINENT ═══ -->
  <div id="screen-continent" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← Base</button>
      <span class="topbar-title" id="cont-title" style="font-size:12px"></span>
      <span id="cont-status" style="font-size:10px;color:var(--muted);letter-spacing:1px"></span>
    </div>
    <div class="resource-bar" id="res-cont"></div>
    <div id="continent-map-wrap" style="position:relative">
      <canvas id="continent-map"></canvas>
      <div id="placing-banner">TAP GRID TO PLACE</div>
    </div>
    <div class="screen-body" id="cont-body" style="padding-top:8px"></div>
  </div>

  <!-- ═══ BUILDING DETAIL ═══ -->
  <div id="screen-building" class="screen">
    <div class="topbar">
      <button class="back-btn" id="bld-back">← Continent</button>
      <span class="topbar-title" id="bld-title" style="font-size:12px"></span>
      <span></span>
    </div>
    <div class="screen-body" id="bld-body"></div>
  </div>

  <!-- ═══ INVASION ═══ -->
  <div id="screen-invasion" class="screen">
    <div class="topbar">
      <button class="back-btn" id="inv-back">← Retreat</button>
      <span class="topbar-title" style="color:var(--blood)" id="inv-title">⚔ INVASION</span>
      <span id="inv-phase" style="font-size:10px;color:var(--muted);letter-spacing:1px"></span>
    </div>
    <div class="troop-bar" id="troop-bar-inv"></div>
    <div id="invasion-map-wrap"><canvas id="invasion-map"></canvas></div>
    <div class="lane-grid" id="lane-grid"></div>
    <div class="screen-body" id="inv-body" style="padding-top:8px"></div>
  </div>

  <!-- ═══ SOLAR ═══ -->
  <div id="screen-solar" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← Base</button>
      <span class="topbar-title" style="color:var(--mil)">⬡ Korath System</span>
      <span></span>
    </div>
    <div class="screen-body" id="solar-body"></div>
  </div>

</div>

<div id="modal-overlay" onclick="closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="mt12 center">
      <button class="gal-btn rust" onclick="closeModal()"><div class="gal-btn-inner">Close</div></button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
//  SEEDED RNG
// ─────────────────────────────────────────────
function mkRng(seed){
  let s=((seed|0)+6364136223846793005)&0xffffffff;
  return()=>{s=(Math.imul(s,1664525)+1013904223)&0xffffffff;return(s>>>0)/4294967296;};
}
function strSeed(str){let h=0;for(let i=0;i<str.length;i++)h=Math.imul(31,h)+str.charCodeAt(i)|0;return h;}

// ─────────────────────────────────────────────
//  DATA MODEL
// ─────────────────────────────────────────────
const BUILDINGS={
  colonyCenter:      {name:'Colony Center',       short:'COLONY',    icon:'🏛️',summary:'Command hub. Gates the max upgrade level of every other structure.',prod:null},
  resourceCollector: {name:'Resource Collector',  short:'EXTRACTOR', icon:'⛏️',summary:'Mines construction materials. Each upgrade increases metal output.',prod:{res:'metal',base:15}},
  barracks:          {name:'Barracks',            short:'BARRACKS',  icon:'🪖',summary:'Trains Infantry, Tanks, and Cavalry from your Housing population.',prod:null},
  farm:              {name:'Farm',                short:'FARM',      icon:'🌾',summary:'Produces food rations to feed troops and sustain population growth.',prod:{res:'food',base:12}},
  house:             {name:'Housing Block',       short:'HOUSING',   icon:'🏚️',summary:'Shelters colonists. Increases max population capacity per level.',prod:{res:'pop',base:5}},
  researchCenter:    {name:'Research Center',     short:'RESEARCH',  icon:'⚛️',summary:'Drives technology: hull plating, weapon systems, and thruster drives.',prod:{res:'research',base:3}},
  excellorantFactory:{name:'Excellorant Factory', short:'EXCELL.',   icon:'⚡',summary:'Synthesizes Excellorant — accelerates factories, barracks, farms and collectors.',prod:{res:'excellorant',base:1}},
  spaceport:         {name:'Spaceport',           short:'SPACEPORT', icon:'🚀',summary:'Constructs starships. Unlocked after securing 3 of 5 continents.',prod:null},
};
const COSTS={
  colonyCenter:      {metal:500, food:200},
  resourceCollector: {metal:300, food:100},
  barracks:          {metal:400, food:200},
  farm:              {metal:200, food:100},
  house:             {metal:350, food:150},
  researchCenter:    {metal:600, food:300},
  excellorantFactory:{metal:400, food:200},
  spaceport:         {metal:5000,food:2500},
};
// Building footprints: [w, h] in grid cells
const FOOTPRINTS={
  colonyCenter:      [2,2],
  resourceCollector: [2,2],
  barracks:          [2,2],
  farm:              [3,3],
  house:             [2,2],
  researchCenter:    [2,2],
  excellorantFactory:[2,1],
  spaceport:         [3,3],
};
const SLOT_ORDER=['colonyCenter','resourceCollector','barracks','farm','house','researchCenter','excellorantFactory','spaceport'];

// Grid constants
const GCOLS=10, GROWS=7, CELL=50;
const GRID_W=GCOLS*CELL; // 500
const GRID_H=GROWS*CELL; // 350

// Troop definitions
const TROOP_TYPES={
  infantry:{name:'Infantry', icon:'🪖',role:'All-purpose. Strong vs Cavalry.',
    cost:{metal:15,food:8,pop:2},atk:1.0,def:1.0,
    strong:'cavalry',weak:'tanks',color:'#5a8a3c'},
  tanks:   {name:'Tanks',    icon:'🛡️',role:'Armored. Strong vs Infantry.',
    cost:{metal:80,food:30,pop:5},atk:1.8,def:2.2,
    strong:'infantry',weak:'cavalry',color:'#c87428'},
  cavalry: {name:'Cavalry',  icon:'🐎',role:'Fast raiders. Strong vs Tanks.',
    cost:{metal:40,food:20,pop:3},atk:1.5,def:1.0,
    strong:'tanks',weak:'infantry',color:'#8888cc'},
};

// Ground troop research tree
const TROOP_RESEARCH=[
  {id:'infAtk1', name:'Combat Drills I',   unit:'infantry', stat:'atk',   bonus:0.20, cost:200, icon:'🪖', desc:'Infantry attack power +20%'},
  {id:'infAtk2', name:'Combat Drills II',  unit:'infantry', stat:'atk',   bonus:0.30, cost:350, icon:'🪖', desc:'Infantry attack power +30%'},
  {id:'infDef',  name:'Veteran Infantry',  unit:'infantry', stat:'def',   bonus:0.25, cost:300, icon:'🛡️', desc:'Infantry take 25% fewer casualties'},
  {id:'tnkDef',  name:'Reactive Armor',    unit:'tanks',    stat:'def',   bonus:0.25, cost:250, icon:'🔩', desc:'Tanks take 25% fewer casualties'},
  {id:'tnkAtk',  name:'Siege Cannon',      unit:'tanks',    stat:'atk',   bonus:0.20, cost:300, icon:'💥', desc:'Tank attack power +20%'},
  {id:'cavAtk',  name:'Mounted Raiders',   unit:'cavalry',  stat:'atk',   bonus:0.20, cost:200, icon:'🐎', desc:'Cavalry attack power +20%'},
  {id:'cavEvade',name:'Hit & Run',         unit:'cavalry',  stat:'evade', bonus:0.15, cost:350, icon:'💨', desc:'Cavalry take 15% fewer casualties'},
];
// Combat Drills II requires Combat Drills I
const TROOP_PREREQS={1:0};
const UNIT_PILL_COLORS={
  infantry:{bg:'rgba(90,138,60,0.25)',border:'#5a8a3c',text:'#7ab85a'},
  tanks:   {bg:'rgba(200,116,40,0.25)',border:'#c87428',text:'#e89448'},
  cavalry: {bg:'rgba(136,136,204,0.25)',border:'#8888cc',text:'#aaaaee'},
};

// ─────────────────────────────────────────────
//  TROOP TIER SYSTEM
// ─────────────────────────────────────────────
const TIER_ICONS={infantry:['🪖','⚔️','👑'],tanks:['🚗','🛡️','💀'],cavalry:['🐎','🗡️','🦅']};
const TIER_NAMES={infantry:['Soldier','Centurion','Praetorian'],tanks:['Scout Tank','Battle Tank','Siege Engine'],cavalry:['Rider','Lancer','Cataphract']};
const TIER_MULT=[1,2.0,4.5];

function getSquads(unitType,tier){const cnt=state.troops[unitType]['t'+tier]||0;const full=Math.floor(cnt/5);const rem=cnt%5;return{full,partial:rem>0?1:0,partialCount:rem};}

function getSquadDisplayHTML(unitType){
  let h='';
  for(let t=1;t<=3;t++){
    const sq=getSquads(unitType,t);
    const icon=TIER_ICONS[unitType][t-1],name=TIER_NAMES[unitType][t-1],cnt=state.troops[unitType]['t'+t]||0;
    let desc='<span style="color:var(--muted)">none</span>';
    if(sq.full>0||sq.partial>0){
      const parts=[];
      if(sq.full>0)parts.push(sq.full+' squad'+(sq.full>1?'s':''));
      if(sq.partial)parts.push('1 squad ('+sq.partialCount+')');
      desc=parts.join(' + ')+' <span style="color:var(--muted)">('+cnt+')</span>';
    }
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:11px">
      <span>${icon} T${t} ${name}</span><span>${desc}</span></div>`;
  }
  return h;
}

function upgradeTroops(unitType,fromTier,qty){
  const rec=UPGRADE_RECIPES[unitType][fromTier-1];
  const srcKey='t'+fromTier,dstKey='t'+(fromTier+1);
  const needed=rec.cost*qty;
  if((state.troops[unitType][srcKey]||0)<needed){toast('// NOT ENOUGH T'+fromTier+' '+unitType.toUpperCase()+' //');return;}
  state.troops[unitType][srcKey]-=needed;
  state.troops[unitType][dstKey]=(state.troops[unitType][dstKey]||0)+rec.gain*qty;
  toast('// UPGRADE COMPLETE //');
  renderTroopsBody();
}

function drawPlanet(canvas,[r,g,b],size,ring){
  const ctx=canvas.getContext('2d');canvas.width=size;canvas.height=size;
  const cx=size/2,cy=size/2,rad=size/2-3;
  const bg=ctx.createRadialGradient(cx,cy,rad*.5,cx,cy,rad*1.4);
  bg.addColorStop(0,'transparent');bg.addColorStop(1,`rgba(${r*.3|0},${g*.3|0},${b*.3|0},0.4)`);
  ctx.fillStyle=bg;ctx.fillRect(0,0,size,size);
  const sp=ctx.createRadialGradient(cx-rad*.4,cy-rad*.35,1,cx,cy,rad);
  sp.addColorStop(0,`rgba(${Math.min(255,r+90)},${Math.min(255,g+70)},${Math.min(255,b+50)},1)`);
  sp.addColorStop(.4,`rgba(${r},${g},${b},1)`);
  sp.addColorStop(.78,`rgba(${r*.35|0},${g*.3|0},${b*.25|0},1)`);
  sp.addColorStop(1,`rgba(${r*.08|0},${g*.06|0},${b*.05|0},1)`);
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();
  const seed2=r*7+g*13+b*3;
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.clip();
  for(let i=0;i<8;i++){
    const cx2=cx+Math.sin(seed2+i*1.3)*rad*.55,cy2=cy+Math.cos(seed2+i*.9)*rad*.5,
      cr=rad*(.04+Math.abs(Math.sin(seed2+i))*.1);
    const cg=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,cr);
    cg.addColorStop(0,'rgba(0,0,0,0.45)');cg.addColorStop(.6,'rgba(0,0,0,0.18)');cg.addColorStop(1,'transparent');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx2,cy2,cr,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  const term=ctx.createRadialGradient(cx+rad*.2,cy,rad*.1,cx+rad*.5,cy,rad*1.1);
  term.addColorStop(0,'transparent');term.addColorStop(.6,'transparent');term.addColorStop(1,'rgba(0,0,0,0.72)');
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=term;ctx.fill();
  if(ring){ctx.save();ctx.translate(cx,cy);ctx.rotate(-.18);ctx.scale(1,.22);
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`;ctx.lineWidth=5;
    ctx.beginPath();ctx.ellipse(0,0,rad*1.65,rad*1.65,0,0,Math.PI*2);ctx.stroke();ctx.restore();}
}

const CW=540,CH=252;

function drawRock(ctx,cx,cy,size,rng,r,g,b){
  const pts=9,verts=[];
  for(let i=0;i<pts;i++){const ang=(i/pts)*Math.PI*2;const rad=size*(.65+rng()*.7);
    verts.push({x:cx+Math.cos(ang)*rad,y:cy+Math.sin(ang)*rad*.52});}
  ctx.save();ctx.translate(0,4);
  ctx.beginPath();verts.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));
  ctx.closePath();ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fill();ctx.restore();
  const grd=ctx.createLinearGradient(cx,cy-size*.55,cx+size*.2,cy+size*.45);
  grd.addColorStop(0,`rgb(${Math.min(255,r+38)},${Math.min(255,g+32)},${Math.min(255,b+24)})`);
  grd.addColorStop(.35,`rgb(${r},${g},${b})`);
  grd.addColorStop(.7,`rgb(${r*.7|0},${g*.68|0},${b*.62|0})`);
  grd.addColorStop(1,`rgb(${r*.38|0},${g*.35|0},${b*.3|0})`);
  ctx.beginPath();verts.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));
  ctx.closePath();ctx.fillStyle=grd;ctx.fill();
  ctx.strokeStyle=`rgba(${Math.min(255,r+70)},${Math.min(255,g+60)},${Math.min(255,b+50)},0.32)`;
  ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<Math.ceil(pts/2);i++)i?ctx.lineTo(verts[i].x,verts[i].y):ctx.moveTo(verts[i].x,verts[i].y);
  ctx.stroke();
  ctx.strokeStyle=`rgba(${r*.3|0},${g*.28|0},${b*.25|0},0.5)`;ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(cx-size*.15+rng()*size*.2,cy-size*.1);
  ctx.lineTo(cx+size*.05+rng()*size*.2,cy+size*.25);ctx.stroke();
}

function paintTerrain(ctx,W,H,rng,conquered,threat){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,conquered?'#08100a':'#100806');
  sky.addColorStop(.45,conquered?'#0e1808':'#16100a');
  sky.addColorStop(1,conquered?'#141e0e':'#1c1208');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const haze=ctx.createLinearGradient(0,H*.3,0,H*.55);
  haze.addColorStop(0,'transparent');
  haze.addColorStop(.5,conquered?'rgba(40,60,20,0.18)':'rgba(60,30,10,0.18)');
  haze.addColorStop(1,'transparent');
  ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.026)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const [dR,dG,dB]=conquered?[38,42,28]:[48,34,22];
  for(let i=0;i<14;i++){const rx=rng()*W*.95+W*.02,ry=rng()*H*.28+H*.04,rs=(8+rng()*22)*(1-ry/H*.6);
    drawRock(ctx,rx,ry,rs,rng,dR,dG,dB);}
  const [mR,mG,mB]=conquered?[52,56,38]:[62,44,30];
  for(let i=0;i<10;i++){drawRock(ctx,rng()*W*.9+W*.05,rng()*H*.22+H*.2,18+rng()*36,rng,mR,mG,mB);}
  const [fR,fG,fB]=conquered?[62,66,44]:[72,52,36];
  for(let i=0;i<5;i++)drawRock(ctx,rng()*80+10,H*.45+rng()*H*.28,22+rng()*40,rng,fR,fG,fB);
  for(let i=0;i<5;i++)drawRock(ctx,W-rng()*80-10,H*.45+rng()*H*.28,22+rng()*40,rng,fR,fG,fB);
  for(let i=0;i<6;i++)drawRock(ctx,W*.22+rng()*W*.56,H*.38+rng()*H*.1,10+rng()*22,rng,fR,fG,fB);
  const gnd=ctx.createLinearGradient(0,H*.5,0,H);
  gnd.addColorStop(0,'transparent');gnd.addColorStop(1,conquered?'rgba(12,18,8,0.55)':'rgba(16,10,5,0.6)');
  ctx.fillStyle=gnd;ctx.fillRect(0,0,W,H);
  if(!conquered){
    const fog=ctx.createRadialGradient(W/2,H/2,H*.15,W/2,H/2,H*.9);
    fog.addColorStop(0,'transparent');fog.addColorStop(1,'rgba(18,8,4,0.5)');
    ctx.fillStyle=fog;ctx.fillRect(0,0,W,H);
    for(let i=0;i<5;i++){
      const ax=W*.1+rng()*W*.8,ay=H*.3+rng()*H*.5;
      ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=threat==='FORTIFIED'?'rgba(200,48,16,0.75)':'rgba(200,116,40,0.6)';
      ctx.fillText('⚠',ax,ay);
    }
  }
}

// ─────────────────────────────────────────────
function drawFarm(ctx,px,py,pw,ph,level,overdriven){
  // Soil base gradient
  const soilGrad=ctx.createLinearGradient(px,py,px,py+ph);
  soilGrad.addColorStop(0,'#2e1f08');soilGrad.addColorStop(1,'#1e1205');
  ctx.fillStyle=soilGrad;ctx.fillRect(px,py,pw,ph);
  // Tilling furrows
  ctx.strokeStyle='#3a2810';ctx.lineWidth=1;
  for(let i=1;i<=6;i++){const fy=py+(ph/7)*i;ctx.beginPath();ctx.moveTo(px,fy);ctx.lineTo(px+pw,fy);ctx.stroke();}
  // Wheat stalks 7×5
  const PAD=6,stalkCols=7,stalkRows=5;
  const cellW=(pw-PAD*2)/stalkCols,cellH=(ph-PAD*2)/stalkRows;
  const maxStalkH=cellH*0.85;
  for(let row=0;row<stalkRows;row++){
    for(let col=0;col<stalkCols;col++){
      const heightFrac=0.80+((col*3+row*7)%5)*0.04;
      const stalkH=maxStalkH*heightFrac;
      const sx=px+PAD+col*cellW+cellW/2,sy=py+PAD+(row+1)*cellH;
      const tx=sx+(((col+row)%3)-1)*2,ty=sy-stalkH;
      ctx.strokeStyle='#8a6820';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(sx,sy);
      ctx.bezierCurveTo(sx+3,sy-stalkH*.35,tx-3,sy-stalkH*.65,tx,ty);ctx.stroke();
      const lx=sx+1.5,ly=sy-stalkH*0.5,lDir=(col%2===0)?1:-1;
      ctx.strokeStyle='#4a7818';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.quadraticCurveTo(lx+lDir*8,ly-4,lx+lDir*8,ly+1);ctx.stroke();
      ctx.save();ctx.translate(tx,ty);
      const hg=ctx.createRadialGradient(0,-4,0,0,0,5);
      hg.addColorStop(0,'#f0c848');hg.addColorStop(1,'#a87820');
      ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(0,0,2,5,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }
  // Border stones
  ctx.strokeStyle='rgba(180,140,60,0.5)';ctx.lineWidth=1.5;ctx.strokeRect(px+2,py+2,pw-4,ph-4);
  // Level badge
  if(level){
    const bdgTxt='LV'+level;
    ctx.font='900 9px Courier New';ctx.textAlign='right';ctx.textBaseline='bottom';
    const bw=ctx.measureText(bdgTxt).width+6;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(px+pw-bw-2,py+ph-15,bw,13);
    ctx.fillStyle='#d4a832';ctx.fillText(bdgTxt,px+pw-4,py+ph-3);
  }
  // Overdrive glow
  if(overdriven){
    ctx.save();ctx.shadowColor='rgba(255,220,80,0.9)';ctx.shadowBlur=12;
    ctx.strokeStyle='rgba(255,220,80,0.85)';ctx.lineWidth=3;
    ctx.strokeRect(px+1,py+1,pw-2,ph-2);ctx.restore();
  }
}

function footprintOccupies(bldg){
  const[fw,fh]=FOOTPRINTS[bldg.type];
  const cells=[];
  for(let r=bldg.row;r<bldg.row+fh;r++)
    for(let c=bldg.col;c<bldg.col+fw;c++)
      cells.push(c*100+r);
  return cells;
}

function gridOccupancyMap(cont){
  const map={};
  cont.bldgs.forEach(b=>{
    footprintOccupies(b).forEach(key=>{map[key]=b;});
  });
  return map;
}

function canPlace(cont,col,row,type){
  const[fw,fh]=FOOTPRINTS[type];
  if(col+fw>GCOLS||row+fh>GROWS)return false;
  const occ=gridOccupancyMap(cont);
  for(let r=row;r<row+fh;r++)
    for(let c=col;c<col+fw;c++)
      if(occ[c*100+r])return false;
  return true;
}

function _brighten(hex,frac){
  let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  const mix=v=>Math.min(255,Math.round(v+(255-v)*frac));
  return'rgb('+mix(r)+','+mix(g)+','+mix(b)+')';
}

function drawBuildingShadow(ctx,px,py,pw,ph){
  ctx.save();const cx=px+pw/2+4,cy=py+ph+4;
  const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,pw*0.65);
  rg.addColorStop(0,'rgba(0,0,0,0.45)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.30;ctx.fillStyle=rg;ctx.scale(1,0.38);
  ctx.beginPath();ctx.ellipse(cx,cy/0.38,pw*0.65,ph*0.8,0,0,Math.PI*2);ctx.fill();ctx.restore();
}

function drawConstructionBuilding(ctx,b,cellSize){
  const fp=FOOTPRINTS[b.type]||[1,1];
  const px=b.col*cellSize,py=b.row*cellSize,pw=fp[0]*cellSize,ph=fp[1]*cellSize;
  const pct=b.constructPct||0;
  ctx.fillStyle='rgba(20,20,20,0.75)';ctx.fillRect(px,py,pw,ph);
  // Ghost preview
  const info=BUILDINGS[b.type];
  if(info&&info.icon){ctx.save();ctx.globalAlpha=0.3;ctx.font=Math.min(pw,ph)*0.42+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(info.icon,px+pw/2,py+ph/2);ctx.restore();}
  // Corner posts
  const postW=4;ctx.fillStyle='#404040';
  ctx.fillRect(px,py,postW,ph);ctx.fillRect(px+pw-postW,py,postW,ph);
  ctx.fillRect(px,py,pw,postW);ctx.fillRect(px,py+ph-postW,pw,postW);
  // X-brace
  ctx.save();ctx.strokeStyle='#303030';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(px+postW,py+postW);ctx.lineTo(px+pw-postW,py+ph-postW);ctx.stroke();
  ctx.beginPath();ctx.moveTo(px+pw-postW,py+postW);ctx.lineTo(px+postW,py+ph-postW);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
  // Scaffold planks
  ctx.fillStyle='#5a5040';ctx.fillRect(px,py+ph*0.33-1.5,pw,3);ctx.fillRect(px,py+ph*0.66-1.5,pw,3);
  // Progress bar
  const barH=10,barPad=4,barY=py+ph-barH-barPad;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(px+barPad,barY,pw-barPad*2,barH);
  ctx.fillStyle='#28a040';ctx.fillRect(px+barPad,barY,(pw-barPad*2)*Math.max(0,Math.min(1,pct)),barH);
  ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.fillText(Math.round(pct*100)+'%',px+pw/2,barY+barH/2);
  ctx.textBaseline='top';ctx.fillStyle='#ffdd00';ctx.fillText('⚙ BUILDING',px+pw/2,py+2);
}

function _drawBldgDetail(ctx,type,px,py,pw,ph,bc){
  switch(type){
    case'colonyCenter':{const cr=Math.min(pw,ph)*0.22,cx=px+pw/2,cy=py+ph*0.30;ctx.save();ctx.strokeStyle=bc;ctx.lineWidth=1.5;const dg=ctx.createLinearGradient(cx-cr,cy,cx+cr,cy);dg.addColorStop(0,'rgba(39,160,176,0.15)');dg.addColorStop(0.5,'rgba(39,160,176,0.35)');dg.addColorStop(1,'rgba(39,160,176,0.15)');ctx.fillStyle=dg;ctx.beginPath();ctx.arc(cx,cy,cr,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();break;}
    case'resourceCollector':{const p1=px+pw-10,p2=px+pw-6;ctx.save();ctx.strokeStyle=bc;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p1,py+5);ctx.lineTo(p1,py+ph-5);ctx.stroke();ctx.beginPath();ctx.moveTo(p2,py+5);ctx.lineTo(p2,py+ph-5);ctx.stroke();ctx.restore();break;}
    case'barracks':{const cx=px+pw/2,cy=py+ph*0.25,cw=pw*0.25,ch=7;ctx.save();ctx.strokeStyle=bc;ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(cx-cw,cy-ch/2);ctx.lineTo(cx,cy+ch/2);ctx.lineTo(cx+cw,cy-ch/2);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-cw*0.6,cy-ch/2-5);ctx.lineTo(cx,cy+ch/2-5);ctx.lineTo(cx+cw*0.6,cy-ch/2-5);ctx.stroke();ctx.restore();break;}
    case'house':{const rh=Math.min(ph*0.22,14),ry=py+2;ctx.save();ctx.fillStyle=bc;ctx.globalAlpha=0.6;ctx.beginPath();ctx.moveTo(px+pw*0.15,ry+rh);ctx.lineTo(px+pw/2,ry);ctx.lineTo(px+pw*0.85,ry+rh);ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=bc;ctx.lineWidth=1;ctx.stroke();ctx.restore();break;}
    case'researchCenter':{const ax=px+pw-12,ay=py+12,ar=7;ctx.save();ctx.strokeStyle=bc;ctx.lineWidth=1;ctx.globalAlpha=0.75;for(let i=0;i<3;i++){ctx.save();ctx.translate(ax,ay);ctx.rotate(Math.PI/3*i);ctx.beginPath();ctx.ellipse(0,0,ar,ar*0.38,0,0,Math.PI*2);ctx.stroke();ctx.restore();}ctx.fillStyle=bc;ctx.beginPath();ctx.arc(ax,ay,2,0,Math.PI*2);ctx.fill();ctx.restore();break;}
    case'excellorantFactory':{ctx.save();ctx.fillStyle=bc;ctx.globalAlpha=0.85;function bolt(bx,by){ctx.beginPath();ctx.moveTo(bx+3,by);ctx.lineTo(bx,by+6);ctx.lineTo(bx+2,by+6);ctx.lineTo(bx-1,by+12);ctx.lineTo(bx+4,by+5);ctx.lineTo(bx+2,by+5);ctx.closePath();ctx.fill();}bolt(px+4,py+3);bolt(px+pw-9,py+3);ctx.restore();break;}
    case'spaceport':{const padY=py+ph-8,padW=pw*0.55,padH=5,padX=px+(pw-pw*0.55)/2;ctx.save();ctx.fillStyle='rgba(100,120,160,0.6)';ctx.fillRect(padX,padY,padW,padH);ctx.strokeStyle=bc;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(padX+padW*0.2,padY);ctx.lineTo(padX+padW*0.1,padY+padH+3);ctx.stroke();ctx.beginPath();ctx.moveTo(padX+padW*0.8,padY);ctx.lineTo(padX+padW*0.9,padY+padH+3);ctx.stroke();ctx.restore();break;}
    case'storehouse':{const sx=px+pw*0.55,sw=pw*0.38;ctx.save();ctx.strokeStyle=bc;ctx.lineWidth=1.5;ctx.globalAlpha=0.6;[0.28,0.50,0.72].forEach(f=>{const ly=py+ph*f;ctx.beginPath();ctx.moveTo(sx,ly);ctx.lineTo(sx+sw,ly);ctx.stroke();});ctx.restore();break;}
  }
}

function drawGridBuilding(ctx,b,cellSize,now){
  const fp=FOOTPRINTS[b.type]||[1,1];
  const px=b.col*cellSize,py=b.row*cellSize,pw=fp[0]*cellSize,ph=fp[1]*cellSize;
  if(b.constructing){drawConstructionBuilding(ctx,b,cellSize);return;}
  const overdriven=state.overdrive[b.uid]&&now<state.overdrive[b.uid];
  if(b.type==='farm'){drawFarm(ctx,px,py,pw,ph,b.level,overdriven);return;}
  const style=_BLDG_STYLE[b.type]||{fill:'rgba(30,30,30,0.85)',fill2:'rgba(10,10,10,0.95)',border:'#888'};
  const bc=style.border;
  drawBuildingShadow(ctx,px,py,pw,ph);
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(px+pw-3,py+2,3,ph-2);
  const fg=ctx.createLinearGradient(px,py,px+pw,py+ph);
  fg.addColorStop(0,style.fill);fg.addColorStop(1,style.fill2);
  ctx.fillStyle=fg;ctx.fillRect(px+1,py+1,pw-4,ph-3);
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(px+1,py+1,pw-4,2);
  ctx.strokeStyle=_brighten(bc,0.35);ctx.lineWidth=1;ctx.strokeRect(px+2,py+2,pw-5,ph-5);
  ctx.strokeStyle=bc;ctx.lineWidth=1.5;ctx.strokeRect(px,py,pw,ph);
  const dotC=_brighten(bc,0.2);ctx.fillStyle=dotC;
  [[px+4,py+4],[px+pw-5,py+4],[px+4,py+ph-5],[px+pw-5,py+ph-5]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(dx,dy,3,0,Math.PI*2);ctx.fill();});
  _drawBldgDetail(ctx,b.type,px,py,pw,ph,bc);
  const info=BUILDINGS[b.type];
  if(info&&info.icon){const sz=Math.min(pw,ph)*0.40;ctx.font=sz+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(info.icon,px+pw/2,py+ph/2-4);}
  const bdg='LV '+b.level;ctx.font='900 9px Courier New';ctx.textAlign='center';ctx.textBaseline='bottom';
  const bw=ctx.measureText(bdg).width+6;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(px+pw/2-bw/2,py+ph-14,bw,12);
  ctx.fillStyle='#d4a832';ctx.fillText(bdg,px+pw/2,py+ph-3);
  if(overdriven){
    ctx.save();ctx.shadowColor='rgba(255,220,80,0.9)';ctx.shadowBlur=12;ctx.strokeStyle='rgba(255,220,80,0.85)';ctx.lineWidth=3;ctx.strokeRect(px+1,py+1,pw-2,ph-2);
    const pulse=0.5+0.5*Math.sin(now/300);ctx.globalAlpha=pulse*0.5;ctx.strokeStyle='#ffe040';ctx.lineWidth=2;ctx.strokeRect(px-2,py-2,pw+4,ph+4);ctx.restore();
  }
}

function drawContinentMap(canvas,cont){
  canvas.width=GRID_W; canvas.height=GRID_H;
  const ctx=canvas.getContext('2d');
  const rng=mkRng(strSeed(cont.name));

  if(cont.conquered){
    // Terrain background (scaled to grid size)
    paintTerrain(ctx,GRID_W,GRID_H,rng,true,cont.threat);

    // Grid lines overlay
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=0.8;
    for(let c=0;c<=GCOLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,GRID_H);ctx.stroke();}
    for(let r=0;r<=GROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(GRID_W,r*CELL);ctx.stroke();}

    // Placing highlight
    if(state.placing){
      const[fw,fh]=FOOTPRINTS[state.placing];
      ctx.fillStyle='rgba(212,168,50,0.06)';
      for(let r2=0;r2<=GROWS-fh;r2++)
        for(let c2=0;c2<=GCOLS-fw;c2++){
          if(canPlace(cont,c2,r2,state.placing)){
            ctx.fillRect(c2*CELL,r2*CELL,fw*CELL,fh*CELL);
          }
        }
    }

    const now=Date.now();
    cont.bldgs.forEach(b=>drawGridBuilding(ctx,b,CELL,now));
  } else {
    paintTerrain(ctx,GRID_W,GRID_H,rng,false,cont.threat);
  }

  ctx.font='900 11px Courier New';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='rgba(200,116,40,0.5)';ctx.fillText(cont.name.toUpperCase(),10,8);
  ctx.strokeStyle=cont.conquered?'rgba(90,138,60,0.3)':'rgba(192,48,16,0.28)';
  ctx.lineWidth=1.5;ctx.strokeRect(0,0,GRID_W,GRID_H);
}

function drawWall(ctx,x,y,w,h,level){
  if(level>=2){ctx.fillStyle='#2a2420';ctx.fillRect(x-3,y-4,w+6,h+4);ctx.strokeStyle='#4a3c30';ctx.lineWidth=1;ctx.strokeRect(x-3,y-4,w+6,h+4);}
  const wg=ctx.createLinearGradient(x,y,x,y+h);wg.addColorStop(0,'#8a7860');wg.addColorStop(0.15,'#6e5e4a');wg.addColorStop(1,'#3a2e22');
  ctx.fillStyle=wg;ctx.fillRect(x,y,w,h);
  const mc=Math.max(2,Math.floor(w/12)),mW=Math.floor(w/(mc*2)),mH=6;
  ctx.fillStyle='#7a6850';for(let i=0;i<mc;i++)ctx.fillRect(x+i*(w/mc),y-mH,mW,mH);
  ctx.save();ctx.strokeStyle='rgba(20,15,10,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+w*0.35,y+h*0.15);ctx.lineTo(x+w*0.42,y+h*0.45);ctx.lineTo(x+w*0.38,y+h*0.8);ctx.stroke();ctx.restore();
  ctx.strokeStyle='#9a8870';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);
}
function drawTurret(ctx,x,y,level){
  const tw=20,th=24;
  const tg=ctx.createLinearGradient(x,y,x,y+th);tg.addColorStop(0,'#6a5a48');tg.addColorStop(1,'#2a2018');
  ctx.fillStyle=tg;ctx.fillRect(x,y,tw,th);ctx.strokeStyle='#8a7860';ctx.lineWidth=1.5;ctx.strokeRect(x,y,tw,th);
  ctx.fillStyle='#0a0808';ctx.fillRect(x+tw/2-1.5,y+th*0.35,3,8);
  if(level>=2){ctx.strokeStyle='#c0a070';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+tw/2,y);ctx.lineTo(x+tw/2,y-14);ctx.stroke();ctx.fillStyle='#c82828';ctx.beginPath();ctx.moveTo(x+tw/2,y-14);ctx.lineTo(x+tw/2+8,y-10);ctx.lineTo(x+tw/2,y-6);ctx.closePath();ctx.fill();}
}
function drawTrench(ctx,x,y,w){
  ctx.fillStyle='rgba(30,18,8,0.80)';ctx.fillRect(x,y,w,8);
  ctx.strokeStyle='#3a2810';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();
  ctx.strokeStyle='#1e1008';ctx.beginPath();ctx.moveTo(x,y+8);ctx.lineTo(x+w,y+8);ctx.stroke();
  const sc=Math.max(2,Math.floor(w/18));ctx.strokeStyle='#5a4020';ctx.lineWidth=1.5;ctx.lineCap='round';
  for(let i=0;i<sc;i++){const sx=x+(i+0.5)*(w/sc),sy=y+4;ctx.beginPath();ctx.moveTo(sx-4,sy+3);ctx.lineTo(sx,sy-3);ctx.lineTo(sx+4,sy+3);ctx.stroke();}
}
function drawFortifications(ctx,laneX,laneW,H,threat){
  const isFort=threat==='FORTIFIED',isGuard=isFort||threat==='GUARDED';
  if(!isGuard)return;
  const wallH=18,tw=20,th=24;
  if(isGuard){
    drawWall(ctx,laneX,H*0.55,laneW,wallH,1);
    drawTurret(ctx,laneX-tw/2,H*0.55-th+wallH,1);drawTurret(ctx,laneX+laneW-tw/2,H*0.55-th+wallH,1);
    drawTrench(ctx,laneX,H*0.70,laneW);
  }
  if(isFort){
    drawWall(ctx,laneX+laneW*0.1,H*0.35,laneW*0.8,wallH,2);
    drawTurret(ctx,laneX+laneW*0.1-tw/2,H*0.35-th+wallH,2);drawTurret(ctx,laneX+laneW*0.9-tw/2,H*0.35-th+wallH,2);
    drawTrench(ctx,laneX,H*0.45,laneW);
  }
}

const LANE_NAMES=['LEFT FLANK','CENTER','RIGHT FLANK'];
const LANE_COLORS=['rgba(90,138,60,0.5)','rgba(200,116,40,0.5)','rgba(90,138,60,0.5)'];

function drawInvasionMap(canvas,alienLanes,phase,laneResults){
  const W=CW,H=180;
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const cont=state.planet.continents[state.invasion.contIdx];
  const rng=mkRng(strSeed(cont.name+'battle'));
  paintTerrain(ctx,W,H,rng,false,cont.threat);

  const laneW=W/3;
  ctx.save();ctx.strokeStyle='rgba(200,116,40,0.28)';ctx.lineWidth=1;ctx.setLineDash([5,5]);
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(laneW*i,0);ctx.lineTo(laneW*i,H);ctx.stroke();}
  ctx.setLineDash([]);ctx.restore();

  function drawUnitCluster(lx,baseY,count,unitType){
    if(count<=0)return;
    const dots=Math.min(8,Math.max(1,Math.ceil(count/20)));
    const COLORS={inf:'#c03010',tnk:'#c87428',cav:'#c8b428'};
    ctx.fillStyle=COLORS[unitType]||'#888';ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=0.8;
    for(let d=0;d<dots;d++){
      const dx=lx+laneW*0.55+(d%4)*12+4,dy=baseY+Math.floor(d/4)*12;
      if(unitType==='inf'){ctx.beginPath();ctx.arc(dx,dy,5,0,Math.PI*2);ctx.fill();ctx.stroke();}
      else if(unitType==='tnk'){ctx.beginPath();ctx.rect(dx-5,dy-5,10,10);ctx.fill();ctx.stroke();}
      else if(unitType==='cav'){ctx.beginPath();ctx.moveTo(dx,dy-6);ctx.lineTo(dx+6,dy+5);ctx.lineTo(dx-6,dy+5);ctx.closePath();ctx.fill();ctx.stroke();}
    }
  }

  LANE_NAMES.forEach((lname,li)=>{
    const lx=laneW*li,cx2=lx+laneW/2;
    const aLane=alienLanes.lanes[li];
    ctx.save();ctx.font='900 9px Courier New';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle=LANE_COLORS[li];ctx.fillText(lname,cx2,5);ctx.restore();

    if(phase==='deploy'){
      ctx.save();ctx.strokeStyle='rgba(90,138,60,0.55)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
      const dzX=lx+4,dzY=H*0.32,dzW=laneW*0.40,dzH=H*0.56;
      ctx.strokeRect(dzX,dzY,dzW,dzH);ctx.setLineDash([]);
      ctx.fillStyle='rgba(90,138,60,0.07)';ctx.fillRect(dzX,dzY,dzW,dzH);
      ctx.font='700 7px Courier New';ctx.textAlign='left';ctx.textBaseline='top';
      ctx.fillStyle='rgba(90,138,60,0.7)';ctx.fillText('DEPLOY',dzX+2,dzY+2);ctx.restore();
      drawFortifications(ctx,lx,laneW,H,cont.threat);
      drawUnitCluster(lx,H*0.38,aLane.infantry,'inf');
      drawUnitCluster(lx,H*0.54,aLane.tanks,'tnk');
      drawUnitCluster(lx,H*0.70,aLane.cavalry,'cav');
      const defPow=(aLane.infantry*1.0+aLane.tanks*2.2+aLane.cavalry*1.3).toFixed(0);
      ctx.save();ctx.font='700 8px Courier New';ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillStyle='rgba(192,48,16,0.9)';
      ctx.fillText(`DEF ${defPow}  (${aLane.infantry+aLane.tanks+aLane.cavalry})`,cx2,H-4);ctx.restore();

    } else if(phase==='battle'||phase==='done'){
      const res=laneResults&&laneResults[li];
      if(res){
        ctx.save();
        ctx.fillStyle=res.win?'rgba(90,138,60,0.18)':'rgba(192,48,16,0.16)';
        ctx.fillRect(lx+2,2,laneW-4,H-4);
        ctx.strokeStyle=res.win?'rgba(90,138,60,0.6)':'rgba(192,48,16,0.55)';
        ctx.lineWidth=1.5;ctx.strokeRect(lx+2,2,laneW-4,H-4);
        ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=res.win?'rgba(90,138,60,0.95)':'rgba(192,48,16,0.9)';
        ctx.fillText(res.win?'✓':'✗',cx2,H*0.42);
        ctx.font='900 9px Courier New';ctx.textBaseline='bottom';
        ctx.fillText(res.win?'CAPTURED':'REPELLED',cx2,H-14);
        ctx.font='700 8px Courier New';ctx.fillStyle='rgba(200,196,180,0.65)';
        ctx.fillText(`🪖${res.infLost} 🛡️${res.tnkLost} 🐎${res.cavLost}`,cx2,H-3);
        ctx.restore();
      }
    }
  });

  ctx.strokeStyle='rgba(192,48,16,0.35)';ctx.lineWidth=1.5;ctx.strokeRect(0,0,W,H);
}

function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':''+Math.floor(n)}

function applyStorehouseData(){
  BUILDINGS.storehouse={name:'Storehouse',short:'STOREHOUSE',icon:'🏪',
    summary:'Expands resource storage capacity. Each upgrade increases max storage for all resources.',prod:null};
  COSTS.storehouse={metal:350,food:150};
  FOOTPRINTS.storehouse=[2,2];
  if(!SLOT_ORDER.includes('storehouse'))SLOT_ORDER.push('storehouse');
}

function getStorageCapacity(){
  const caps={metal:5000,food:3000,pop:2000,research:1000,excellorant:200};
  const bonus={metal:3000,food:2000,pop:1500,research:800,excellorant:150};
  state.planet.continents.forEach(cont=>{
    if(!cont.conquered)return;
    (cont.bldgs||[]).forEach(b=>{
      if(b.type==='storehouse'){const lv=b.level||1;Object.keys(bonus).forEach(k=>caps[k]+=bonus[k]*lv);}
    });
  });
  return caps;
}

function enforceStorageCaps(){
  const caps=getStorageCapacity();
  Object.keys(caps).forEach(k=>{if(state.res[k]!==undefined&&state.res[k]>caps[k])state.res[k]=caps[k];});
}

function getStorageBarHTML(resKey){
  const caps=getStorageCapacity(),cur=Math.floor(state.res[resKey]||0),cap=caps[resKey]||1;
  const pct=Math.min(100,Math.round(cur/cap*100));
  return `<div style="margin-top:4px">
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted)"><span>STORED</span><span style="color:var(--gold)">${cur} / ${cap}</span></div>
    <div style="background:rgba(255,255,255,0.06);height:4px;margin-top:2px"><div style="background:var(--mil);height:100%;width:${pct}%"></div></div>
  </div>`;
}

function resHTML(){

function calcUpkeep(){
  let total=0;
  ['infantry','tanks','cavalry'].forEach(ut=>{const g=state.troops[ut];total+=(g.t1||0)+(g.t2||0)+(g.t3||0);});
  return{food:total*0.5,total};
}

function applyUpkeep(){
  const{food:cost}=calcUpkeep();
  state.res.food=Math.max(0,state.res.food-cost);
  if(state.res.food===0&&cost>0){
    toast('// FOOD SHORTAGE — TROOPS DESERTING //');
    ['infantry','tanks','cavalry'].forEach(ut=>{['t1','t2','t3'].forEach(tk=>{state.troops[ut][tk]=Math.max(0,Math.floor((state.troops[ut][tk]||0)*0.95));});});
  }
}

function getUpkeepSummaryHTML(){
  const{food:cost,total}=calcUpkeep();
  const low=(state.res.food||0)<cost*10;
  return `<span style="font-size:10px;color:var(--muted)">Upkeep: <b style="color:var(--text)">${cost}</b> food/tick · <b style="color:var(--text)">${total}</b> soldiers</span>`

function trainTroops(ut){
  const hasBrk=state.planet.continents.some(c=>c.conquered&&c.bldgs.find(b=>b.type==='barracks'));
  if(!hasBrk){toast('// BUILD A BARRACKS FIRST //');return;}
  const cost=TRAIN_COSTS[ut],batch=TRAIN_BATCH[ut],qty=state.trainQty[ut]||1;
  const units=qty*batch;
  const popCost=(cost.pop||0)*qty,metalCost=(cost.metal||0)*qty,foodCost=(cost.food||0)*qty;
  if(popCost&&state.res.pop<popCost){toast('// NEED '+popCost+' POPULATION //');return;}
  if(metalCost&&state.res.metal<metalCost){toast('// NEED '+metalCost+' METAL //');return;}
  if(foodCost&&state.res.food<foodCost){toast('// NEED '+foodCost+' FOOD //');return;}
  if(popCost)state.res.pop-=popCost;
  if(metalCost)state.res.metal-=metalCost;
  if(foodCost)state.res.food-=foodCost;
  state.troops[ut].t1=(state.troops[ut].t1||0)+units;
  toast('// +'+units+' '+TIER_NAMES[ut][0].toUpperCase()+' TRAINED //');
  renderAllResBars();
  renderTroopsBody();
}

function setupMapClick(){
  const canvas=document.getElementById('continent-map');
  canvas.onclick=canvas.ontouchend=function(e){
    e.preventDefault();
    const touch=e.changedTouches?e.changedTouches[0]:e;
    const rect=canvas.getBoundingClientRect();
    const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
    const cx=(touch.clientX-rect.left)*sx,cy=(touch.clientY-rect.top)*sy;
    const cont=state.planet.continents[state.selCont];
    if(!cont.conquered)return;

    const col=Math.floor(cx/CELL);
    const row=Math.floor(cy/CELL);
    if(col<0||col>=GCOLS||row<0||row>=GROWS)return;

    if(state.placing){
      // Try to place building at (col, row)
      const type=state.placing;
      if(!canPlace(cont,col,row,type)){
        toast('// INVALID PLACEMENT //');return;
      }
      buildStructure(state.selCont,col,row,type);
      return;
    }

    // Check if tapping occupied cell
    const occ=gridOccupancyMap(cont);
    const bldg=occ[col*100+row];
    if(bldg){
      openBuilding(bldg,state.selCont);
    } else {
      showBuildMenu(state.selCont,col,row);
    }
  };
}

// ═══ COMBAT V3 ═══

let _battleInterval = null;
let _battleRaf = null;
let _unitIdCounter = 0;
let _hitFlashes = []; // [{x,y,r,alpha,born}]

const BASE_STATS = {
  infantry: { hp: 30, atk: 8,  spd: 0.003, range: 0.08, cd: 3 },
  tanks:    { hp: 80, atk: 20, spd: 0.002, range: 0.12, cd: 5 },
  cavalry:  { hp: 20, atk: 12, spd: 0.005, range: 0.06, cd: 2 },
};

function _makeUnit(side, type, tier, x, y) {
  const s = BASE_STATS[type];
  const m = TIER_MULT[tier - 1];
  const b = getTroopBonuses();
  const atkBonus = type === 'infantry' ? (b.infAtk || 1)
    : type === 'tanks' ? (b.tnkAtk || 1) : (b.cavAtk || 1);
  const defBonus = type === 'infantry' ? (b.infDef || 1)
    : type === 'tanks' ? (b.tnkDef || 1) : 1;
  return {
    id: ++_unitIdCounter,
    side, type, tier, x, y,
    hp: s.hp * m * defBonus,
    maxHp: s.hp * m * defBonus,
    atk: s.atk * m * atkBonus,
    spd: s.spd * (type === 'cavalry' ? (1 + (b.cavEvade || 0) * 0.5) : 1),
    range: s.range,
    baseCd: s.cd,
    cooldown: 0,
    dead: false,
    angle: side === 'player' ? -Math.PI / 2 : Math.PI / 2,
    hitFlash: 0,
  };
}

function _genEnemyUnits(aliens) {
  const rng = mkRng(strSeed(state.planet.continents[state.invasion.contIdx].name + 'v3'));
  const units = [];
  const place = (type, tier, count) => {
    for (let i = 0; i < count; i++) {
      const x = 0.05 + rng() * 0.90;
      const y = 0.03 + rng() * 0.35;
      units.push(_makeUnit('enemy', type, tier, x, y));
    }
  };
  // distribute alien counts across tiers (mostly t1, some t2, fewer t3)
  const split = (total) => {
    const t3 = Math.floor(total * 0.10);
    const t2 = Math.floor(total * 0.25);
    const t1 = total - t2 - t3;
    return [Math.max(0, t1), Math.max(0, t2), Math.max(0, t3)];
  };
  ['infantry', 'tanks', 'cavalry'].forEach(type => {
    const [n1, n2, n3] = split(aliens[type] || 0);
    if (n1) place(type, 1, n1);
    if (n2) place(type, 2, n2);
    if (n3) place(type, 3, n3);
  });
  return units;
}

function openInvasion(contIdx) {
  if (_battleInterval) { clearInterval(_battleInterval); _battleInterval = null; }
  if (_battleRaf) { cancelAnimationFrame(_battleRaf); _battleRaf = null; }
  _hitFlashes = [];

  const cont = state.planet.continents[contIdx];
  state.invasion = {
    contIdx,
    phase: 'deploy',
    playerUnits: [],
    enemyUnits: _genEnemyUnits(cont.aliens),
    battleResult: null,
    deployType: 'infantry',
    deployTier: 1,
  };

  document.getElementById('inv-title').textContent = `⚔ INVADE ${cont.name.toUpperCase()}`;
  document.getElementById('inv-back').onclick = () => openContinent(contIdx);

  document.getElementById('troop-bar-inv').innerHTML = troopHTML();

  const canvas = document.getElementById('invasion-map');
  canvas.onclick = _onBattlefieldClick;
  canvas.style.cursor = 'crosshair';

  renderLaneGrid();
  _drawBattlefield(canvas, performance.now());
  showScreen('invasion');
}

function renderLaneGrid() {
  const body = document.getElementById('inv-body');
  if (!body) return;
  if (state.invasion.phase === 'battle') { body.innerHTML = ''; return; }
  if (state.invasion.phase === 'done') return;

  const inv = state.invasion;
  const deployed = inv.playerUnits.length;
  const types = ['infantry', 'tanks', 'cavalry'];
  const typeLabels = { infantry: 'Infantry', tanks: 'Tanks', cavalry: 'Cavalry' };

  let typeButtons = types.map(t => {
    const active = inv.deployType === t;
    const style = active ? 'background:var(--mil);color:#fff;' : 'background:var(--edge);color:var(--muted);';
    return `<button onclick="selectDeployType('${t}',${inv.deployTier})" style="flex:1;padding:5px 2px;border:1px solid var(--edge);font-size:10px;letter-spacing:1px;cursor:pointer;${style}">${TIER_ICONS[t][0]} ${typeLabels[t].toUpperCase()}</button>`;
  }).join('');

  let tierButtons = [1, 2, 3].map(tier => {
    const avail = _availForDeploy(inv.deployType, tier);
    const active = inv.deployTier === tier;
    const style = active ? 'background:var(--rust);color:#fff;' : 'background:var(--edge);color:var(--muted);';
    return `<button onclick="selectDeployType('${inv.deployType}',${tier})" style="flex:1;padding:4px 2px;border:1px solid var(--edge);font-size:10px;cursor:pointer;${style}">${TIER_ICONS[inv.deployType][tier - 1]} T${tier} (${avail})</button>`;
  }).join('');

  const selAvail = _availForDeploy(inv.deployType, inv.deployTier);
  const hint = selAvail > 0
    ? `<div style="font-size:10px;color:var(--mil);margin-top:4px">▶ Click bottom half of map to place ${TIER_NAMES[inv.deployType][inv.deployTier - 1]}</div>`
    : `<div style="font-size:10px;color:var(--blood);margin-top:4px">✗ No ${TIER_NAMES[inv.deployType][inv.deployTier - 1]} available</div>`;

  const engageStyle = deployed > 0 ? 'background:var(--blood);color:#fff;' : 'background:var(--edge);color:var(--muted);cursor:not-allowed;';

  body.innerHTML = `
    <div class="panel steel mb8" style="padding:8px">
      <div style="font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:6px">SELECT UNIT TYPE</div>
      <div style="display:flex;gap:4px;margin-bottom:6px">${typeButtons}</div>
      <div style="display:flex;gap:4px;margin-bottom:4px">${tierButtons}</div>
      ${hint}
      <div style="font-size:10px;color:var(--text);margin-top:6px">Deployed: <span style="color:var(--gold);font-weight:900">${deployed}</span> units</div>
    </div>
    <div style="display:flex;gap:6px">
      <button onclick="engageInvasion()" style="flex:1;padding:8px;border:1px solid var(--edge);font-size:11px;letter-spacing:2px;font-weight:900;${engageStyle}">
        ⚔ ENGAGE${deployed > 0 ? ' — ' + deployed + ' TROOPS' : ''}
      </button>
      ${deployed > 0 ? `<button onclick="_clearDeployedUnits()" style="padding:8px 10px;border:1px solid var(--edge);background:var(--edge);color:var(--muted);font-size:10px;cursor:pointer;">✗ CLEAR</button>` : ''}
    </div>`;
}

function _availForDeploy(type, tier) {
  const key = 't' + tier;
  const total = state.troops[type][key] || 0;
  const used = state.invasion.playerUnits.filter(u => u.type === type && u.tier === tier).length;
  return Math.max(0, total - used);
}

function _clearDeployedUnits() {
  state.invasion.playerUnits = [];
  renderLaneGrid();
  const canvas = document.getElementById('invasion-map');
  _drawBattlefield(canvas, performance.now());
}

function selectDeployType(type, tier) {
  state.invasion.deployType = type;
  state.invasion.deployTier = tier;
  renderLaneGrid();
}

function _onBattlefieldClick(e) {
  if (state.invasion.phase !== 'deploy') return;
  const canvas = e.currentTarget;
  const rect = canvas.getBoundingClientRect();
  const nx = (e.clientX - rect.left) / rect.width;
  const ny = (e.clientY - rect.top) / rect.height;

  if (ny < 0.60) {
    toast('// DEPLOY IN YOUR ZONE (lower half) //');
    return;
  }

  const { deployType, deployTier } = state.invasion;
  if (_availForDeploy(deployType, deployTier) <= 0) {
    toast('// NO ' + deployType.toUpperCase() + ' T' + deployTier + ' AVAILABLE //');
    return;
  }

  state.invasion.playerUnits.push(_makeUnit('player', deployType, deployTier, nx, ny));
  renderLaneGrid();
  _drawBattlefield(canvas, performance.now());
}

function engageInvasion() {
  if (state.invasion.playerUnits.length === 0) { toast('// DEPLOY TROOPS FIRST //'); return; }
  _startBattle();
}

function _startBattle() {
  state.invasion.phase = 'battle';
  document.getElementById('inv-phase').textContent = 'BATTLE';
  document.getElementById('inv-body').innerHTML = '<div style="font-size:10px;color:var(--muted);text-align:center;padding:10px;letter-spacing:2px">// BATTLE IN PROGRESS //</div>';
  const canvas = document.getElementById('invasion-map');
  canvas.style.cursor = 'default';
  canvas.onclick = null;

  _hitFlashes = [];
  _battleInterval = setInterval(_battleTick, 125);

  const loop = (now) => {
    if (state.invasion.phase !== 'battle') return;
    _drawBattlefield(document.getElementById('invasion-map'), now);
    _battleRaf = requestAnimationFrame(loop);
  };
  _battleRaf = requestAnimationFrame(loop);
}

function _battleTick() {
  const inv = state.invasion;
  if (inv.phase !== 'battle') { clearInterval(_battleInterval); _battleInterval = null; return; }

  const players = inv.playerUnits.filter(u => !u.dead);
  const enemies = inv.enemyUnits.filter(u => !u.dead);

  if (players.length === 0 || enemies.length === 0) {
    _endBattle(players.length > 0 ? 'victory' : 'defeat');
    return;
  }

  const allUnits = [...players, ...enemies];

  allUnits.forEach(u => {
    if (u.dead) return;
    const foes = (u.side === 'player' ? enemies : players).filter(f => !f.dead);
    if (foes.length === 0) return;

    let nearest = null, nearestDist = Infinity;
    foes.forEach(f => {
      const dx = f.x - u.x, dy = f.y - u.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < nearestDist) { nearestDist = d; nearest = f; }
    });
    if (!nearest) return;

    u.angle = Math.atan2(nearest.y - u.y, nearest.x - u.x);

    if (nearestDist <= u.range) {
      if (u.cooldown <= 0) {
        const dmg = u.atk * (0.85 + Math.random() * 0.30);
        nearest.hp -= dmg;
        nearest.hitFlash = 8;
        _hitFlashes.push({ x: nearest.x, y: nearest.y, r: 0.015, alpha: 1.0, born: performance.now() });
        if (nearest.hp <= 0) nearest.dead = true;
        u.cooldown = u.baseCd;
      } else {
        u.cooldown--;
      }
    } else {
      const dx = nearest.x - u.x, dy = nearest.y - u.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      u.x += (dx / dist) * u.spd;
      u.y += (dy / dist) * u.spd;
      u.x = Math.max(0.01, Math.min(0.99, u.x));
      u.y = Math.max(0.01, Math.min(0.99, u.y));
      if (u.cooldown > 0) u.cooldown--;
    }
  });

  inv.playerUnits = inv.playerUnits.filter(u => !u.dead || u.hitFlash > 0);
  inv.enemyUnits = inv.enemyUnits.filter(u => !u.dead || u.hitFlash > 0);
  inv.playerUnits.forEach(u => { if (u.dead && u.hitFlash > 0) u.hitFlash--; });
  inv.enemyUnits.forEach(u => { if (u.dead && u.hitFlash > 0) u.hitFlash--; });

  const alivePlayers = inv.playerUnits.filter(u => !u.dead).length;
  const aliveEnemies = inv.enemyUnits.filter(u => !u.dead).length;
  if (alivePlayers === 0 || aliveEnemies === 0) {
    setTimeout(() => _endBattle(alivePlayers > 0 ? 'victory' : 'defeat'), 400);
  }
}

function _endBattle(result) {
  clearInterval(_battleInterval); _battleInterval = null;
  cancelAnimationFrame(_battleRaf); _battleRaf = null;
  state.invasion.phase = 'done';
  state.invasion.battleResult = result;
  document.getElementById('inv-phase').textContent = result === 'victory' ? 'VICTORY' : 'DEFEATED';

  // Apply troop losses — remove dead units from state.troops
  const killed = { infantry: { t1: 0, t2: 0, t3: 0 }, tanks: { t1: 0, t2: 0, t3: 0 }, cavalry: { t1: 0, t2: 0, t3: 0 } };
  state.invasion.playerUnits.filter(u => u.dead).forEach(u => killed[u.type]['t' + u.tier]++);
  ['infantry', 'tanks', 'cavalry'].forEach(type => {
    [1, 2, 3].forEach(tier => {
      const key = 't' + tier;
      state.troops[type][key] = Math.max(0, (state.troops[type][key] || 0) - killed[type][key]);
    });
  });

  const canvas = document.getElementById('invasion-map');
  _drawBattlefield(canvas, performance.now());

  const survPlayers = state.invasion.playerUnits.filter(u => !u.dead).length;
  const totalDeployed = state.invasion.playerUnits.length;
  const lost = totalDeployed - survPlayers;

  const body = document.getElementById('inv-body');
  if (result === 'victory') {
    body.innerHTML = `
      <div class="panel mil mb8" style="padding:10px">
        <div style="font-size:14px;font-weight:900;letter-spacing:2px;color:var(--mil)">✓ VICTORY</div>
        <div style="font-size:11px;color:var(--text);margin-top:6px">${survPlayers} survivors · ${lost} fallen</div>
      </div>
      <div class="center">
        <button class="gal-btn mil" onclick="finalizeVictory(${state.invasion.contIdx})"><div class="gal-btn-inner">✓ Claim Territory</div></button>
      </div>`;
    toast('// INVASION SUCCESSFUL — TERRITORY SECURED //');
  } else {
    body.innerHTML = `
      <div class="panel blood mb8" style="padding:10px">
        <div style="font-size:14px;font-weight:900;letter-spacing:2px;color:var(--blood)">✗ DEFEATED</div>
        <div style="font-size:11px;color:var(--text);margin-top:6px">All ${totalDeployed} troops lost. Regroup and attack again.</div>
      </div>
      <div class="center">
        <button class="gal-btn blood" onclick="openInvasion(${state.invasion.contIdx})"><div class="gal-btn-inner">↺ Regroup &amp; Attack Again</div></button>
      </div>`;
    toast('// ASSAULT REPELLED — ALL TROOPS LOST //');
  }
  document.getElementById('troop-bar-inv').innerHTML = troopHTML();
}

function _drawBattlefield(canvas, now) {
  if (!canvas) return;
  const W = canvas.width || 360;
  const H = canvas.height || 420;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#0b0d08';
  ctx.fillRect(0, 0, W, H);

  // Zone tints
  ctx.fillStyle = 'rgba(192,48,16,0.08)';
  ctx.fillRect(0, 0, W, H * 0.40);
  ctx.fillStyle = 'rgba(90,138,60,0.08)';
  ctx.fillRect(0, H * 0.60, W, H * 0.40);

  // Grid
  ctx.strokeStyle = 'rgba(100,100,80,0.12)';
  ctx.lineWidth = 1;
  const GRID = 30;
  for (let x = 0; x < W; x += GRID) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += GRID) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // Zone labels
  if (state.invasion.phase === 'deploy') {
    ctx.fillStyle = 'rgba(192,48,16,0.5)';
    ctx.font = '9px monospace';
    ctx.fillText('ENEMY ZONE', 6, 14);
    ctx.fillStyle = 'rgba(90,138,60,0.5)';
    ctx.fillText('YOUR ZONE — CLICK TO DEPLOY', 6, H - 6);

    // Dashed neutral line
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(212,168,50,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, H * 0.60); ctx.lineTo(W, H * 0.60); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Hit flash particles
  _hitFlashes = _hitFlashes.filter(f => (now - f.born) < 300);
  _hitFlashes.forEach(f => {
    const age = (now - f.born) / 300;
    const alpha = (1 - age) * 0.8;
    const r = (f.r + age * 0.03) * W;
    ctx.beginPath();
    ctx.arc(f.x * W, f.y * H, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,180,50,${alpha})`;
    ctx.fill();
  });

  // Draw units
  const allUnits = [...(state.invasion.enemyUnits || []), ...(state.invasion.playerUnits || [])];
  allUnits.forEach(u => _drawUnit(ctx, u, W, H, now));
}

function _drawUnit(ctx, u, W, H, now) {
  const px = u.x * W, py = u.y * H;
  const SIZE = u.type === 'tanks' ? 9 : u.type === 'cavalry' ? 7 : 6;
  const isDead = u.dead;
  const alpha = isDead ? 0.3 : 1.0;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);

  const flash = (u.hitFlash || 0) > 0;

  if (u.type === 'infantry') {
    // Circle
    const color = u.side === 'player' ? (flash ? '#fff' : '#5a8a3c') : (flash ? '#ff8080' : '#c03010');
    ctx.beginPath();
    ctx.arc(0, 0, SIZE, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = u.side === 'player' ? '#8acc6a' : '#ff6040';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  } else if (u.type === 'tanks') {
    // Square
    const color = u.side === 'player' ? (flash ? '#fff' : '#d4a832') : (flash ? '#ff8080' : '#a02808');
    ctx.rotate(u.angle);
    ctx.fillStyle = color;
    ctx.fillRect(-SIZE, -SIZE, SIZE * 2, SIZE * 2);
    ctx.strokeStyle = u.side === 'player' ? '#f0cc60' : '#ff4020';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-SIZE, -SIZE, SIZE * 2, SIZE * 2);
    // barrel
    ctx.strokeStyle = u.side === 'player' ? '#f0cc60' : '#ff4020';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(SIZE + 4, 0); ctx.stroke();
  } else {
    // Triangle for cavalry
    const color = u.side === 'player' ? (flash ? '#fff' : '#c87428') : (flash ? '#ff8080' : '#901818');
    ctx.rotate(u.angle + Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(0, -SIZE);
    ctx.lineTo(SIZE * 0.8, SIZE * 0.7);
    ctx.lineTo(-SIZE * 0.8, SIZE * 0.7);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = u.side === 'player' ? '#f0a050' : '#ff5030';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.restore();

  // HP bar (only if alive)
  if (!isDead && u.hp < u.maxHp) {
    const barW = 16, barH = 3;
    const bx = px - barW / 2, by = py - SIZE - 6;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);
    const pct = Math.max(0, u.hp / u.maxHp);
    const barColor = pct > 0.5 ? '#5a8a3c' : pct > 0.25 ? '#d4a832' : '#c03010';
    ctx.fillStyle = barColor;
    ctx.fillRect(bx, by, barW * pct, barH);
  }

  // Tier icon (tiny text)
  if (!isDead) {
    ctx.save();
    ctx.font = '8px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(TIER_ICONS[u.type][u.tier - 1], px, py + SIZE + 7);
    ctx.restore();
  }

  if (u.hitFlash > 0) u.hitFlash--;
}

function upgradeBuilding(){
  const b=state.selBldg,cost=120*b.level*b.level;
  if(state.res.metal<cost){toast('// INSUFFICIENT METAL //');return;}
  state.res.metal-=cost;b.level++;
  toast(`// ${BUILDINGS[b.type].short} → LVL ${b.level} //`);
  openBuilding(b,state.selCont);
}

function doResearch(idx,cost){
  if(state.researchDone.has(idx)){toast('// ALREADY RESEARCHED //');return;}
  if(state.res.research<cost){toast(`// NEED ${cost} RESEARCH //`);return;}
  state.res.research-=cost;state.researchDone.add(idx);
  toast(`// ${RESEARCH[idx].name.toUpperCase()} UNLOCKED //`);
  openBuilding(state.selBldg,state.selCont);
}

function doTroopResearch(idx,cost){
  if(state.troopResearchDone.has(idx)){toast('// ALREADY RESEARCHED //');return;}
  const prereqIdx=TROOP_PREREQS[idx];
  if(prereqIdx!==undefined&&!state.troopResearchDone.has(prereqIdx)){
    toast('// REQUIRES: '+TROOP_RESEARCH[prereqIdx].name.toUpperCase()+' //');return;
  }
  if(state.res.research<cost){toast(`// NEED ${cost} RESEARCH //`);return;}
  state.res.research-=cost;state.troopResearchDone.add(idx);
  toast(`// ${TROOP_RESEARCH[idx].name.toUpperCase()} UNLOCKED //`);
  openBuilding(state.selBldg,state.selCont);
}

function activateOverdrive(uid,cost){
  if(state.res.excellorant<cost){toast(`// NEED ${cost} EXCELLORANT //`);return;}
  state.res.excellorant-=cost;
  state.overdrive[uid]=Date.now()+30000;
  toast('// OVERDRIVE ACTIVATED — 30s //');
  openBuilding(state.selBldg,state.selCont);
}
